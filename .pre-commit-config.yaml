# Pre-commit hooks: линт, формат, типы, базовые проверки.
# Local hooks запускаются через `uv run` — используют версии из pyproject (uv.lock).
exclude: '^tests/fixtures/'   # не трогаем снимки реальных HTML-страниц

repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: subprojects-lint
        name: subprojects (ruff + format + mypy, без тестов)
        entry: bash scripts/check_subprojects.sh lint
        language: system
        pass_filenames: false
        always_run: true

      - id: traceability
        name: traceability (требование ↔ код ↔ тест)
        entry: uv run python scripts/check_traceability.py --strict
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: debug-statements
      - id: check-merge-conflict

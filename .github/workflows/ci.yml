name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zakupki_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZAKUPKI_TEST_DSN: postgresql+asyncpg://postgres:postgres@localhost:5433/zakupki_test
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        # Полная версия: у setup-uv major-теги есть только до v7, @v8/@v9 не резолвятся.
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.9.26"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Playwright Chromium
        run: uv run playwright install chromium --with-deps

      - name: Lint (ruff check)
        run: uv run ruff check src tests

      - name: Format check (ruff format)
        run: uv run ruff format --check src tests

      - name: Type check (mypy)
        # Область проверки — из [tool.mypy] files (src/zakupki_parser + tests).
        # Подпроекты (scoring_service/scoring_transport) — отдельные пакеты и
        # проверяются собственным mypy.
        run: uv run mypy

      - name: Tests (pytest)
        run: uv run pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t zakupki-parser:ci .

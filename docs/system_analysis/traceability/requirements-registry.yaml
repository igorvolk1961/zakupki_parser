  - id: US-5.7
    type: US
    title: Добавить фрагмент текста карточки в исключения
    stakeholder: Тендеролог (user)
    stage: "7"
    status: implemented
    adr: "-"
    code:
      - src/zakupki_parser/storage/repository/profiles.py#add_exclusion_word
      - src/zakupki_parser/api/app/routes/procurements.py#add_procurement_exclusion_word
      - src/zakupki_parser/api/app/state.py#_sync_profile_results
      - src/zakupki_parser/api/static/js/procurements.js
    tests:
      - tests/integration/test_decisions_work.py
      - tests/integration/test_api.py
      - tests/integration/test_multiclient.py
    notes: >-
      Кнопка «В исключения» в карточке закупки (по умолчанию недоступна;
      включается выделением непустого фрагмента текста мышью в карточке).
      В отличие от US-5.1/5.2 (отбраковка с опциональным exclusion_word), это
      точечное действие НЕ меняет статус закупки — только добавляет фразу в
      исключения активного профиля (идемпотентно, ``add_exclusion_word``,
      общий метод с ``reject``). Если правый край выделения приходится на
      середину слова — к фразе добавляется хвостовая «*» (стеб-поиск, см.
      ``filtering.py#_token_regex``); обрыв слева на wildcard не влияет —
      движок фильтрации поддерживает только хвостовой wildcard, ведущую «*»
      добавлять было бы бессмысленно (решение подтверждено с пользователем).

      БАГ (2026-09, «похоже, не работает фильтр на слова-исключения»):
      добавление слова само по себе писало только строку в ``keywords`` — уже
      отобранные закупки (``procurement_evaluations``), которые это слово
      ДОЛЖНО было исключить, никак не пересматривались и оставались видны до
      следующего сохранения профиля/«Обновить сейчас» (сам факт вставки слова
      не запускал ``rebuild_profile_results``). Исправлено: при реальном
      добавлении нового слова (``added=True``) эндпоинт сразу вызывает
      ``_sync_profile_results`` — ту же функцию, что и сохранение/
      принудительное обновление профиля (``routes/clients.py``, общая
      реализация вынесена из ``_request_refresh_for`` в ``state.py``, чтобы не

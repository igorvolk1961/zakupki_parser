  - id: US-10.6
    type: US
    title: "Триал 14 дней: платные опции включены, кроме скоринга по компетенциям (пользователь включает его сам)"
    stakeholder: Тендеролог (user)
    stage: "6"
    status: implemented
    adr: "-"
    code:
      - src/zakupki_parser/options.py
      - src/zakupki_parser/api/app/routes/auth.py
      - src/zakupki_parser/api/app/deps.py#require_user
      - src/zakupki_parser/storage/repository/accounts.py
      - src/zakupki_parser/storage/repository/users.py#create_user_with_setup
    tests:
      - tests/unit/test_user_options.py
      - tests/integration/test_auth_api.py
    notes: >-
      Фикс (2026-09-13): триал материализуется ОДИН РАЗ, в момент создания
      пользователя (``account_paid_default=True`` в ``auth.py`` для
      саморегистрации — было ``False``), а не runtime-переопределением
      ``effective_options`` во время действия триала. ДО фикса: пока триал
      шёл, ``effective_options`` безусловно включала ВСЕ платные опции
      НЕЗАВИСИМО от ``account.options`` (который создавался целиком
      выключенным) — пользователь физически не мог выключить отдельную опцию
      во время триала: чекбокс в личном кабинете снимался, но на фактический
      доступ это не влияло. Теперь account.options — единственный источник
      истины даже во время триала (``in_trial``/``trial_end_at`` остались
      информационными полями). По истечении ``trial_end_at`` — лениво, при
      первом запросе после истечения (``require_user`` -> ``AccountMixin.
      downgrade_expired_trial``) — платные опции активного аккаунта
      сбрасываются в выключено и ``trial_end_at`` очищается: реальное
      ограничение доступа через 14 дней, а не просто runtime-флаг.

      Уточнение (2026-09-21): при материализации триала саморегистрации скоринг
      по компетенциям (LLM) и его эмбеддинги (``scoring``/``scoring_embeddings``)
      больше НЕ включаются автоматически — это платная обработка КАЖДОЙ закупки,
      которую пользователь включает сам, явно, в личном кабинете (создание
      пользователя администратором не изменилось — там по-прежнему включено
      всё, осознанное предоставление доступа). Остальные
      реализованные платные опции (анализ закупки, заполнение профиля по
      сайту — опция ``profile_from_url``, см. FR-10.12, pwin, margin)
      по-прежнему включаются сразу — это разовые/выборочные операции по
      явному запросу пользователя, а не фоновая обработка всей базы закупок.
      ``account_paid_default: bool`` в ``create_user_with_setup`` заменён на
      ``account_options: dict[str, bool]`` (``options.trial_default_options()``
      для саморегистрации, ``options.paid_default_options(enabled=True)`` — без
      изменений, для создания пользователя администратором).

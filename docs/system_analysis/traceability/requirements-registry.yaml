  - id: US-11.1
    type: US
    title: Обнаружение закупок из индекса вместо живого обхода (Stage B/D плана «индекс как основной механизм discovery»)
    stakeholder: Тендеролог (user), Аналитик
    stage: "3, 4"
    status: implemented
    adr: ADR-2
    code:
      - src/zakupki_parser/storage/repository/procurements.py#rebuild_profile_results
      - src/zakupki_parser/scheduler.py#_build_system_index_ctx
      - src/zakupki_parser/scheduler.py#_split_ctxs_for_index_routing
      - src/zakupki_parser/scheduler.py#_sync_profiles_via_index
      - src/zakupki_parser/scheduler.py#request_profile_refresh
      - src/zakupki_parser/scheduler.py#_run_refresh_pass
      - src/zakupki_parser/scheduler.py#_regular_loop
      - src/zakupki_parser/scheduler.py#_refresh_loop
      - src/zakupki_parser/scheduler.py#_get_platform_sem
      - src/zakupki_parser/scheduler.py#_get_domain_sem
      - src/zakupki_parser/api/app/routes/clients.py#_collection_notice
      - src/zakupki_parser/api/app/routes/clients.py#_request_refresh_for
      - src/zakupki_parser/api/app/routes/clients.py#refresh_client
      - src/zakupki_parser/api/app/state.py#_sync_profile_results
      - src/zakupki_parser/okpd.py#okpd_codes_coverage
      - src/zakupki_parser/parser/orchestrator/context.py
      - src/zakupki_parser/parser/orchestrator/orchestrator/__init__.py#_build_units
    tests:
      - tests/integration/test_repository.py
      - tests/integration/test_multiclient.py
      - tests/unit/test_scheduler_parallel.py
      - tests/unit/test_okpd_prefixes.py
    notes: >-
      Маршрутизация — ПО КОДУ ОКПД2, не по профилю целиком
      (``_split_ctxs_for_index_routing``): у профиля с несколькими кодами
      часть может быть покрыта ``IndexingConfig.okpd2_prefixes``, часть нет —
      покрытые коды синхронизируются из БД (``_sync_profiles_via_index`` ->
      ``rebuild_profile_results``, полный профиль — сам сверяет найденную
      закупку с полным диапазоном), непокрытые получают живой обход, но
      УЗКИЙ — только по остатку (``ProfileRunContext.crawl_okpd_codes``,
      подхватывается ``Orchestrator._build_units`` ВМЕСТО ``profile.
      okpd_codes`` при построении критериев обхода; сам ``profile`` не
      меняется — матчинг/скоринг видят полный исходный диапазон). Профиль без
      покрытых кодов вовсе — обычный живой обход без сужения, как до Stage D.
      Системный индексный профиль (``is_system_index``) — всегда живым обходом
      целиком, он и есть источник данных для индекса.

      Применяется одинаково и к регулярному циклу (``run_once``), и к
      внеочередному fast-start обходу при правке профиля (``_run_refresh_
      pass``) — ДО этого фикса внеочередной обход ВСЕГДА делал полный живой
      full-window обход после «горячего» пересбора, независимо от покрытия
      индексом, что делало самый частый пользовательский путь (правка
      профиля) самым медленным без реальных оснований: синхронизация из БД
      уже даёт даже БОЛЕЕ полную ретроспективу для покрытых кодов (не
      ограничена окном ``default_cutoff_days``, в отличие от живого обхода).

      Первая версия этого фикса (до правки по итогам ревью) ошибочно
      маршрутизировала ПО ПРОФИЛЮ ЦЕЛИКОМ (``all_okpd_codes_covered_by_
      prefixes``, требовала ПОЛНОГО покрытия всех кодов профиля) — частично
      покрытый профиль не получал вообще никакой оптимизации. Переделано на
      маршрутизацию по коду по прямому указанию пользователя.

      Stage B (2026-09): ``rebuild_profile_results`` раньше ДОПОЛНИТЕЛЬНО
      проверял «код закупки входит в ТЕКУЩИЙ ``indexing.okpd2_prefixes``» — не
      нужная и неверная проверка (закупка могла быть проиндексирована раньше,
      при другом диапазоне, и остаётся полноценно проиндексированной
      независимо от текущей настройки); убрана, единственное условие теперь —
      ``procurement_search_index.status == 'indexed'`` для конкретной закупки
      (через JOIN). Параметр переименован ``indexing_okpd2_prefixes: list[str]
      | None`` -> ``use_document_index: bool``.

      Throttle вместо debounce+кап «раз за регулярный цикл» (2026-09,
      ``request_profile_refresh``/``run_service``/``_run_refresh_pass``): ДО
      этого фикса внеочередной обход профиля искусственно задерживался перед
      ПЕРВЫМ обходом (trailing debounce от последней правки — незачем,
      защищать ещё не от чего) И был ограничен «не больше одного full-window
      обхода профиля за регулярный цикл» — жёсткий кап БЕЗ debounce,
      независимый от него: при ``profile_refresh_debounce_seconds=0``
      («без ограничения частоты») повторная правка профиля в течение того же
      часового цикла всё равно откладывалась до его границы (до часа), что
      обесценивало быстрый путь через индекс именно для самого частого
      сценария — пользователь донастраивает профиль (код/слова) сразу после
      создания. Новая модель — throttle: первый обход профиля стартует
      немедленно (``_refresh_last_run_at`` пуст), повторный — не раньше чем
      через ``profile_refresh_debounce_seconds`` ПОСЛЕ ЗАВЕРШЕНИЯ предыдущего
      обхода ЭТОГО профиля (не от границы цикла и не от последней правки).
      ``Scheduler.profile_refresh_status``/``_collection_notice`` (уведомление
      при сохранении профиля) обновлены под новую семантику (``remaining_
      seconds`` из throttle, поле ``handled_this_cycle`` убрано как устаревшее).

      Внеочередной обход параллельно регулярному (2026-09, ``run_service``
      разбит на ``_regular_loop``/``_refresh_loop``): ДО этого фикса throttle
      уже верно считал профиль готовым к обходу немедленно, но реально
      запустить обход планировщик всё ещё мог только МЕЖДУ регулярными
      проходами — если regулярный проход (типично первый после старта
      парсера, «холодный», без ``last_processed_date``, поэтому особенно
      долгий) уже шёл, готовый внеочередной обход просто ждал его завершения.
      ``_regular_loop``/``_refresh_loop`` теперь независимые параллельные
      циклы (``asyncio.create_task`` + ``asyncio.gather`` в ``run_service``);
      каждый готовый профиль обходится ОТДЕЛЬНОЙ детached-задачей
      (``_run_refresh_pass_guarded``, отслеживается в ``_refresh_tasks`` и
      явно отменяется в ``stop()`` — ``asyncio.create_task`` создаёт
      независимую задачу, отмена родительской ``run_service`` её саму по себе
      не отменяет). Суммарная нагрузка на площадки при параллельно идущих
      проходах по-прежнему ограничена настроенными лимитами — семафоры
      конкурентности (``_get_platform_sem``/``_get_domain_sem``) стали ОБЩИМИ
      на все проходы (раньше пересоздавались на каждый ``_run_platform_pass``
      отдельно, что при двух одновременных проходах суммарно удвоило бы
      конкурентность к одной площадке); при этом лимит по-прежнему
      перечитывается из конфига при каждом получении семафора — горячая
      правка ``config_parser.yaml`` (без рестарта парсера,
      ``routes/config.py``: ``state_setter=lambda m: setattr(state.cfg,
      "parser", m)``) продолжает применяться без задержки.

      Кнопка «Обновить сейчас» на вкладке «Закупки» (``POST /api/clients/
      {id}/refresh``, ``refresh_client``): принудительный внеочередной обход
      активного профиля БЕЗ изменения самого профиля — тот же fast-start путь
      (``_request_refresh_for(profile, rebuild=True)``) и та же throttle-защита
      (``profile_refresh_debounce_seconds``, общая с обычными правками
      профиля — throttle привязан к id профиля, а не к причине запроса).

      Синхронный пересбор без планировщика для полностью покрытых профилей
      (2026-09, ``_request_refresh_for``/``okpd_codes_coverage``): ДО этого
      фикса ЛЮБАЯ правка/сохранение/«Обновить сейчас» профиля — даже профиля,
      чьи коды ОКПД2 ЦЕЛИКОМ покрыты фоновой индексацией и живому обходу
      вообще не подлежат (см. выше) — всё равно шла через ``Scheduler.
      request_profile_refresh``: throttle (``profile_refresh_debounce_
      seconds``) применялся и к нему без надобности, а если парсер был
      остановлен (``state.parser_scheduler is None``) — запрос просто
      копился в ``pending_profile_refresh_ids`` и ничего не происходило до
      ручного запуска мониторинга, хотя вся нужная работа — локальный запрос
      к БД, к площадкам обращаться не нужно вовсе. Теперь ``_request_refresh_
      for`` сам проверяет покрытие (``okpd_codes_coverage``, тот же критерий
      по коду, что и ``_split_ctxs_for_index_routing``, но на уровне ПРОФИЛЯ
      целиком — ``any_covered``/``fully_covered``): при ``any_covered``
      результаты синхронно пересобираются прямо в запросе (``rebuild_profile_
      results``, ``use_document_index=True``, без throttle, без планировщика);
      при ``fully_covered`` профиль ДОПОЛНИТЕЛЬНО у планировщика уже не
      просится вовсе (нечего обходить живьём); при частичном покрытии —
      синхронный пересбор ВСЁ РАВНО выполняется (мгновенные результаты по
      покрытой части), но планировщик по-прежнему просится для непокрытого
      остатка — throttle защищает именно живой обход, единственную часть,
      реально обращающуюся к площадкам. ``_collection_notice`` сообщает
      пользователю, что обход площадок не требовался, вместо throttle-
      уведомления.

  - id: US-11.2
    type: US
    title: "Явный выбор «Все площадки» — пустой список target_etp больше не значит «все»"
    stakeholder: Тендеролог (user)
    stage: "3, 4"
    status: implemented
    adr: "-"
    code:
      - src/zakupki_parser/storage/db/profile.py
      - src/zakupki_parser/storage/db/__init__.py
      - src/zakupki_parser/scheduler.py#_profile_on_platform
      - src/zakupki_parser/parser/orchestrator/orchestrator/__init__.py#_platform_selects
      - src/zakupki_parser/storage/repository/procurements.py#rebuild_profile_results
      - src/zakupki_parser/api/static/js/clients.js
      - docker/liquibase/changelog/db.changelog-1.62.yaml
    tests:
      - tests/unit/test_scheduler_parallel.py
      - tests/integration/test_repository.py
      - tests/unit/test_orchestrator_keywords.py
    notes: >-
      До этого фикса пустой ``profiles.target_etp`` трактовался кодом как «нет
      фильтра — все площадки» (``Scheduler._profile_on_platform``: ``not etp
      or platform_id in etp``, аналогично ``Orchestrator._platform_selects`` и
      ``ProcurementRepository.rebuild_profile_results``), при этом в форме
      профиля пустой список площадок визуально выглядел как «ничего не
      выбрано» — вводящее в заблуждение расхождение UI и фактического
      поведения (источник путаницы пользователя: профиль без единой
      отмеченной площадки продолжал обходиться по всем).

      Семантика инвертирована: пустой ``target_etp`` теперь означает «ни одной
      площадки», а «все площадки, включая добавленные позже» выражается явным
      маркером ``ALL_PLATFORMS_SENTINEL = "__all__"`` внутри того же
      ``list[str]`` (не отдельная nullable-колонка — минимальный след
      миграции, по аналогии с существующими зарезервированными значениями типа
      ``SYSTEM_INDEX_PROFILE_ID``). Новый профиль по умолчанию создаётся с
      ``["__all__"]`` (форма — с отмеченным чекбоксом «Все площадки»).
      Существующие профили с пустым ``target_etp`` мигрированы на
      ``["__all__"]`` (changeset 64, ``UPDATE ... WHERE target_etp = '[]'``),
      чтобы фактический охват площадок не сузился молча при деплое этого
      изменения.

      UI (``clients.js#renderPlatformTable``): чекбокс «Все площадки» сверху
      списка площадок профиля; при отметке — таблица индивидуального выбора
      скрывается (нет смысла редактировать список, который игнорируется);
      при снятии — таблица площадок показывается, пустой список сопровождается
      явным предупреждением «Площадки не выбраны — обход не будет выполняться
      ни по одной площадке» вместо молчаливого поведения «всё равно обходим
      всё».


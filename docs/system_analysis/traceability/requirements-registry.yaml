# Требования → код → тесты (источник правды трассировки)
#
# Единый машиночитаемый реестр трассируемости. Формат и валидация — scripts/check_traceability.py.
# Редактировать только здесь; человекочитаемая матрица 04_traceability_matrix.md — производное
# представление и вручную не правится.
#
# Поля:
#   id          — US-* | FR-* | BR-* | NFR-* (уникален)
#   type        — US | FR | BR | NFR
#   title       — краткое название
#   stakeholder — роль из 01_Business_Context/02_stakeholders.md
#   stage       — этап реализации (plans/plan.md)
#   status      — implemented | partial | planned | out-of-scope
#   adr         — ссылка на docs/adr.md (ADR-* или "-")
#   code        — пути модулей (файл или каталог) или «файл#функция/класс» для критичных сценариев
#   tests       — пути тест-файлов (tests/** и src/*/tests/**)
#   covered_by  — для NFR: id требования, которое данное NFR покрывает (необязательно)
#   notes       — примечание
#

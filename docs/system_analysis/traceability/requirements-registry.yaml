  - id: FR-10.12
    type: FR
    title: Заполнение профиля (компетенции + лицензии) по URL сайта поставщика (LLM)
    stakeholder: Тендеролог (user)
    stage: "5"
    status: implemented
    adr: "-"
    code:
      - src/zakupki_parser/api/app/profile_source.py
      - src/zakupki_parser/api/app/routes/clients.py
      - src/zakupki_parser/api/app/schemas.py
      - src/zakupki_parser/storage/competencies.py
      - src/zakupki_parser/storage/db/profile.py
      - src/zakupki_parser/storage/repository/profiles.py
      - src/zakupki_parser/storage/profile_json.py
      - docker/liquibase/changelog/db.changelog-1.63.yaml
      - src/zakupki_parser/api/zakupki.html
      - src/zakupki_parser/api/static/js/clients.js
    tests:
      - tests/unit/test_profile_source.py
      - tests/unit/test_profile_json.py
      - tests/integration/test_api.py
    notes: >-
      Уточнение (2026-09-21): кнопка перенесена с уровня вкладки «Компетенции»
      на уровень профиля в целом (``competency_source.py`` -> ``profile_source.py``,
      опция аккаунта ``competencies_from_url`` -> ``profile_from_url``) — сбор
      данных с сайта клиента теперь заполняет ещё и лицензии (справочник
      ``license_types``).

      Уточнение (2026-09-21, второе): справочник видов лицензий не исчерпывающий
      — лицензии без соответствия в справочнике больше НЕ отбрасываются молча.
      LLM обязана вернуть ``name`` (как лицензия названа на сайте) для КАЖДОЙ
      найденной записи и ``license_type_id`` — ТОЛЬКО если он реально совпадает
      с одним из перечисленных в промпте; ``null`` (или несуществующий id —
      трактуется так же) означает «нет соответствия». Сервер (``_split_licenses``)
      делит результат на ``licenses`` (валидный ``license_type_id`` — готовы к
      сохранению как ``LicenseIn``) и ``unmatched_licenses`` (только текст, без
      привязки к типу — сохранить как запись профиля нельзя, обязателен внешний
      ключ). Фронтенд показывает ``unmatched_licenses`` отдельным списком под
      кнопкой — пользователь может завести недостающий вид в «Справочниках» и
      добавить лицензию вручную.

      Уточнение (2026-09-21, третье): введённый URL сайта сохраняется в самом
      профиле (``profiles.website_url``, миграция 1.63/changeSet 65) — раньше
      поле ввода сбрасывалось при каждом открытии редактора и не входило в
      ``profileFormData()``/``ProfileIn``/экспорт-импорт JSON, из-за чего адрес
      приходилось вводить заново при каждом обновлении. Поле ни на что не
      влияет (не критерий сбора, не в ``_crawl_state_key``) — чистое удобство
      формы.

  # ===== Функциональные требования (группа 11: фоновая индексация по ОКПД2) =====
  - id: FR-11.1
    type: FR
    title: Системный индексный профиль — полный охват закупок диапазона ОКПД2
    stakeholder: DevOps / SRE
    stage: "3, 4"
    status: implemented
    adr: ADR-2
    code:
      - src/zakupki_parser/scheduler.py#_build_system_index_ctx
      - src/zakupki_parser/parser/orchestrator/context.py
      - src/zakupki_parser/config/models/service.py
    tests:
      - tests/unit/test_scheduler_parallel.py
    notes: >-
      Синтетический профиль (IndexingConfig.okpd2_prefixes, не привязан к
      пользователю) участвует в обычном мультипрофильном обходе наравне с
      пользовательскими профилями: пустые ключевые слова -> по семантике R9
      («пустой список — фильтра нет») сохраняются ВСЕ закупки диапазона,
      независимо от совпадения с чьими-либо ключевыми словами.

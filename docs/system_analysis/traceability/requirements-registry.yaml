      - tests/unit/test_scheduler_parallel.py
      - tests/integration/test_repository.py
      - tests/integration/test_api.py
    notes: >-
      Дополняет сводку цикла целиком (FR-11.5) разбивкой ПО КАЖДОЙ площадке:
      GET /api/devops/platform-stats (require_analyst_or_devops, поиск по
      platform_id + фильтр «только сбои» + пагинация limit/offset). Явно
      рассчитано на рост числа площадок далеко за текущие 10 (заказано —
      «более 160»): ``parser_platform_stats`` — ОДНА строка НА ПЛОЩАДКУ (upsert
      по platform_id в Scheduler._process_platform после каждой обработки,
      не insert-per-cycle) — размер таблицы растёт только с числом площадок,
      никогда с числом циклов; среднее (avg_duration_seconds/avg_received/
      avg_saved) считается из накопительных сумм (runs_total/sum_*), без
      хранения истории по циклам. UI-панель («Статистика по площадкам»)
      намеренно НЕ на общем 10с-таймере вкладки (в отличие от остальных
      блоков «Мониторинга») — пере-рендер по таймеру сбрасывал бы поиск/
      пагинацию при сотнях строк; грузится один раз при активации вкладки и
      по явному действию пользователя (поиск/чекбокс/пагинация/«Обновить»),
      тот же принцип, что и у indexingConfigView.
  - id: FR-11.9
    type: FR
    title: "Настраиваемый интервал автообновления и разбивка CPU/RAM по процессам программы"
    stakeholder: DevOps / SRE
    stage: "3, 4"
    status: implemented
    adr: "-"
    code:
      - src/zakupki_parser/api/app/routes/monitoring.py
      - src/zakupki_parser/api/static/js/monitoring.js
      - src/zakupki_parser/api/zakupki.html
    tests:
      - tests/integration/test_api.py
    notes: >-
      Интервал автообновления вкладки «Мониторинг» (``#mon-refresh-interval``:
      5/10/30/60с или «выкл», по умолчанию прежние 10с) — сохраняется в
      localStorage браузера, не на сервере (персональная настройка устройства,
      не часть конфигурации сервиса). При «выкл» данные всё равно обновляются
      при заходе на вкладку (``TAB_LOADERS.monitoring``, main.js) — отдельная
      кнопка «Обновить» не нужна.

      Панель «Ресурсы» дополнена разбивкой по процессам программы
      (``_program_processes``): CPU% и RSS (абсолютно и в % от общей RAM
      хоста) на процесс. CPU% — та же семантика, что и общий
      ``resources.cpu_percent`` (не мгновенный снимок и не фиксированное
      окно, а доля с МОМЕНТА ПРЕДЫДУЩЕГО опроса этого эндпоинта;
      ``psutil.Process.cpu_percent(None)`` через кэш ``_process_cache`` по
      pid между опросами, чтобы не блокировать запрос сном; для процесса,
      впервые попавшего в выдачу, первое значение — заглушка 0.0). Видимость
      процессов ограничена PID-namespace процесса api: сам api-процесс и его
      потомки (``_own_pids``, например headless-браузер парсера) видны
      всегда; отдельные воркеры каскада (scoring_service/pwin_service/
      margin_service/analysis_service/indexing_service/scoring_transport) —
      по тем же меткам cmdline, что использует ``scripts/run_all.sh`` (pgrep
      -f) — видны только когда запущены в ТОМ ЖЕ PID-namespace (локальный
      run_all.sh, все процессы на одном хосте); в docker-стеке (каждый
      сервис — свой контейнер) видно только сам api и его потомков —
      не баг, а ограничение видимости процессов между контейнерами.


      попытками) её больше не трогает — так закупка никогда не теряется
      «навсегда» молча, а требует ручного разбора. DLQ видна и доступна для
      ручного retry аналитику ИЛИ devops (``GET/POST /api/devops/
      index-dead-letter...``, ``require_analyst_or_devops``) — доступ не только
      devops, в отличие от остальной вкладки «Мониторинг».

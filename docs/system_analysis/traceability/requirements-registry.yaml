  - id: US-1.7
    type: US
    title: Поиск ключевых слов в документах закупки
    stakeholder: Тендеролог (user)
    stage: "2"
    status: implemented
    adr: "-"
    code:
      - src/zakupki_parser/storage/db/profile.py
      - src/zakupki_parser/parser/filtering.py
      - src/zakupki_parser/parser/orchestrator/processing.py#_live_fallback_document_text
      - src/zakupki_parser/storage/repository/procurements.py#rebuild_profile_results
    tests:
      - tests/unit/test_profile_json.py
      - tests/unit/test_filtering.py
      - tests/unit/test_api_lister.py
      - tests/integration/test_repository.py
    notes: >-
      Опция профиля search_in_documents. В проиндексированном диапазоне ОКПД2
      (см. Группу 11) ответ мгновенный; вне диапазона — живой фоллбэк во время
      обхода площадки (дозагрузка деталей+файлов, заметно медленнее).

      Фикс (2026-09): фоновая индексация ВСЕГДА извлекает текст документов
      (системный процесс, общий для всех профилей, не зависит ни от одного
      конкретного профиля) — но ``rebuild_profile_results`` (индексный путь,
      Stage B/D) раньше учитывал найденное в документах совпадение
      БЕЗУСЛОВНО, для любого профиля с покрытым кодом ОКПД2, ИГНОРИРУЯ
      ``profile.search_in_documents`` — профиль с выключенным флагом всё
      равно получал совпадения по тексту документов, если закупка была
      проиндексирована. Теперь ``doc_ok`` (внутри ``matched_list``)
      дополнительно требует ``profile.search_in_documents`` — профиль с
      выключенным флагом матчится ТОЛЬКО по ``subject``, даже через
      индексный путь, ровно как и через живой (см. ``processing.py``).
      Флаг остаётся per-profile настройкой «где искать ключевые слова ЭТОГО
      профиля» для ОБОИХ путей — не переключателем «индексировать ли
      документы вообще» (это решение системное и профилю не подвластно).


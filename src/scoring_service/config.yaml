# Конфигурация сервиса скоринга (scoring_service).
#
# Значения из этого файла можно переопределить переменными окружения `SCORE_*`
# (например, `SCORE_USE_STUB=true`, `SCORE_LLM_MODEL=gpt-4o`). Приоритет:
# аргументы > env `SCORE_*` > `.env` > этот YAML > значения по умолчанию.
#
# Путь к файлу можно изменить env `SCORE_CONFIG_FILE`.

# LLM (OpenAI-совместимый: OpenAI / Ollama / прокси)
llm_base_url: "https://api.openai.com/v1"
llm_api_key: "sk-dummy"
llm_model: "gpt-4o-mini"
llm_temperature: 0.0

# Парсер закупок (REST, без прямого доступа к БД)
parser_api_url: "http://localhost:8000"

# Redis-очередь (та же, что у scoring_transport)
redis_url: "redis://localhost:6379/0"
jobs_key: "scoring:jobs"
results_key: "scoring:results"
processing_key: "scoring:processing"
processing_meta_key: "scoring:processing_meta"
processing_ttl_seconds: 600
processing_recovery_priority: 0.0
queue_poll_seconds: 2.0

# Компетенции поставщика
competencies_file: "data/competencies.md"

# Стубы P(win)/Margin (дефолтный подход парсера)
p_win: 1.0
margin_rate: 1.0

# Пайплайн
num_refine_rounds: 1
max_fit_score: 10.0
min_fit_score: 0.0
score_round_digits: 2
normalize_fit_for_score: true

# Заглушка: возвращать score из данных закупки без LLM-пайплайна (пока пайплайн не отлажен)
score_use_stub: true

# LangFuse (пустые значения = выключен)
langfuse_public_key:
langfuse_secret_key:
langfuse_host:

# Опциональная авторизация HTTP-эндпоинтов (пусто = открыто, dev)
auth_token:

# Конфигурация сервиса скоринга (scoring_service).
#
# Значения из этого файла можно переопределить переменными окружения `SCORE_*`
# (например, `SCORE_USE_STUB=true`, `SCORE_LLM_MODEL=gpt-4o`). Приоритет:
# аргументы > env `SCORE_*` > `.env` > этот YAML > значения по умолчанию.
#
# Путь к файлу можно изменить env `SCORE_CONFIG_FILE`.

# LLM (OpenAI-совместимый: OpenAI / Ollama / прокси)
llm_base_url: "https://api.openai.com/v1"
llm_api_key: "sk-dummy"
llm_model: "gpt-4o-mini"
llm_temperature: 0.0

# Парсер закупок (REST, без прямого доступа к БД)
parser_api_url: "http://localhost:8000"

# Redis-очередь (та же, что у scoring_transport)
redis_url: "redis://localhost:6379/0"
jobs_key: "scoring:jobs"
results_key: "scoring:results"
processing_key: "scoring:processing"
processing_meta_key: "scoring:processing_meta"
processing_ttl_seconds: 600
processing_recovery_priority: 0.0
queue_poll_seconds: 2.0

# Компетенции поставщика
competencies_file: "data/competencies.md"

# Пайплайн
num_refine_rounds: 1
max_fit_score: 10.0
min_fit_score: 0.0
score_round_digits: 2
normalize_fit_for_score: true

# Уточнение скора по тексту ТЗ (requires_tz_review): поиск файла ТЗ в карточке,
# извлечение текста и повторный fit/judge по тексту ТЗ.
tz_review_enabled: true
# Таймаут скачивания файла ТЗ (сек).
tz_download_timeout: 30.0

# Параллельная ветка векторной близости (Giga Embedder): сравнение текста
# компетенций и описания закупки через эмбеддинги. Если не задан ключ доступа
# (giga_client_id/giga_client_secret) — ветка не выполняется, но факт пропуска
# фиксируется в метаданных LangFuse-трейса (без падения).
giga_enabled: false
giga_base_url: "https://gigachat.devices.sberbank.ru/api/v1"
# Giga Embedder, окно 4096 токенов (умещает профиль компетенций без разбиения).
giga_embeddings_model: "EmbeddingsGigaR"
giga_auth_url: "https://ngw.devices.sberbank.ru:9443/api/v2/oauth"
giga_client_id: ""
giga_client_secret: ""
giga_auth_scope: "GIGACHAT_API_PERS"
# Влияние ветки на score: 0.0 — ветка не влияет (только диагностика/просмотр).
giga_embedding_alpha: 0.0
# Таймаут запроса эмбеддингов (сек).
giga_timeout_seconds: 30.0
# Порог остаточного времени жизни токена (сек): при значении меньше — обновить.
giga_min_token_ttl_seconds: 60.0
# Проверять SSL-сертификат при обращении к Giga. OAuth (ngw...:9443) использует
# самоподписанный сертификат — для локальной разработки выключить (false).
giga_verify_ssl: true

# Заглушка: возвращать score из данных закупки без LLM-пайплайна (пока пайплайн не отлажен)
score_use_stub: false

# LangFuse (пустые значения = выключен)
langfuse_public_key:
langfuse_secret_key:
langfuse_host:

# Опциональная авторизация HTTP-эндпоинтов (пусто = открыто, dev)
auth_token:

# Структурированный профиль поставщика (строгое разделение слоёв).
#
# Здесь — ТОЛЬКО факты (позиционирование, компетенции, исключения) и, при желании,
# два числовых параметра политики с дефолтами. Правила поведения модели живут в
# системном промпте (scoring_service/pipeline/prompts/fit_system.md), а не здесь.
# Тендеролог заполняет эти поля через форму/UI; сервис сам собирает канонический
# блок «КОМПЕТЕНЦИИ ПОСТАВЩИКА» для LLM (scoring_service/profile.py).

name: "BBK IT (ООО «Юнити»)"
positioning: >
  Внедрение AI в бизнес. Архитекторы бизнес-процессов: сначала проектируют, как
  должен работать бизнес клиента, потом внедряют ИИ, который это реализует. Пилот
  за 2 недели, поддержка 24/7, сопровождение и развитие внедрённых решений.
breadth: broad
competencies:
  - area: "Аудит и обследование ИТ-ландшафта и бизнес-процессов"
    description: >
      Изучение текущего состояния, оценка уровня автоматизации, аудит применимости ИИ,
      AS-IS/TO-BE, проектирование целевой архитектуры, дорожные карты внедрения,
      финансовые модели и расчёт эффекта автоматизации.
    examples:
      - "AS-IS/TO-BE"
      - "дорожные карты внедрения"
      - "финансовые модели эффекта автоматизации"
  - area: "Автоматизация и проектирование бизнес-процессов"
    description: >
      Поиск узких мест, проектирование целевых процессов, автоматизация операционных
      задач, интеграция CRM, ERP, бухгалтерских и складских систем в единый поток,
      настройка автоматических триггеров, уведомлений и отчётов.
  - area: "Внедрение ИИ-решений"
    description: >
      Разработка и внедрение ИИ-ассистентов (свод данных из CRM/ERP/Excel, дашборды
      в реальном времени, ответы на основе базы знаний/RAG), ИИ-юристов (анализ
      договоров, поиск рисков), ИИ-менеджеров (ведение сделок в CRM, коммерческие
      предложения), ИИ-аналитики (тренды, прогнозы, выявление аномалий),
      ИИ-колл-центра (распознавание и тональность речи, оценка звонков через LLM).
  - area: "Разработка и сопровождение программного обеспечения"
    description: >
      Проектирование и разработка веб-платформ, мобильных приложений и внутренних
      сервисов от MVP до масштабирования; дообучение моделей, техническая поддержка
      и развитие решений.
  - area: "Создание AI-контента"
    description: "Генерация видео и изображений с помощью ИИ для рекламы, визуалов и соцсетей."
exclusions:
  - "Продажа, поставка и лицензирование прав на чужое готовое программное обеспечение"
  - "Сопровождение, техническая поддержка и обслуживание готовых legacy-систем сторонних вендоров — если это просто поддержка/обновление существующего чужого продукта без внедрения ИИ и автоматизации"
  - "Поставка, монтаж и настройка аппаратуры и оборудования"
  - "Аудио- и видеоаппаратура, системы видеонаблюдения, звукозаписи и связи"
  - "Физические, строительные, монтажные и иные не-ИТ работы"
# Параметры политики скоринга (необязательно; дефолты совпадают со значениями
# системного промпта и в текст для LLM не выводятся).
#scoring_policy:
#  uncovered_penalty: 1.5
#  ambiguous_range: [4.0, 6.0]

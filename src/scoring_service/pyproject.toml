[project]
name = "scoring-service"
version = "0.1.0"
description = "LLM-сервис скоринга закупок (Langchain + LangFuse): Fit(0-10) × P(win) × Margin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3,<1.0",
    "langchain-openai>=0.2",
    "langfuse>=2.0",
    "redis>=5.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # Извлечение текста из файлов ТЗ (PDF/DOCX) через MarkItDown (scoring_common.tz):
    # Markdown с заголовками и таблицами. Опционально: без них извлекается только
    # plain text (txt/md/html и т.п.).
    "markitdown[docx,pdf]>=0.1.7",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "fakeredis>=2.24",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ANN"]
ignore = [
    "ANN401",
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["scoring_service", "scoring_common"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["."]
exclude = ["tests"]
mypy_path = [".", "../scoring_common"]

[[tool.mypy.overrides]]
module = ["redis.*", "langchain.*", "langchain_openai.*", "langfuse.*", "fastapi.*", "uvicorn.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

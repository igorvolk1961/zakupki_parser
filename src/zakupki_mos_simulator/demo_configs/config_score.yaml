# Конфигурация скоринга закупок.
# Скоринг карточки: Fit × P(win) × Margin.

# Режим расчёта score:
#   default  — внутренняя эвристика в парсере (Fit из таблицы ниже, P(win), Margin=НМЦК);
#   external — расчёт внешним сервисом (на вход передаются все характеристики закупки).
# Демо: external + before_save, внешний сервис — стаб-эндпоинт имитатора /mock/score.
method: "external"

# Адрес внешнего сервиса скоринга (для method: external)
external_service_url: "http://localhost:8010/mock/score"
external_timeout_seconds: 30

# Способ вызова внешнего сервиса (для method: external):
#   before_save — перед записью закупки в БД;
#   worker — отдельным воркером: пробегает по записям со score_method=default,
#            ставит score_method=calculating (чтобы не вызывать повторно),
#            вызывает внешний сервис и обновляет score.
# Демо: before_save — чтобы одиночная команда run-once уже применила внешний
# скоринг (воркер запускается только отдельной командой score-worker).
external_call_mode: "before_save"

# Таблица fit(ОКПД2) — коэффициент соответствия закупки тематике (0..1).
# Ключ — код ОКПД2 (любой вложенности); при отсутствии кода — default_fit.
fit_table:
  "62.01": 0.9
  "62.02": 0.8
  "62.09": 0.7
  "63.11": 0.6

# fit для кода, отсутствующего в fit_table
default_fit: 0.5

# Вероятность победы P(win) (простейшая эвристика = 1.0)
p_win: 1.0

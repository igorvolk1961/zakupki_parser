[project]
name = "scoring-common"
version = "0.1.0"
description = "Общие компоненты каскада скоринга: формула P(win)/Margin, Redis-очередь, клиент парсера"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    # Конвертация docx/pdf в Markdown (заголовки/таблицы) для извлечения текста ТЗ.
    "markitdown[docx,pdf]>=0.1.7",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "fakeredis>=2.24",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ANN"]
ignore = [
    "ANN401",
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["scoring_common"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["."]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["redis.*", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langfuse.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  scoring-service:
    build:
      context: ../../scoring_service
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SCORE_REDIS_URL: redis://redis:6379/0
      SCORE_PARSER_API_URL: http://parser-api:8000
      SCORE_LLM_BASE_URL: ${SCORE_LLM_BASE_URL:-https://api.openai.com/v1}
      SCORE_LLM_API_KEY: ${SCORE_LLM_API_KEY:-}
      SCORE_LLM_MODEL: ${SCORE_LLM_MODEL:-gpt-4o-mini}
      SCORE_USE_STUB: "true"
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
    restart: unless-stopped

  scoring-transport:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      TRANSPORT_REDIS_URL: redis://redis:6379/0
      TRANSPORT_PARSER_API_URL: http://parser-api:8000
    ports:
      - "8200:8200"
    restart: unless-stopped

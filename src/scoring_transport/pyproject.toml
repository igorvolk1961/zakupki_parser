[project]
name = "scoring-transport"
version = "0.1.0"
description = "Транспорт скоринга: REST-ingest, Redis-приоритетная очередь, возврат результата в парсер"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "fakeredis>=2.24",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ANN"]
ignore = [
    "ANN401",
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["scoring_transport"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["."]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["redis.*", "fastapi.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

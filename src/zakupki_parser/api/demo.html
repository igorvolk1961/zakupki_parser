<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Парсер закупок</title>
<style>
  /* Тема по умолчанию — светлая; тёмная переключается через data-theme="dark". */
  html[data-theme="light"], :root {
    --bg: #f5f6fa; --panel: #ffffff; --panel2: #eef1f6; --line: #d8dde6;
    --text: #1f2937; --muted: #6b7280; --accent: #0284c7; --good: #16a34a; --warn: #d97706;
    --on-accent: #ffffff; --sel-bg: #dbeafe;
    --pill-score-bg: #e0f2fe; --pill-score-border: #bae6fd; --pill-score-text: #075985;
  }
  html[data-theme="dark"] {
    --bg: #0f172a; --panel: #1e293b; --panel2: #273449; --line: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; --good: #4ade80; --warn: #fbbf24;
    --on-accent: #06283a; --sel-bg: #0c4a6e;
    --pill-score-bg: #082f49; --pill-score-border: #0c4a6e; --pill-score-text: #38bdf8;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); }
  header { padding: 18px 24px; background: var(--panel); border-bottom:1px solid var(--line);
           display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  header h1 { font-size:18px; margin:0; }
  header .sub { color: var(--muted); font-size:13px; }
  header .header-right { display:flex; align-items:center; gap:18px; }
  .admin-toggle { color: var(--muted); font-size:12px; display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none;}
  .admin-toggle input { margin:0; }
  main { padding: 20px 24px; max-width: 1320px; margin: 0 auto; }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
  input, select, button { background: var(--panel2); border:1px solid var(--line); color: var(--text);
    padding:9px 12px; border-radius:8px; font-size:14px;}
  input:focus, select:focus { outline:none; border-color: var(--accent);}
  button { cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight:600;}
  button.ghost { background: transparent; }
  .tabs { display:flex; gap:6px; margin-bottom:16px;}
  .tabs button { border-radius:20px; }
  .tabs button.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight:600;}
  .tab-count { color: var(--muted); font-weight:400; margin-left:2px; }
  .tabs button.active .tab-count { color: inherit; }
  .panel { background: var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:18px;}
  .panel-title { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color: var(--muted); margin-bottom:8px;}
  .empty { text-align:center; color: var(--muted); padding: 60px 0;}
  .split { display:flex; gap:16px; align-items:flex-start; }
  .proc-list { flex:1 1 auto; min-width:0; max-height:72vh; overflow:auto;
               border:1px solid var(--line); border-radius:10px; background: var(--panel);}
  .proc-list table { width:100%; border-collapse:collapse; font-size:13px; }
  .sort-toggle { display:block; margin-bottom:8px; font-size:13px; color: var(--muted, #888); }
  .sort-toggle select { margin-left:6px; }
  .proc-list th, .proc-list td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:top;}
  .proc-list th { position:sticky; top:0; background: var(--panel2); z-index:1; color: var(--muted); font-weight:600;}
  .proc-list tr { cursor:pointer; }
  .proc-list tr:hover { background: var(--panel2); }
  .proc-list tr.sel { background: var(--sel-bg); }
  .proc-list td.id { color: var(--muted); width:64px; font-family:ui-monospace,monospace; }
  .proc-list .num { color: var(--accent); font-size:12px; font-family:ui-monospace,monospace;}
  .proc-list .subj { margin-top:2px; }
  .proc-detail { flex:0 0 400px; width:400px; max-height:72vh; overflow:auto;
                 display:flex; flex-direction:column; gap:12px; }
  .card { background: var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; cursor:pointer;}
  .card:hover, .card.selcard { border-color: var(--accent); }
  .card .num { color: var(--accent); font-size:13px; font-family:ui-monospace,monospace;}
  .card .subj { font-weight:600; margin:6px 0 10px; line-height:1.35;}
  .card .row { display:flex; justify-content:space-between; font-size:13px; color: var(--muted);
               padding:3px 0; border-top:1px dashed var(--line);}
  .card .row b { color: var(--text); font-weight:600;}
  .pill { font-size:11px; padding:2px 8px; border-radius:20px; background: var(--panel2); border:1px solid var(--line);}
  .pill.score { background: var(--pill-score-bg); border-color: var(--pill-score-border); color: var(--pill-score-text); font-weight:700;}
  .pill.active { background: #dcfce7; border-color: #bbf7d0; color: #166534; font-weight:600;}
  .pill.inactive { background: #fee2e2; border-color: #fecaca; color: #991b1b; font-weight:600;}
  html[data-theme="dark"] .pill.active { background:#052e16; border-color:#14532d; color:#86efac; }
  html[data-theme="dark"] .pill.inactive { background:#450a0a; border-color:#7f1d1d; color:#fca5a5; }
  .modal-bg { position:fixed; inset:0; background:rgba(2,6,23,.7); display:none; align-items:flex-start;
              justify-content:center; padding:40px 16px; overflow:auto; z-index:10;}
  .modal-bg.open { display:flex; }
  .modal { background: var(--panel); border:1px solid var(--line); border-radius:14px; max-width:760px; width:100%; padding:20px;}
  .modal h2 { margin-top:0; font-size:18px;}
  .modal table { width:100%; border-collapse:collapse; font-size:13px; }
  .modal td, .modal th { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top;}
  .modal td:first-child { color: var(--muted); width: 34%; }
  .modal code { color: var(--accent); word-break: break-word;}
  .modal .close { float:right; cursor:pointer; color: var(--muted); font-size:22px; line-height:1;}
  .table-wrap { overflow-x:auto; }
  table.cust { width:100%; border-collapse:collapse; font-size:13px; background: var(--panel); border-radius:12px;}
  table.cust th, table.cust td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line);}
  table.cust th { position:sticky; top:0; background: var(--panel2); color: var(--muted); font-weight:600;}
  .muted { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <div>
    <h1>Парсер закупок</h1>
  </div>
  <div class="header-right">
    <select id="theme" title="Цветовая схема">
      <option value="light">Светлая</option>
      <option value="dark">Тёмная</option>
    </select>
    <label class="admin-toggle" title="Доступ к «Очистить БД», «Выгрузить CSV» и «Параметры»">
      <input type="checkbox" id="admin"> Режим администратора
    </label>
  </div>
</header>
<main>
  <div class="panel" id="parser-panel">
    <div class="panel-title">Парсер</div>
    <div class="toolbar">
      <button id="parser-start">▶ Запустить</button>
      <button class="ghost" id="parser-stop" disabled>■ Остановить</button>
      <button class="ghost" id="db-clear" disabled>Очистить БД</button>
      <button class="ghost" id="db-export">Выгрузить CSV на сервер</button>
      <select id="platform"><option value="">Все площадки</option></select>
      <span id="parser-status" class="muted">проверка…</span>
    </div>
  </div>

  <div class="tabs">
    <button class="active" id="tab-proc">Закупки <span class="tab-count" id="cnt-proc"></span></button>
    <button id="tab-cust">Заказчики <span class="tab-count" id="cnt-cust"></span></button>
    <button id="tab-cfg">Параметры</button>
  </div>

  <div id="view-proc">
    <div class="split">
      <div class="proc-list">
        <label class="sort-toggle">Сортировка:
          <select id="proc-sort">
            <option value="">Как в БД</option>
            <option value="publication_date">По дате публикации</option>
          </select>
        </label>
        <table>
          <thead><tr><th>ID</th><th>Закупка</th><th>Дата публикации</th></tr></thead>
          <tbody id="proc-rows"></tbody>
        </table>
        <div class="empty" id="proc-empty" style="display:none;">Закупок пока нет</div>
      </div>
      <div class="proc-detail" id="proc-detail">
        <div class="empty">Выберите закупку слева<br><span class="muted" style="font-size:12px">Несколько — удерживайте Ctrl при клике</span></div>
      </div>
    </div>
  </div>

  <div id="view-cust" style="display:none;">
    <div class="table-wrap" id="customers"></div>
  </div>

  <div id="view-cfg" style="display:none;">
    <p class="muted">Параметры <code>config_service.yaml</code> (секреты, например токены ботов, не редактируются — берутся из env). После сохранения применяются при следующем запуске парсера.</p>
    <textarea id="cfg-editor" spellcheck="false" style="width:100%;height:520px;font-family:ui-monospace,monospace;font-size:13px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px;"></textarea>
    <div class="toolbar" style="margin-top:12px;">
      <button class="primary" id="cfg-save">Сохранить</button>
      <button id="cfg-reload">Отменить изменения</button>
      <span id="cfg-status" class="muted"></span>
    </div>
  </div>
</main>

<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal"></div>
</div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const fmtMoney = (v) => v == null ? "–" : new Intl.NumberFormat("ru-RU").format(v) + " ₽";
const fmtDate = (v) => v ? new Date(v).toLocaleString("ru-RU") : "–";
// Дата и время без секунд.
const fmtDT = (v) => v ? new Date(v).toLocaleString("ru-RU", { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" }) : "–";

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

async function api(path, params) {
  const url = "/api/" + path + (params ? "?" + new URLSearchParams(params) : "");
  const r = await fetch(url);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

let allItems = [];
let selected = new Set();

function card(row) {
  return `<div class="card selcard" data-id="${row.id}">
    <div class="num">${row.number}</div>
    <div class="subj">${escapeHtml(row.subject || "—")}</div>
    <div class="row"><span>Заказчик</span><b>${escapeHtml(row.customer || "—")}</b></div>
    <div class="row"><span>НМЦК</span><b>${fmtMoney(row.nmck)}</b></div>
    <div class="row"><span>Срок подачи</span><b>${fmtDate(row.deadline)}</b></div>
    <div class="row"><span>Статус</span><span class="pill ${row.is_active ? "active" : "inactive"}">${row.is_active ? "Активна" : "Не активна"}</span></div>
    <div class="row"><span>Площадка</span><span class="pill">${escapeHtml(row.source_platform)}</span>
      <span class="pill score">score ${row.score ?? "—"}</span></div>
  </div>`;
}

function procRow(row) {
  return `<tr data-id="${row.id}" class="${selected.has(row.id) ? "sel" : ""}">
    <td class="id">${row.id}</td>
    <td><div class="num">${escapeHtml(row.number)}</div><div class="subj">${escapeHtml(row.subject || "—")}</div></td>
    <td>${fmtDT(row.publication_date)}</td>
  </tr>`;
}

// Сортировка таблицы — ТОЛЬКО для отображения (копия массива). Порядок записей
// в БД (allItems) при этом НЕ меняется. Переключатель: "как в БД" или
// "по дате публикации".
function displayItems() {
  const items = allItems.slice();
  if ($("#proc-sort").value === "publication_date") {
    items.sort((x, y) => new Date(y.publication_date || 0) - new Date(x.publication_date || 0));
  }
  return items;
}

function selectedItems() {
  return allItems.filter((r) => selected.has(r.id));
}

function renderDetail() {
  const items = selectedItems();
  const panel = $("#proc-detail");
  if (!items.length) {
    panel.innerHTML = `<div class="empty">Выберите закупку слева<br><span class="muted" style="font-size:12px">Несколько — удерживайте Ctrl при клике</span></div>`;
    return;
  }
  panel.innerHTML = items.map(card).join("");
}

function renderProc() {
  const items = displayItems();
  const tbody = $("#proc-rows"), empty = $("#proc-empty");
  if (!items.length) {
    tbody.innerHTML = "";
    empty.style.display = "block";
    empty.textContent = parserRunning
      ? "Идёт сбор закупок…"
      : "Закупок нет — запустите парсер, чтобы наполнить БД.";
  } else {
    empty.style.display = "none";
    tbody.innerHTML = items.map(procRow).join("");
  }
  renderDetail();
}

let lastProcSig = "";
function sigOfProc(data) {
  return data.total + ":" + data.items.map((r) => r.id + "@" + (r.update_date || "")).join(",");
}

async function loadProc() {
  const params = { limit: 100 };
  if ($("#platform").value) params.source_platform = $("#platform").value;
  const data = await api("procurements", params);
  allItems = data.items;
  lastProcSig = sigOfProc(data);
  $("#cnt-proc").textContent = data.total;
  renderProc();
}

// Авто-обновление: перерисовываем список только если данные в БД изменились.
async function pollProc() {
  try {
    const params = { limit: 100 };
    if ($("#platform").value) params.source_platform = $("#platform").value;
    const data = await api("procurements", params);
    const sig = sigOfProc(data);
    if (sig !== lastProcSig) {
      lastProcSig = sig;
      allItems = data.items;
      $("#cnt-proc").textContent = data.total;
      renderProc();
    }
  } catch (err) { /* временные сбои игнорируем — попробуем на следующем тике */ }
}

async function openDetail(id) {
  const row = await api("procurements/" + id);
  const f = (label, v) => `<tr><td>${label}</td><td>${v}</td></tr>`;
  const files = (row.files_json || []).map((x) =>
    `<div><a href="${escapeHtml(x.url)}" target="_blank" rel="noopener">${escapeHtml(x.name)}</a></div>`).join("") || "–";
  const ts = row.technical_spec_url ? `<a href="${escapeHtml(row.technical_spec_url)}" target="_blank" rel="noopener">${escapeHtml(row.technical_spec_name || "ТЗ")}</a>` : "–";
  $("#modal").innerHTML = `
    <span class="close" onclick="closeModal()">×</span>
    <h2>${escapeHtml(row.number)}</h2>
    <table>
      ${f("Предмет", escapeHtml(row.subject || "—"))}
      ${f("Заказчик", escapeHtml(row.customer || "—") + " <span class='muted'>(id " + (row.customer_id ?? "—") + ")</span>")}
      ${f("Закон", escapeHtml(row.law || "—"))}
      ${f("НМЦК", fmtMoney(row.nmck))}
      ${f("Опубликовано", fmtDate(row.publication_date))}
      ${f("Обновлено", fmtDate(row.update_date))}
      ${f("Срок подачи", fmtDate(row.deadline))}
      ${f("Активна", row.is_active ? "да" : "нет")}
      ${f("Обеспечение", fmtMoney(row.security_amount) + (row.security_amount_unit ? " " + escapeHtml(row.security_amount_unit) : ""))}
      ${f("ОКПД2", escapeHtml(row.okpd2_codes || "—"))}
      ${f("Score", (row.score ?? "—") + " (" + escapeHtml(row.score_method || "") + ")")}
      ${f("Срок исполнения", escapeHtml(row.execution_term || "—"))}
      ${f("ТЗ", ts)}
      ${f("Файлы", files)}
      ${f("Ссылка", row.url ? `<a href="${escapeHtml(row.url)}" target="_blank" rel="noopener">открыть</a>` : "—")}
    </table>`;
  $("#modal-bg").classList.add("open");
}

function renderCustomers(data) {
  $("#cnt-cust").textContent = data.total;
  const rows = data.items.map((c) => `
    <tr>
      <td>#${c.id}</td>
      <td>${escapeHtml(c.name)}</td>
      <td><span class="muted">${escapeHtml(c.inn || "—")}</span></td>
      <td>${c.rating == null ? "–" : c.rating}</td>
    </tr>`).join("");
  $("#customers").innerHTML = `
    <table class="cust">
      <thead><tr><th>ID</th><th>Заказчик</th><th>ИНН</th><th>Рейтинг</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="4" class="muted">Заказчиков нет</td></tr>'}</tbody>
    </table>`;
}

let lastCustSig = "";
function sigOfCust(data) {
  return data.total + ":" + data.items.map((c) => c.id + "|" + (c.inn || "") + "|" + (c.rating ?? "")).join(",");
}

async function loadCustomers() {
  const data = await api("customers", { limit: 100 });
  lastCustSig = sigOfCust(data);
  renderCustomers(data);
}

// Обновляем заказчиков, только если они изменились.
async function pollCustomers() {
  try {
    const data = await api("customers", { limit: 100 });
    const sig = sigOfCust(data);
    if (sig !== lastCustSig) { lastCustSig = sig; renderCustomers(data); }
  } catch (err) { /* временные сбои игнорируем */ }
}

async function loadPlatforms() {
  const sel = $("#platform");
  const set = new Set();
  const paged = await api("procurements", { limit: 100 });
  paged.items.forEach((r) => set.add(r.source_platform));
  set.forEach((p) => { const o = document.createElement("option"); o.value = p; o.textContent = p; sel.appendChild(o); });
}

function closeModal() { $("#modal-bg").classList.remove("open"); }

// --- События списка закупок -------------------------------------------
$("#proc-rows").addEventListener("click", (e) => {
  const tr = e.target.closest("tr[data-id]");
  if (!tr) return;
  const id = Number(tr.dataset.id);
  if (e.ctrlKey) {
    if (selected.has(id)) { selected.delete(id); tr.classList.remove("sel"); }
    else { selected.add(id); tr.classList.add("sel"); }
  } else {
    selected = new Set([id]);
    document.querySelectorAll("#proc-rows tr").forEach((r) => r.classList.toggle("sel", r === tr));
  }
  renderDetail();
});
$("#proc-detail").addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  if (card) openDetail(card.dataset.id);
});
$("#modal-bg").addEventListener("click", (e) => { if (e.target.id === "modal-bg") closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
$("#proc-sort").addEventListener("change", renderProc);
$("#platform").addEventListener("change", loadProc);
$("#tab-proc").addEventListener("click", () => {
  $("#tab-proc").classList.add("active"); $("#tab-cust").classList.remove("active"); $("#tab-cfg").classList.remove("active");
  $("#view-proc").style.display = "block"; $("#view-cust").style.display = "none"; $("#view-cfg").style.display = "none";
});
$("#tab-cust").addEventListener("click", () => {
  $("#tab-cust").classList.add("active"); $("#tab-proc").classList.remove("active"); $("#tab-cfg").classList.remove("active");
  $("#view-cust").style.display = "block"; $("#view-proc").style.display = "none"; $("#view-cfg").style.display = "none";
  loadCustomers();
});

// --- Параметры --------------------------------------------------------
let cfgDirty = false;
async function loadConfig() {
  const cfg = await api("config");
  $("#cfg-editor").value = JSON.stringify(cfg, null, 2);
  $("#cfg-status").textContent = "config_service.yaml";
  cfgDirty = false;
}
async function saveConfig() {
  let payload;
  try { payload = JSON.parse($("#cfg-editor").value); }
  catch (err) { $("#cfg-status").textContent = "Ошибка JSON: " + err.message; return; }
  $("#cfg-status").textContent = "Сохранение…";
  try {
    const r = await fetch("/api/config", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    if (!r.ok) {
      const detail = await r.json();
      $("#cfg-status").textContent = "Ошибка валидации: " + JSON.stringify(detail.detail || detail);
      return;
    }
    const saved = await r.json();
    $("#cfg-editor").value = JSON.stringify(saved, null, 2);
    $("#cfg-status").textContent = "Сохранено ✓ (применится при следующем запуске парсера)";
    cfgDirty = false;
  } catch (err) { $("#cfg-status").textContent = "Ошибка: " + err.message; }
}
$("#cfg-editor").addEventListener("input", () => { cfgDirty = true; $("#cfg-status").textContent = "несохранённые изменения"; });
$("#cfg-save").addEventListener("click", saveConfig);
$("#cfg-reload").addEventListener("click", loadConfig);
$("#tab-cfg").addEventListener("click", () => {
  $("#tab-cfg").classList.add("active"); $("#tab-proc").classList.remove("active"); $("#tab-cust").classList.remove("active");
  $("#view-cfg").style.display = "block"; $("#view-proc").style.display = "none"; $("#view-cust").style.display = "none";
  if (!cfgDirty) loadConfig();
});
window.addEventListener("beforeunload", (e) => { if (cfgDirty) { e.preventDefault(); e.returnValue = ""; } });

// --- Парсер ------------------------------------------------------------
let parserTimer = null;
let prevRunning = false;
let adminMode = false;
let parserRunning = false;

function updateControls() {
  $("#parser-start").disabled = parserRunning;
  $("#parser-stop").disabled = !parserRunning;
  // Элементы режима администратора скрываются, а не просто блокируются.
  const adminOn = adminMode;
  $("#db-clear").style.display = adminOn ? "" : "none";
  $("#db-clear").disabled = parserRunning;
  $("#db-export").style.display = adminOn ? "" : "none";
  $("#tab-cfg").style.display = adminOn ? "" : "none";
}

async function refreshParserStatus() {
  let s;
  try { s = await api("parser/status"); } catch { return; }
  parserRunning = s.running;
  updateControls();
  const el = $("#parser-status");
  if (s.running) {
    el.textContent = "работает…" + (s.started_at ? " (с " + fmtDT(s.started_at) + ")" : "");
  } else {
    let txt = s.stopped ? "остановлен" : "не запущен";
    if (s.error) txt += " · ошибка: " + s.error;
    if (s.finished_at) txt += " · завершён " + fmtDT(s.finished_at);
    el.textContent = txt;
  }
  return s;
}
$("#admin").addEventListener("change", (e) => { adminMode = e.target.checked; updateControls(); });

// Цветовая схема (по умолчанию светлая; выбор запоминается в localStorage).
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  localStorage.setItem("zp_theme", theme);
}
const themeSel = $("#theme");
const savedTheme = localStorage.getItem("zp_theme");
themeSel.value = savedTheme === "dark" ? "dark" : "light";
applyTheme(themeSel.value);
themeSel.addEventListener("change", () => applyTheme(themeSel.value));
function pollParser() {
  if (parserTimer) clearInterval(parserTimer);
  parserTimer = setInterval(async () => {
    const s = await refreshParserStatus();
    if (s.running) { prevRunning = true; return; }
    if (prevRunning) {
      // Проход завершился — обновляем список (без сброса выбора).
      prevRunning = false; clearInterval(parserTimer); parserTimer = null;
      await loadProc();
    } else {
      clearInterval(parserTimer); parserTimer = null;
    }
  }, 3000);
}
$("#parser-start").addEventListener("click", async () => {
  $("#parser-status").textContent = "запуск…";
  parserRunning = true; updateControls(); renderProc(); // мгновенно блокируем «Запустить» и убираем подсказку
  const r = await fetch("/api/parser/start", { method: "POST" });
  if (!r.ok) {
    parserRunning = false; updateControls(); renderProc();
    $("#parser-status").textContent = "не удалось запустить (возможно, уже работает)";
    return;
  }
  await refreshParserStatus(); pollParser();
});
$("#parser-stop").addEventListener("click", async () => {
  $("#parser-status").textContent = "остановка…";
  parserRunning = false; updateControls(); // мгновенно блокируем «Остановить»
  await fetch("/api/parser/stop", { method: "POST" });
  await refreshParserStatus(); pollParser();
});
$("#db-clear").addEventListener("click", async () => {
  if (!confirm("Очистить базу данных (закупки и заказчики)?")) return;
  const r = await fetch("/api/db/clear", { method: "POST" });
  if (!r.ok) { $("#parser-status").textContent = "не удалось очистить БД (возможно, идёт сбор)"; return; }
  await loadProc(); await loadCustomers();
  $("#parser-status").textContent = "БД очищена";
});
$("#db-export").addEventListener("click", async () => {
  $("#parser-status").textContent = "выгрузка CSV…";
  const r = await fetch("/api/procurements/export", { method: "POST" });
  if (!r.ok) { $("#parser-status").textContent = "не удалось выгрузить CSV"; return; }
  const body = await r.json();
  $("#parser-status").textContent = `CSV выгружен на сервер: ${body.path} (закупок: ${body.count})`;
});
refreshParserStatus();

// Живые обновления через WebSocket (вместо кнопки «Обновить» и опроса).
let refreshScheduled = false;
function scheduleRefresh() {
  if (refreshScheduled) return;
  refreshScheduled = true;
  setTimeout(() => {
    refreshScheduled = false;
    pollProc();
    pollCustomers();
  }, 500);
}
function connectWS() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = scheduleRefresh;
  ws.onclose = () => setTimeout(connectWS, 3000); // авто-переподключение
  ws.onerror = () => { try { ws.close(); } catch (err) {} };
}
connectWS();

(async function init() {
  // Режим администратора всегда выключен при старте страницы (браузер может
  // восстанавливать состояние формы после перезагрузки).
  adminMode = false;
  $("#admin").checked = false;
  updateControls();
  try {
    await loadPlatforms();
    await loadProc();
    await loadCustomers();
  } catch (err) {
    $("#proc-rows").innerHTML = `<tr><td colspan="2" class="muted">Не удалось загрузить данные: ${escapeHtml(String(err))}</td></tr>`;
  }
})();
</script>

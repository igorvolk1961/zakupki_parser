[project]
name = "analysis-service"
version = "0.1.0"
description = "RAG-анализ стоп-условий по вопросам клиента (on-demand): чанки ТЗ, эмбеддинги, лёгкая LLM-верификация"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    # LangFuse-трассировка LLM-вердиктов и эмбеддингов (опционально: без ключей — no-op).
    "langfuse>=4.0",
    # Через scoring_common.tz: конвертация docx/pdf в Markdown (заголовки/таблицы).
    "markitdown[docx,pdf]>=0.1.7",
    # Чтение 7z-архивов закупок (Закупочная_документация.7z и т.п.).
    # scoring_common подключается через PYTHONPATH (не как пакет), поэтому его
    # зависимости в venv analysis_service не резолвятся автоматически.
    "py7zr>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "fakeredis>=2.24",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ANN"]
ignore = [
    "ANN401",
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["analysis_service", "scoring_common"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["."]
exclude = ["tests"]
mypy_path = [".", "../scoring_common"]

[[tool.mypy.overrides]]
module = ["redis.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
# Локальная конфигурация ruff для подпроекта analysis_service.
extend = "../../pyproject.toml"

[lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201", "ANN202"]

# RAG-анализ стоп-условий по вопросам клиента (analysis_service).
# LLM — та же модель и ключ, что и в scoring_service (#5); секрет llm_api_key
# управляется через .env (ANALYSIS_LLM_API_KEY).
llm_base_url: "https://api.deepseek.com/v1"
llm_model: "deepseek-v4-flash"
llm_temperature: 0.0
llm_request_timeout: 45.0

# Эмбеддинги: прямой Giga Embedder (те же модель и OAuth-ключи, что и у
# scoring_service). Ключи доступа (giga_client_id/giga_client_secret) задаются
# через .env (ANALYSIS_GIGA_CLIENT_ID/SECRET); без них — фолбэк на
# OpenAI-совместимый endpoint /embeddings (gpt2giga-прокси, см. ниже).
giga_enabled: true
giga_base_url: "https://gigachat.devices.sberbank.ru/api/v1"
giga_embeddings_model: "EmbeddingsGigaR"
giga_auth_url: "https://ngw.devices.sberbank.ru:9443/api/v2/oauth"
giga_client_id: ""
giga_client_secret: ""
giga_auth_scope: "GIGACHAT_API_PERS"
giga_timeout_seconds: 30.0
giga_min_token_ttl_seconds: 60.0
# Проверка SSL-сертификата при обращении к Giga. OAuth (ngw...:9443) отдаёт
# самоподписанный сертификат, которому httpx не доверяет — поэтому по умолчанию
# выключено (см. scoring_service.giga_verify_ssl); при необходимости включить:
# ANALYSIS_GIGA_VERIFY_SSL=true в .env.
giga_verify_ssl: false

# Фолбэк: OpenAI-совместимый endpoint (Giga Embedder через gpt2giga-прокси).
embedding_base_url: "http://localhost:8002/v1"
embedding_model: "EmbeddingsGigaR"
embedding_timeout: 30.0

# Парсер закупок (REST).
parser_api_url: "http://localhost:8000"
parser_retry_backoff_seconds: 5.0

# Redis-очередь.
redis_url: "redis://localhost:6379/0"
jobs_key: "analysis:jobs"
results_key: "analysis:results"
processing_key: "analysis:processing"
processing_meta_key: "analysis:processing_meta"
processing_ttl_seconds: 600
processing_recovery_priority: 0.0
queue_poll_seconds: 2.0
# Счётчик ретраев задач (HASH).
jobs_retry_key: "analysis:jobs_retries"

# RAG-параметры.
chunk_max_chars: 1500
top_k: 3
tz_download_timeout: 30.0
# Проверять SSL-сертификат при скачивании файла ТЗ. Площадки за TLS-перехватом
# отдают самоподписанный промежуточный сертификат — для локальной разработки отключено.
tz_verify_ssl: false

# Логирование (собственный блок; сервис в изолированном контейнере управляет
# своим логом). file: null — логи в консоль/stdout (их собирает оркестратор);
# для файла с ротацией укажите путь (например, data/logs/analysis_service.log).
logging:
  level: INFO
  format: "%(asctime)s %(levelname)-8s [%(name)s] %(message)s"
  file: null
  file_level: DEBUG
  console: true
  truncate_on_start: false

# Конфигурация сервиса Margin (margin_service).
#
# Значения можно переопределить переменными окружения `MARGIN_*`
# (например, `MARGIN_MARGIN_RATE=0.2`). Приоритет:
# аргументы > env `MARGIN_*` > `.env` > этот YAML > значения по умолчанию.
# Путь к файлу можно изменить env `MARGIN_CONFIG_FILE`.

# Парсер закупок (REST, без прямого доступа к БД)
parser_api_url: "http://localhost:8000"
# Пауза перед повторной обработкой задачи при недоступности парсера (сек).
parser_retry_backoff_seconds: 5.0

# Redis-очередь (та же, что у scoring_transport)
redis_url: "redis://localhost:6379/0"
jobs_key: "margin:jobs"
results_key: "margin:results"
processing_key: "margin:processing"
processing_meta_key: "margin:processing_meta"
processing_ttl_seconds: 600
processing_recovery_priority: 0.0
queue_poll_seconds: 2.0
# Счётчик ретраев задач (HASH).
jobs_retry_key: "margin:jobs_retries"

# Норма прибыли: Margin = НМЦК × margin_rate
margin_rate: 1.0

# Пайплайн
score_round_digits: 2

# Логирование (собственный блок; сервис в изолированном контейнере управляет
# своим логом). file: null — логи в консоль/stdout (их собирает оркестратор);
# для файла с ротацией укажите путь (например, data/logs/margin_service.log).
logging:
  level: INFO
  format: "%(asctime)s %(levelname)-8s [%(name)s] %(message)s"
  file: null
  file_level: DEBUG
  console: true
  truncate_on_start: false

[project]
name = "zakupki-parser"
version = "0.1.0"
description = "Парсер площадок закупок на Playwright с конфигурацией через YAML"
readme = "README.md"
authors = [
    { name = "igorvolk", email = "igorvolk1961@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.45",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pytest-docker>=3.0",
    "pre-commit>=3.7",
]

[project.scripts]
# Короткое имя команды (основное); длинное — алиас для обратной совместимости.
zp = "zakupki_parser.cli:main"
zakupki-parser = "zakupki_parser.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ANN"]
ignore = [
    "ANN401",  # dynamic type Any
    "B008",    # function call in default arg
]

[tool.ruff.lint.isort]
# Все пакеты проекта (в т.ч. подпроекты) считаем first-party — единая сортировка
# импортов независимо от версии ruff.
known-first-party = ["zakupki_parser", "scoring_service", "scoring_transport", "scoring_common", "pwin_service", "margin_service"]

[tool.mypy]
python_version = "3.12"
# Парсер — Linux-only (pgrep, /tmp/playwright); иначе на Windows typeshed
# не содержит signal.SIGKILL и т.п.
platform = "linux"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/zakupki_parser", "tests"]
exclude = ["tests/fixtures", "src/scoring_service", "src/scoring_transport", "src/scoring_common", "src/pwin_service", "src/margin_service"]
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["playwright.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    # Устаревшее внутреннее предупреждение starlette.testclient (рекомендует httpx2);
    # исходит из сторонней библиотеки, не из нашего кода.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["zakupki_parser"]

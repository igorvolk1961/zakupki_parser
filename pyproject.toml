[project]
name = "zakupki-parser"
version = "0.1.0"
description = "Парсер площадок закупок на Playwright с конфигурацией через YAML"
readme = "README.md"
authors = [
    { name = "igorvolk", email = "igorvolk1961@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.45",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pytest-docker>=3.0",
]

[project.scripts]
zakupki-parser = "zakupki_parser.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ANN"]
ignore = [
    "ANN401",  # dynamic type Any
    "B008",    # function call in default arg
]

[tool.ruff.lint.isort]
known-first-party = ["zakupki_parser"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/zakupki_parser", "tests"]
exclude = ["tests/fixtures"]
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["playwright.*", "asyncpg.*", "boto3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["zakupki_parser"]

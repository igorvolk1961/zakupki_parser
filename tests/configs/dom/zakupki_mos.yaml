# Тестовая DOM-конфигурация площадки: URL, переменные, селекторы контейнеров
# и путей к значениям переменных. Изменяется без правки кода.
#
# Целевой раздел — Реестр закупок (/purchase/list). Классы styled-components
# хешированные (sc-…) и могут меняться при деплое — правки выполняются только здесь.

name: "Портал поставщиков Москвы"
url: "https://zakupki.mos.ru"
list_path: "/purchase/list"

list_config:
  # Контейнер карточки закупки — БЕЗ css-хеша: структура «обёртка > MainInfo > .ui.grid»
  # (семантический класс Semantic UI) + текст-якорь «(МСК)» внизу карточки.
  container: "div:has(> div > div.ui.grid):has-text('МСК')"
  # Ссылка на детальную страницу закупки
  detail_link: "a[href*='/need/']"
  # Селектор перехода на следующую страницу (Semantic UI пагинация)
  next_page: "div.ui.pagination.menu a[type='nextItem']"
  # Имя переменной с датой публикации (используется для стоп-порога)
  publication_date: "publication_date"
  # Статусы, считающиеся активными (is_active). Неактивны — завершённые, отменённые и т.п.
  active_statuses: ["Прием предложений", "Работа с заявками", "Определение поставщика"]
  variables:
    - { name: "number",          selector: "a[href*='/need/']", handler: "strip", default: "" }
    - { name: "purchase_type",   selector: "div:has(> a[href*='/need/']) > div > span", handler: "strip", default: "" }
    - { name: "status",          selector: "#state-indicator", handler: "strip", default: "" }
    - { name: "subject",         selector: "a[href*='/need/']", index: 1, handler: "strip", default: "" }
    - { name: "customer",        selector: "a[href*='/companyProfile/']", handler: "strip", default: "" }
    - { name: "nmck",            selector: "div:has(> label:text-is('Начальная цена')) > div", handler: "money", default: null }
    - { name: "region",          selector: "xpath=//span[contains(., 'МСК')]/ancestor::div[2]/div[1]/span", handler: "strip", default: "" }
    # Закон, строка дат и производные извлекаются regex-обработчиками из всего
    # нижнего блока карточки — это не зависит от расклада полей внутри блока
    # (у карточек «B2B-закупка» позиции отличаются).
    - { name: "law",             selector: "xpath=//span[contains(., 'МСК')]/ancestor::div[2]", handler: "law", default: null }
    - { name: "publication_date", selector: "xpath=//span[contains(., 'МСК')]/ancestor::div[2]", handler: "pub_date", default: null }
    - { name: "deadline",        selector: "xpath=//span[contains(., 'МСК')]/ancestor::div[2]", handler: "deadline", default: null }

detail:
  # Раскрытие полного списка документов перед извлечением файлов (см. detail_files).
  files_expand: "button:has-text('Смотреть все документы'), a:has-text('Смотреть все документы')"
  variables:
    - { name: "customer",    selector: "div:has(> label:text-is('Заказчик')) > div", handler: "strip", default: "" }
    - { name: "nmck",        selector: "div:has(> label:text-is('Начальная цена')) > div", handler: "money", default: null }
    - { name: "okpd2_name",  selector: "div:has(> label:text-is('Наименование ОКПД2')) > div", handler: "strip", default: "" }
    - { name: "okpd2_code",  selector: "div:has(> label:text-is('Код ОКПД2')) > div", handler: "strip", default: "" }
  files:
    # Ссылки на скачиваемые файлы: имя — текст ссылки, url скачивания с ЭТП — href
    - { selector: "a[href*='FileStorage/Download']", name_attribute: null, url_attribute: "href" }

# Извлечение ИНН заказчика (ADR-4). На mos.ru ИНН — на странице организации
# (/companyProfile/customer/{id}), куда ведёт ссылка на имя заказчика.
organization:
  customer_link_selector: "div:has(> label:text-is('Заказчик')) a"
  inn_from_link_regex: null
  inn_from_org_page: true
  inn_page_selector: null

# --- Сортировка списка закупок ---
# ВАЖНО: порядок фиксирован — «по дате публикации по убыванию»
# (единственное значение order). Стоп-логика по дате последней записи основана на нём.
sort:
  order: publication_date_desc
  by_relevance: true
  dropdown: "div.ui.dropdown:has-text('По релевантности')"
  option_text: "По дате публикации"

# --- Фильтры (DOM-шаги). Пока не заполнены — точные селекторы панели
#     фильтров Реестра закупок требуют верификации (см. TODO). ---
filters: []

# --- URL-фильтр списка закупок (механизм для этой площадки). ---
# Маппинг полностью из конфига: имена параметров, структуры JSON, формат даты.
# Плейсхолдеры: {filter_json}, {state_json}, {publish_date_great_equal}.
search:
  enabled: true
  query_params:
    page: "1"
    perPage: "10"
    sortField: "relevance"
    sortDesc: "true"
    filter: "{filter_json}"
    state: "{state_json}"
  # Статичная часть параметра filter. Обобщённые критерии (config_service.yaml
  # -> search_criteria) подставляются через criteria_map ниже.
  filter_json:
    typeIn:
      values: [2]
    needSpecificFilter: {}
  state_json:
    currentTab: 2
  # Привязка обобщённых критериев к структуре запроса площадки. Коды ОКПД2
  # резолвятся в пути через okpd_tree_file.
  criteria_map:
    publish_date:  { json_path: "publishDateGreatEqual" }
    okpd2:         { json_path: "needSpecificFilter.okpdPaths" }
    nmck_min:      { json_path: "priceFrom" }
    nmck_max:      { json_path: "priceTo" }
    # Ключевые слова -> nameLike (одно значение, слова через пробел).
    keywords:      { json_path: "nameLike" }
    # active_only -> состояние закупок (stateIdIn); ID — в state_ids ниже.
    active_only:   { json_path: "auctionSpecificFilter.stateIdIn" }
  # ID состояний для active_only: только активные = Active + OffersSigned.
  state_ids:
    active: [19000002, 19000008]
  date_great_equal_format: "%d.%m.%Y 00:00:00"
  # Маппинг «код ОКПД2 -> путь» (дерево площадки, см. configs/codes/mos_okpd2_tree.json)
  okpd_tree_file: "configs/codes/mos_okpd2_tree.json"


name: "ЕИС (zakupki.gov.ru)"
url: "https://zakupki.gov.ru"
list_path: "/epz/order/extendedsearch/results.html"

list_config:
  container: "div.search-registry-entry-block"
  detail_link: "a[href*='common-info.html']"
  next_page: "a.paginator-button-next"
  # Стоп-порог по дате «Обновлено» (task.md: дата обновления закупки)
  publication_date: "update_date"
  variables:
    - { name: "number",          selector: "a[href*='common-info.html']", handler: "regex", handler_arg: "№\\s*(\\d+)", default: "" }
    - { name: "law",             selector: "div.registry-entry__header-top__title", handler: "law", default: null }
    # Предмет закупки — «Объект закупки» в карточке списка (общий для 44-ФЗ и 223-ФЗ)
    - { name: "subject",         selector: "div.registry-entry__body-value", handler: "strip", default: "" }
    - { name: "status",          selector: "div.registry-entry__header-mid__title", handler: "strip", default: "" }
    # Заказчик: 44-ФЗ — organization/view/info.html, 223-ФЗ — organization/view223/info.html
    - { name: "customer",        selector: "a[href*='organization/view']", handler: "strip", default: "" }
    - { name: "nmck",            selector: "div.price-block__value", handler: "money", default: null }
    - { name: "publication_date", selector: "div.data-block__value", index: 0, handler: "date", default: null }
    - { name: "update_date",     selector: "div.data-block__value", index: 1, handler: "date", default: null }
    # «Окончание подачи заявок» — третий data-block (у 44-ФЗ и 223-ФЗ)
    - { name: "deadline",        selector: "div.data-block__value", index: 2, handler: "date", default: null }

detail:
  # ОКПД2: 44-ФЗ — таблица позиций на common-info (заголовок «Код позиции»,
  # первая позиция); 223-ФЗ — доп. страница лотов (notice223/lot-list.html),
  # где значение отсутствует, значение основной страницы сохраняется.
  # Обеспечение/срок исполнения — секции «blockInfo__section» (44-ФЗ).
  variables:
    - { name: "okpd2_code", selector: "xpath=//table[.//th[contains(.,'Код позиции')]]//tbody/tr/td[2]", handler: "regex", handler_arg: "(?<![,\\d])(\\d{2}(?:\\.\\d{1,4})*)", default: null }
    - { name: "security_amount", selector: "xpath=//section[contains(@class,'blockInfo__section')][.//span[contains(@class,'section__title') and normalize-space(.)='Размер обеспечения исполнения контракта']]//span[contains(@class,'section__info')]", handler: "security", default: null }
    - { name: "security_amount_unit", selector: "xpath=//section[contains(@class,'blockInfo__section')][.//span[contains(@class,'section__title') and normalize-space(.)='Размер обеспечения исполнения контракта']]//span[contains(@class,'section__info')]", handler: "security_unit", default: null }
    - { name: "execution_term", selector: "xpath=//section[contains(@class,'blockInfo__section')][.//span[contains(@class,'section__title') and normalize-space(.)='Срок исполнения контракта']]//span[contains(@class,'section__info')]", handler: "strip", default: null }
    - { name: "region", selector: "xpath=//section[contains(@class,'blockInfo__section')][.//span[contains(@class,'section__title') and normalize-space(.)='Регион']]//span[contains(@class,'section__info')]", handler: "strip", default: null }
  additional_pages:
    - link_selector: "a[href*='lot-list.html']"
      variables:
        - { name: "okpd2_code", selector: "table.table.mb-0 td:nth-child(4)", handler: "regex", handler_arg: "(?<![,\\d])(\\d{2}(?:\\.\\d{1,4})*)", default: null }
  # Файлы закупки — на отдельной странице documents.html (файлы по
  # 44fz/filestore/public/...), имя файла — текст ссылки.
  files:
    - { selector: "a[href*='filestore/public/']", name_attribute: null, url_attribute: "href" }
  files_page: "documents.html"

# Сортировка: фиксированный порядок — по дате обновления по убыванию
sort:
  order: publication_date_desc
  dropdown: null
  option_text: null

# Извлечение ИНН заказчика (ADR-4). На ЕИС 223-ФЗ ИНН есть в org-ссылке
# (view223/info.html?inn=...); на 44-ФЗ — только organizationCode, ИНН
# извлекается со страницы организации (inn_from_org_page).
organization:
  customer_link_selector: "a[href*='organization/view']"
  inn_from_link_regex: "inn=(\\d{10,12})"
  inn_from_org_page: true
  inn_page_selector: null

# URL-фильтр расширенного поиска ЕИС. Обобщённые критерии мапятся на плоские
# query-параметры. ОКПД2: сервер игнорирует корневой id — нужен полный список
# id/кодов поддерева (okpd2Ids + okpd2IdsCodes), см. configs/codes/gov_okpd2_tree.json.
search:
  enabled: true
  query_params:
    morphology: "on"
    search-filter: "Дате размещения"
    pageNumber: "1"
    sortDirection: "false"
    recordsPerPage: "_50"
    showLotsInfoHidden: "false"
    sortBy: "UPDATE_DATE"
    fz44: "on"
    currencyIdGeneral: "-1"
    okpd2IdsWithNested: "on"
  filter_json: {}
  state_json: {}
  criteria_map:
    publish_date:  { query_param: "publishDateFrom" }
    # Дата «Обновлено» (ЕИС updateDateFrom) — как в реальном URL; соответствует
    # стоп-логике по дате обновления закупки.
    update_date:   { query_param: "updateDateFrom" }
    # Срок подачи заявок (applSubmissionCloseDateFrom) = сегодня — отсекает
    # просроченные закупки (дедлайн обязателен).
    deadline_from: { query_param: "applSubmissionCloseDateFrom" }
    # okpd2IdsWithNested=on (в query_params) включает дочерние узлы — перечислять
    # всё поддерево не нужно, достаточно собственных id выбранных кодов.
    okpd2:
      query_params:
        okpd2Ids: "{okpd2_ids}"
    # Текстовый поиск (searchString) не применяется: тематику задаёт ОКПД2,
    # а поиск по словам сужает выдачу (AND-семантика).
    nmck_min:      { query_param: "priceFromGeneral" }
    nmck_max:      { query_param: "priceToGeneral" }
  date_great_equal_format: "%d.%m.%Y"
  # Маппинг «код ОКПД2 -> id ЕИС» (полное поддерево 62/63, см. gov.html)
  okpd_tree_file: "configs/codes/gov_okpd2_tree.json"

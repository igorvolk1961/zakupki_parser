# Фиксированный тестовый конфиг: тесты НЕ должны зависеть от рабочих configs/*.
# Менять значения — только вместе с соответствующими тестами.
timeout_seconds: 3600
sites:
  - platform_id: zakupki_mos
    enabled: true
  - platform_id: zakupki_gov
    enabled: true
default_cutoff_days: 7
search_criteria:
  okpd_codes:
    - "62.02"
  keywords: []
  nmck_min: null
  nmck_max: null
  active_only: false
  fz44: true
  fz223: true
db:
  enabled: true
  dsn: "postgresql+asyncpg://postgres:postgres@localhost:5432/zakupki"
notifications:
  backend: "max"
  max:
    enabled: true
    chat_id: null
stop_conditions:
  enabled: true
  deadline_not_expired: true
  min_deadline_days: null
circuit_breaker_failure_threshold: 5
circuit_breaker_reset_timeout_seconds: 60

# Конфигурация скоринга закупок.
# Скоринг карточки: Fit × P(win) × Margin.
#
# Дефолтный score вычисляется в парсере (fit-таблица ниже, P(win), Margin=НМЦК).
# Финальный внешний score приходит асинхронно через конвейер
# transport + scoring_service + Redis (ADR-7) и записывается через POST /score.

# Таблица fit(ОКПД2) — коэффициент соответствия закупки тематике (0..1).
# Ключ — код ОКПД2 (любой вложенности); при отсутствии кода — default_fit.
fit_table:
  "62.01": 0.9
  "62.02": 0.8
  "62.09": 0.7
  "63.11": 0.6

# fit для кода, отсутствующего в fit_table
default_fit: 0.5

# Вероятность победы P(win) (простейшая эвристика = 1.0)
p_win: 1.0

# Адрес scoring_transport для авто-пуша задания на внешний скоринг (ADR-7).
# После сохранения закупки парсер отправляет POST /api/scoring/jobs с дефолтным скором.
# Если не задан — внешний скоринг не запускается, закупка остаётся с дефолтным score.
scoring_transport_url: "http://localhost:8200"

# ЭТП ГПБ (etpgpb.ru). Платформа_id = имя файла.
# Vue SPA. Площадка НЕ различает закон 44-ФЗ/223-ФЗ: выдача /procedures/ единая,
# разделяющего параметра закона нет (проверено 2026-08-14), поэтому одна площадка.
# Селекторы СПИСКА И ДЕТАЛЕЙ ВЕРИФИЦИРОВАНЫ (снимки 2026-08-14). Список с 2026-08-18
# читается из JSON API (search.api_endpoint), см. search-блок ниже.
name: "ЭТП ГПБ"
url: "https://etpgpb.ru"
list_path: "/procedures/"
list_config:
  container: "[data-testid='procedure-card']"
  detail_link: "a.cardHeader__infoItem.lnk"
  next_page: ""
  page_param: "page"
  page_size: 20
  # Статусы, считающиеся активными (is_active). Неактивны — завершённые, отменённые.
  # «accepting» — stage из API списка (сервер уже фильтрует процедуры этой стадии):
  # страховка, если статус не извлёкся с детальной страницы.
  active_statuses: ["Подача заявок", "Прием заявок на участие", "accepting"]
  variables:
    - { name: "number",           selector: "a.cardHeader__infoItem.lnk", handler: "regex", handler_arg: "№\\s*([\\w-]+)", default: "" }
    - { name: "purchase_type",    selector: ".cardHeader__truncateItem", handler: "strip", default: "" }
    - { name: "status",           selector: ".vTag--round", handler: "strip", default: "" }
    # Предмет — ссылка-заголовок в теле карточки (класс на div, ссылка внутри).
    - { name: "subject",          selector: "div.productCard__title a", handler: "strip", default: "" }
    - { name: "nmck",             selector: ".cardBody__price", handler: "money", default: null }
    - { name: "customer",         selector: ".cardBody__truncate", index: 2, handler: "strip", default: "" }
    - { name: "deadline",         selector: ".procedureDateExpired__value", index: 0, handler: "ru_date", default: null }
    - { name: "publication_date", selector: ".procedureDateExpired__value", index: 1, handler: "ru_date", default: null }
detail:
  variables:
    - { name: "status",      selector: "dt:text-is('Текущий статус') + dd", handler: "strip", default: "" }
    - { name: "customer",    selector: "dt:text-is('Наименование организации') + dd", handler: "strip", default: "" }
    - { name: "okpd2_code",  selector: "h4:text-is('Классификатор ОКПД2') + dl dt.procedureCardDl__value--name", handler: "strip", default: "" }
    - { name: "okpd2_name",  selector: "h4:text-is('Классификатор ОКПД2') + dl dd.procedureCardDl__value--desc", handler: "strip", default: "" }
  files:
    - { selector: "a.procedureDocItem__title", name_attribute: null, url_attribute: "href" }

# Извлечение ИНН заказчика (ADR-4). На etpgpb ИНН — на странице организации
# (/catalog/customers/{slug}), куда ведёт ссылка на наименование организации.
organization:
  customer_link_selector: "dt:text-is('Наименование организации') + dd a"
  inn_from_link_regex: null
  inn_from_org_page: true
  # ИНН на странице организации — строка «ИНН: 6731033838» (метка+значение).
  # Точный селектор обязателен: обобщённый поиск по body ловит ИНН из рекламы
  # в шапке/меню («Банк ГПБ (АО) ИНН 7744001497»).
  inn_page_selector: "div.customerInfo__item:has(> .customerInfo__label:text-is('ИНН: '))"

search:
  enabled: true
  # Список читается из JSON API SPA (GET /api/v2/procedures/): SSR-страница
  # /procedures/ всегда рендерит БАЗОВУЮ выдачу, фильтрацию выполняет только API
  # после гидрации клиента (проверено 2026-08-18). Детальные страницы, файлы, ИНН
  # остаются на DOM-парсинге.
  api_endpoint: "/api/v2/procedures/"
  # Поисковый движок etpgpb перематчивает короткие запросы в подстрочный шум:
  # search=ИИ возвращает 63 нерелевантные закупки, search=РА — 2349 (проверено
  # 2026-08-18). Слова короче порога отбрасываются (см. min_keyword_len).
  min_keyword_len: 3
  query_params:
    per: "20"
    sort: "by_published_desc"
  # Текстовый поиск работает ТОЛЬКО с sort=by_relevance: с by_published_desc API
  # возвращает нерелевантные записи (проверено 2026-08-18). При ключевых словах
  # статический sort подменяется на keywords_sort.
  keywords_sort: "by_relevance"
  criteria_map:
    # Ключевые слова -> параметр search (procedure[name] не фильтрует — проверено
    # 2026-08-14; реальный текстовый поиск — search, найдено 2026-08-18).
    keywords: { query_param: "search" }
    # ОКПД2 — ПЛОСКИЙ параметр procedure[okpd]=<код>: индексированную форму
    # procedure[okpd][0]=... API игнорирует и возвращает весь каталог (проверено
    # 2026-08-18). Сервер матчит код по префиксу (62 -> 62.02 и др.), несколько
    # кодов — через запятую (OR, 62.02,62.01 = 17+13). Дерево не нужно.
    okpd2: { query_param: "procedure[okpd]" }
    # active_only -> этап процедуры procedure[stage][0]=accepting (этап «Подача
    # заявок»; дефолт сайта при открытии /procedures/ без параметра — тот же,
    # проверено 2026-08-17). «Все» невыразимо: сайт всегда редиректит на accepting.
    active_only: { raw_array: "procedure[stage]" }
  state_ids:
    active: ["accepting"]

# lot-online (РАД) — 223-ФЗ (tender.lot-online.ru). Платформа_id = имя файла.
# Angular SPA (Taiga UI). Карточки — app-purchase-card; список рендерится клиентом,
# извлекается по DOM (как на gz.lot-online.ru). Пагинация — кнопка tui-pagination
# «Следующая страница» (URL-параметра page нет; :not([disabled]) отсекает последнюю
# страницу, чтобы не было вечного цикла). В списке ЕСТЬ даты публикации и окончания
# приёма заявок. Фильтры в URL не отражаются — URL-фильтр выключен.
# Селекторы списка проверены по снимку (2026-08-14). Детальная страница грузится
# асинхронно (ОКПД2/файлы отдаются через внутренний API) — TODO (см. docs/platforms.md).
name: "lot-online РАД (223-ФЗ)"
url: "https://tender.lot-online.ru"
list_path: "/search"
list_config:
  # Контейнер карточки закупки.
  container: "app-purchase-card"
  # Ссылка на детальную страницу (/procedure?procedureNumber=…&lotNumber=…).
  detail_link: "a[href*='/procedure?procedureNumber=']"
  # Пагинация — кнопка «Следующая страница»; на последней странице она disabled
  # (:not([disabled]) → конец пагинации).
  next_page: "button[title='Следующая страница']:not([disabled])"
  # Имя переменной с датой публикации (стоп-порог; дефолтная сортировка — по дате).
  publication_date: "publication_date"
  # Активность — по сроку приёма заявок (deadline).
  # active_statuses: null
  variables:
    # number — «№ 32616293355 / RAD260040078 / Лот 1» → внутренний номер.
    - { name: "number",           selector: "a[href*='/procedure?procedureNumber=']", handler: "regex", handler_arg: "№\\s*(\\d+)", default: "" }
    # subject — наименование закупки (ссылка .purchase-title).
    - { name: "subject",          selector: "a.purchase-title", handler: "strip", default: "" }
    # law — платформа 223-ФЗ по определению; бейджа закона в карточке нет.
    - { name: "law",              selector: ".__no_law_badge", handler: "none", default: "223-ФЗ" }
    # customer — «Организатор».
    - { name: "customer",         selector: ".organization span", handler: "strip", default: "" }
    # status — бейдж статуса («Прием заявок»).
    - { name: "status",           selector: "app-purchase-status .t-text", handler: "strip", default: "" }
    # purchase_type — «Способ закупки».
    - { name: "purchase_type",    selector: ".purchase-method span", handler: "strip", default: "" }
    # nmck — «Начальная цена» (формат «1 089 900,00 ₽»).
    - { name: "nmck",             selector: "xpath=//div[contains(@class,'tui-text_body-s')][.='Начальная цена']/following-sibling::div[contains(@class,'tui-text_h6')]", handler: "money", default: null }
    # Даты — app-date-time в блоках «Дата публикации» / «Дата окончания приема заявок».
    # regex_datetime нужен для deadline: в тексте блока есть «Осталось N дней».
    - { name: "publication_date", selector: "xpath=//div[.='Дата публикации']/following-sibling::div[1]", handler: "regex_datetime", handler_arg: "(\\d{2}\\.\\d{2}\\.\\d{4} \\d{2}:\\d{2})", default: null }
    - { name: "deadline",         selector: "xpath=//div[.='Дата окончания приема заявок']/following-sibling::div[1]", handler: "regex_datetime", handler_arg: "(\\d{2}\\.\\d{2}\\.\\d{4} \\d{2}:\\d{2})", default: null }
detail:
  # ОКПД2 отображается серверно строкой «ОКПД2: 62.02.2 Услуги…» — извлекаем код и название.
  variables:
    - { name: "okpd2_code", selector: "xpath=//span[contains(@class,'color-text-02') and normalize-space(.)='ОКПД2:']/following-sibling::span[contains(@class,'color-text-01')]", handler: "regex", handler_arg: "^\\s*(\\d{2}(?:\\.[\\d]+)*)", multiple: true, separator: ",", default: null }
    - { name: "okpd2_name", selector: "xpath=//span[contains(@class,'color-text-02') and normalize-space(.)='ОКПД2:']/following-sibling::span[contains(@class,'color-text-01')]", handler: "regex", handler_arg: "^\\d{2}(?:\\.[\\d]+)*\\s+(.+)", multiple: true, separator: " | ", default: "" }
  files: []
# Сортировка по умолчанию — «По дате публикации» (дропдаун tui-select; опция
# «По релевантности» есть, но НЕ выбрана по умолчанию, проверил 2026-08-17).
# Парсер дропдаун не кликает (dropdown=null), поэтому выдача идёт по дате ->
# by_relevance=false: стоп-порог по дате применяется.
sort:
  order: publication_date_desc
  by_relevance: false
  dropdown: null
  option_text: null
# Фильтры (DOM-шаги) не используются — поиск отражается в URL (search).
filters: []
search:
  enabled: true
  # ВНИМАНИЕ: searchToken на 223 ищет по ПОДСТРОКЕ, а «или» — литеральное слово,
  # а не оператор: `X или Y` матчит «или эквивалент» (серверы/ИБП) и даёт мусор.
  # Поэтому слова перебираются по-одному (keywords_one_at_a_time) и объединяются
  # дедупом. Слова и коды ОКПД2 обрабатываются раздельно (OR, дедуп по номеру).
  keywords_one_at_a_time: true
  criteria_map:
    # Слова -> searchToken (по одному слову за раз).
    keywords: { query_param: "searchToken" }
    # ОКПД2 -> okpd2 как JSON-массив объектов {key: код} (без названий).
    okpd2:    { raw_json: "okpd2" }

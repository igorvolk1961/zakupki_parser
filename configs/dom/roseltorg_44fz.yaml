# Росэлторг — 44-ФЗ (roseltorg.ru). Платформа_id = имя файла.
# Drupal+React, результаты рендерятся сервером, фильтры в URL. Сортировка по
# релевантности анонсирована -> by_relevance=true (без стоп-порога по дате).
# ВАЖНО: блокирует headless-shell и rate-limit'ит по IP (WAF) — требуется ПОЛНЫЙ
# Chromium и вежливые задержки (delayer).
# Поиск 44-ФЗ идёт через /procedures/search с параметром place=44fz (страница
# /search/44fz — лендинг, параметры поиска ИГНОРИРУЕТ). Параметры query_field
# (слова, пробел = OR) и okpd2[] (код) — те же, что на 223-ФЗ. ОКПД2 на деталях —
# только в JSON-LD (script[type='application/ld+json']).
name: "Росэлторг (44-ФЗ)"
url: "https://www.roseltorg.ru"
# Общий бэкенд с roseltorg_223fz (тот же сайт roseltorg.ru): не обрабатываются
# параллельно (общий IP/антибот/rate-limit, WAF).
domain_group: roseltorg.ru
list_path: "/procedures/search"
list_config:
  # Контейнер карточки процедуры в выдаче поиска (как на /procedures/search).
  container: "div.search-results__item"
  # Ссылка на детальную страницу (/procedure/<номер>/<лот>).
  detail_link: "a[href*='/procedure/']"
  # Пагинация — по query-параметру page (см. URL поиска roseltorg).
  page_param: "page"
  page_size: 10
  next_page: ""
  # Сортировка по релевантности -> стоп-порог по дате не применяется.
  publication_date: "publication_date"
  variables:
    # number — «0373200022226001723 (Лот 1)» (44-ФЗ, 19 цифр) / «COM14082600147 (Лот 1)».
    # \d{10,} минимум 10 цифр, чтобы не сматчить номер лота «1»/«2» в скобках;
    # SP\d{8,} — формат 223-ФЗ/коммерческих (на 44-ФЗ не встречается, вреда нет).
    - { name: "number",           selector: "div.search-results__lot a.search-results__link", handler: "regex", handler_arg: "(COM\\d{10,}|SP\\d{8,}|\\d{10,})", default: "" }
    # subject — наименование процедуры (ссылка на описание).
    - { name: "subject",          selector: "a.search-results__link--description", handler: "strip", default: "" }
    # law — «Государственные закупки (44-ФЗ)» -> 44-ФЗ.
    - { name: "law",              selector: "div.search-results__section p.search-results__tooltip", handler: "law", default: null }
    # customer — организатор (ссылка на страницу компании).
    - { name: "customer",         selector: "div.search-results__customer a[href*='/companies/']", handler: "strip", default: "" }
    # nmck — «1 180 000,00 ₽».
    - { name: "nmck",             selector: "div.search-results__sum p.desktop", handler: "money", default: null }
    # deadline — «Окончание приема заявок» -> «24.08.2026 в 09:00».
    - { name: "deadline",         selector: "div.search-results__timing time.search-results__time", handler: "datetime", default: null }
    # status — бейдж статуса («Прием заявок», без «N дн.» до конца приёма).
    - { name: "status",           selector: "div.search-results__status", handler: "regex", handler_arg: "([А-Яа-яЁё][А-Яа-яЁё ]+)", default: "" }
    # purchase_type — тип процедуры («Электронный запрос котировок»).
    - { name: "purchase_type",    selector: "div.search-results__type", handler: "strip", default: "" }
detail:
  # ОКПД2 — только в JSON-LD (schema.org, additionalProperty «Код ОКПД»), не в видимом
  # DOM. Извлекается из script[type='application/ld+json'].
  variables:
    - { name: "okpd2_code", selector: "script[type='application/ld+json']", handler: "regex", handler_arg: "\"name\": \"Код ОКПД\",\\s*\"value\": \"([^\"]+)\"", default: null }
  files: []
sort:
  order: publication_date_desc
  by_relevance: true
  dropdown: null
  option_text: null
search:
  enabled: true
  # Формат даты порога для start_date_published (dd.mm.yy — проверено на живом
  # сайте: сервер фильтрует выдачу по дате публикации, историческое окно -> 0).
  date_great_equal_format: "%d.%m.%y"
  query_params:
    sale: "1"
    currency: "all"
    # Ограничение раздела: только 44-ФЗ (как hidden-поля формы поиска на
    # /search/44fz -> action /procedures/search).
    place: "44fz"
    section: "44fz"
  criteria_map:
    # ОКПД2 -> okpd2[] (повторяемые параметры с пустыми скобками, PHP-стиль;
    # префиксный матчинг кода — например okpd2[]=62.02).
    okpd2:    { raw_array_flat: "okpd2[]" }
    # Дата публикации от порога (cutoff) -> start_date_published (формат dd.mm.yy).
    publish_date: { query_param: "start_date_published" }
    # active_only -> статусы процедур status[]: active — в работе (ожидание
    # приёма/приём заявок/работа комиссии), all — все статусы (проверено на
    # живом сайте: 5=Ожидание приема, 0=Прием заявок, 1=Работа комиссии,
    # 2=Отменена, 3=Приостановлена, 4=Завершена).
    active_only: { raw_array_flat: "status[]" }
  state_ids:
    all: [5, 0, 1, 2, 3, 4]
    active: [5, 0, 1]

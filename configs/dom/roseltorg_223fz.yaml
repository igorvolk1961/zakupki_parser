# Росэлторг — 223-ФЗ/коммерческие (roseltorg.ru). Платформа_id = имя файла.
# Drupal+React, результаты рендерятся сервером, фильтры в URL.
# ВАЖНО:
#  - блокирует headless-shell и rate-limit'ит по IP (WAF, «URL blocked», Attack ID):
#    требуется ПОЛНЫЙ Chromium (browser.chromium_executable_path / env
#    ZAKUPKI_CHROMIUM_EXECUTABLE) и вежливые задержки (delayer).
#  - поиск — /procedures/search, параметры query_field (слова, пробел = OR),
#    okpd2[] (код), status[] (2,3,4), page (пагинация).
#  - ОКПД2 на деталях — только в JSON-LD (script[type='application/ld+json']).
# Ограничения: страница rate-limit'ится при частых запросах; page_size/контейнер
# снимались по /search/com и нуждаются в повторной проверке на /procedures/search.
# На roseltorg 223-ФЗ и коммерческие закупки идут через /search/com (отдельного
# чисто-223-ФЗ пути нет).
name: "Росэлторг (223-ФЗ)"
url: "https://www.roseltorg.ru"
# Общий бэкенд с roseltorg_44fz (тот же сайт roseltorg.ru): не обрабатываются
# параллельно (общий IP/антибот/rate-limit, WAF).
domain_group: roseltorg.ru
list_path: "/procedures/search"
list_config:
  # Контейнер карточки процедуры в выдаче поиска.
  container: "div.search-results__item"
  # Ссылка на детальную страницу (/procedure/<номер>/<лот>).
  detail_link: "a[href*='/procedure/']"
  # Пагинация — по query-параметру page (см. URL поиска roseltorg).
  page_param: "page"
  page_size: 10   # TODO: verify на /procedures/search
  next_page: ""
  # Сортировка по релевантности -> стоп-порог по дате не применяется.
  publication_date: "publication_date"
  variables:
    # number — «32616082276 (Лот 1)» / «COM14082600147 (Лот 1)» / «SP10212041 (Лот 1)».
    # Префиксы: старые процедуры были с COM (11+ цифр), новые — SP (8 цифр)
    # (проверено 2026-08-31 на живом поиске). \d{10,} — минимум 10 цифр, чтобы
    # не сматчить номер лота «1»/«2» в скобках; SP\d{8,} — новый формат.
    - { name: "number",           selector: "div.search-results__lot a.search-results__link", handler: "regex", handler_arg: "(COM\\d{10,}|SP\\d{8,}|\\d{10,})", default: "" }
    # subject — наименование процедуры (ссылка на описание).
    - { name: "subject",          selector: "a.search-results__link--description", handler: "strip", default: "" }
    # law — «Коммерческие закупки и закупки по 223-ФЗ» -> 223-ФЗ.
    - { name: "law",              selector: "div.search-results__section p.search-results__tooltip", handler: "law", default: null }
    # customer — организатор (ссылка на страницу компании).
    - { name: "customer",         selector: "div.search-results__customer a[href*='/companies/']", handler: "strip", default: "" }
    # nmck — «2 201 656,36 ₽».
    - { name: "nmck",             selector: "div.search-results__sum p.desktop", handler: "money", default: null }
    # deadline — «Окончание приема заявок» -> «16.09.2026 в 09:00».
    - { name: "deadline",         selector: "div.search-results__timing time.search-results__time", handler: "datetime", default: null }
    # status — бейдж статуса («Прием заявок», без «N дн.» до конца приёма).
    - { name: "status",           selector: "div.search-results__status", handler: "regex", handler_arg: "([А-Яа-яЁё][А-Яа-яЁё ]+)", default: "" }
    # purchase_type — тип процедуры («Электронный запрос котировок»).
    - { name: "purchase_type",    selector: "div.search-results__type", handler: "strip", default: "" }
detail:
  # ОКПД2 — только в JSON-LD (schema.org, additionalProperty «Код ОКПД»), не в видимом
  # DOM. Извлекается из script[type='application/ld+json'].
  variables:
    - { name: "okpd2_code", selector: "script[type='application/ld+json']", handler: "regex", handler_arg: "\"name\": \"Код ОКПД\",\\s*\"value\": \"([^\"]+)\"", default: null }
  files: []
sort:
  order: publication_date_desc
  by_relevance: true
  dropdown: null
  option_text: null
search:
  enabled: true
  query_params:
    sale: "1"
    currency: "all"
  criteria_map:
    # ОКПД2 -> okpd2[] (повторяемые параметры с пустыми скобками, PHP-стиль;
    # префиксный матчинг кода — например okpd2[]=62.02).
    okpd2:    { raw_array_flat: "okpd2[]" }
    # active_only -> статусы процедур status[] (см. roseltorg_44fz: значения и
    # «активные» проверены на живом сайте).
    active_only: { raw_array_flat: "status[]" }
  state_ids:
    all: [5, 0, 1, 2, 3, 4]
    active: [5, 0, 1]

# lot-online (РАД) — 44-ФЗ (gz.lot-online.ru). Платформа_id = имя файла.
# Angular SPA, но список рендерится сервером по URL-параметрам
# (sort=1&sortDirection=ASC дата, status=accept). По дате -> стоп-порог.
# Селекторы СПИСКА ВЕРИФИЦИРОВАНЫ (снимок 2026-08-12); детальная страница грузится
# асинхронно — поля деталей (ОКПД2/файлы) требуют доработки (см. TODO).
name: "lot-online РАД (44-ФЗ)"
url: "https://gz.lot-online.ru"
list_path: "/etp_front/procedure/list"
list_config:
  container: "app-procedure-card"
  detail_link: "a.__link_purchase-number"
  next_page: ""
  page_param: "page"
  page_size: 10
  variables:
    # Номер — «№ 0120400000526000233» в ссылке.
    - { name: "number",           selector: "a.__link_purchase-number", handler: "regex", handler_arg: "№\\s*(\\d+)", default: "" }
    # Закон/способ — «44-ФЗ / Электронный аукцион».
    - { name: "law",              selector: ".card-div__procedureType", handler: "law", default: null }
    # Предмет — блок описания.
    - { name: "subject",          selector: ".__purchaseObjectInfo p", handler: "strip", default: "" }
    # Статус — «Прием заявок» (жирный span в блоке статуса).
    - { name: "status",           selector: ".card-div__procedureStatus span.fwb", handler: "strip", default: "" }
    - { name: "nmck",             selector: ".card-div__maxSum", handler: "money", default: null }
    # «Опубликована 12.08.2026 00:55» -> первая дата.
    - { name: "publication_date", selector: ".__publication-date", handler: "regex_datetime", handler_arg: "(\\d{2}\\.\\d{2}\\.\\d{4} \\d{2}:\\d{2})", default: null }
    # «12.08.2026 00:55 - 20.08.2026 05:56» -> вторая дата (окончание подачи).
    - { name: "deadline",         selector: ".card-div__procedureStatus", handler: "regex_datetime", handler_arg: "- (\\d{2}\\.\\d{2}\\.\\d{4} \\d{2}:\\d{2})", default: null }
    # Организатор — блок под заголовком «Организатор».
    - { name: "customer",         selector: ".card-div__placerTitle + div", handler: "strip", default: "" }
detail:
  # TODO: детальная страница грузится асинхронно (SPA) — поля ОКПД2/файлы/детали
  # требуют доработки (возможно, отдельная страница позиций или ожидание рендера).
  variables: []
  files: []
search:
  enabled: true
  # Слова ищутся по «ИЛИ»: парсер открывает отдельный поиск на каждое слово
  # (keywords_one_at_a_time) и объединяет результаты (дедуп по номеру).
  keywords_one_at_a_time: true
  # Расширение: слова и коды ищутся независимо (OR), чтобы слова не сужали
  # поиск по кодам.
  keywords_codes: "or"
  query_params:
    limit: "10"
    sort: "1"
    sortDirection: "ASC"
    status: "accept"
  criteria_map:
    # Слова -> параметр keywords (site принимает и одинарную, и двойную кодировку;
    # движок выдаёт одинарную — работает).
    keywords: { query_param: "keywords" }
    # ОКПД2 -> повторяемый okpd2=код (без индекса; индексную форму okpd2[0] сайт
    # игнорирует). Коды передаются как есть, сервер матчит по префиксу.
    okpd2:    { raw_array_flat: "okpd2" }

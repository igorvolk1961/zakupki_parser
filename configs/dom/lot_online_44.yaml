# lot-online (РАД) — 44-ФЗ (gz.lot-online.ru). Платформа_id = имя файла.
# Список и детали с 2026-08-18 читаются из открытого JSON API (без браузера):
# реестр GET /etp_back/procedure/list (search.api_endpoint) + детали двухшаговым
# JSON-RPC POST /etp_back/api/get (detail.api_format: lot_online — ОКПД2/позиции).
name: "lot-online РАД (44-ФЗ)"
url: "https://gz.lot-online.ru"
list_path: "/etp_front/procedure/list"
list_config:
  container: "app-procedure-card"
  detail_link: "a.__link_purchase-number"
  next_page: ""
  # API-реестр пагинируется через offset (шаг = page_size), а не page.
  page_param: "offset"
  # Размер страницы API lot-online капом не ограничен (limit=1000 возвращает 1000,
  # проверено 2026-08-20). 100 записей — разумный компромисс «время ответа/число запросов».
  page_size: 100
  variables:
    # Номер — «№ 0120400000526000233» в ссылке.
    - { name: "number",           selector: "a.__link_purchase-number", handler: "regex", handler_arg: "№\\s*(\\d+)", default: "" }
    # Закон/способ — «44-ФЗ / Электронный аукцион».
    - { name: "law",              selector: ".card-div__procedureType", handler: "law", default: null }
    # purchase_type — способ («Электронный аукцион») из того же блока.
    - { name: "purchase_type",    selector: ".card-div__procedureType", handler: "purchase_type", default: "" }
    # Предмет — блок описания.
    - { name: "subject",          selector: ".__purchaseObjectInfo p", handler: "strip", default: "" }
    # Статус — «Прием заявок» (жирный span в блоке статуса).
    - { name: "status",           selector: ".card-div__procedureStatus span.fwb", handler: "strip", default: "" }
    - { name: "nmck",             selector: ".card-div__maxSum", handler: "money", default: null }
    # «Опубликована 12.08.2026 00:55» -> первая дата.
    - { name: "publication_date", selector: ".__publication-date", handler: "regex_datetime", handler_arg: "(\\d{2}\\.\\d{2}\\.\\d{4} \\d{2}:\\d{2})", default: null }
    # «12.08.2026 00:55 - 20.08.2026 05:56» -> вторая дата (окончание подачи).
    - { name: "deadline",         selector: ".card-div__procedureStatus", handler: "regex_datetime", handler_arg: "- (\\d{2}\\.\\d{2}\\.\\d{4} \\d{2}:\\d{2})", default: null }
    # Организатор — блок под заголовком «Организатор».
    - { name: "customer",         selector: ".card-div__placerTitle + div", handler: "strip", default: "" }
detail:
  # Детали — из открытого JSON-RPC API (двухшагово: резолв номера -> лоты с
  # позициями и кодами ОКПД2). Детальная страница не открывается.
  api_format: "lot_online"
  variables: []
  files: []
search:
  enabled: true
  # Список читается из открытого JSON API реестра (GET /etp_back/procedure/list);
  # фильтрацию (слова/ОКПД2/статус) выполняет сервер (проверено 2026-08-18).
  api_endpoint: "/etp_back/procedure/list"
  # Записи реестра — в data.items (data.count — общее число результатов).
  api_items_key: "items"
  # Формат item'а — плоские поля реестра lot-online (purchaseNumber/maxSum/...).
  api_item_format: "lot_online"
  # Пагинация — offset (шаг = page_size), а не page.
  api_offset_step: 100
  query_params:
    limit: "100"
    offset: "0"
    # ВАЖНО (стоп-порог): сортировка активных (finishedPurchase) вперёд — как в UI
    # сайта. Выборка монотонна по дате только внутри каждой группы, поэтому
    # стоп-порог/«вся страница в БД» корректны при active_only=true (статус-фильтр
    # даёт одну группу finishedPurchase=0). В режиме «все» (active_only=false)
    # сортировка и стоп-логика несовместимы — обход до конца пагинации.
    "sort[0][property]": "finishedPurchase"
    "sort[0][direction]": "ASC"
    "sort[1][property]": "publicationDateTime"
    "sort[1][direction]": "DESC"
  criteria_map:
    # Слова -> полнотекстовый фильтр sphinx filter[*] (property=*).
    keywords: { filter: { key: "*", property: "*", condition: "match" } }
    # ОКПД2 -> filter[okpd2] со sphinx-префиксом "_" (код матчится по префиксу).
    okpd2: { filter: { key: "okpd2", property: "okpd2", condition: "match", value_prefix: "_" } }
    # active_only -> статус закупки filter[status]. Активные = accept (Прием
    # заявок) + commission (Работа комиссии) + contract (Заключение контракта) —
    # дефолт UI сайта. «Все» — параметр не ставится (сервер отдаёт весь реестр).
    active_only: { filter: { key: "status", property: "status", condition: "in" } }
  state_ids:
    active: ["accept", "commission", "contract"]

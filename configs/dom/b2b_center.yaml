# B2B-Center (b2b-center.ru). Платформа_id = имя файла.
# Серверный рендер, фильтры в URL. Анонимно доступен поиск только по ключевым
# словам (f_keyword=, синтаксис: смаз*, *пожар*, трубы !стальные, "электрод");
# доп. фильтры (ОКПД2/НМЦК/регион) — только после регистрации. Сортировка только
# по дате (order_by=1 публикация, order_by=2 дедлайн, order_dir=1/0) -> стоп-порог
# по дате работает. Селекторы ВЕРИФИЦИРОВАНЫ (снимок 2026-08-12, сверено с живым
# запросом 2026-08-13).
# ВНИМАНИЕ (пагинация): сервер ИГНОРИРУЕТ параметр page (проверено: ?page=2 отдаёт
# первую страницу), пагинация — клиентский JS-виджет `.pagi` (20 записей/страница).
# Поэтому обходим только первую страницу (next_page: ""), пока не подтверждён способ
# серверного перехода по страницам (см. план commercial-etps-addition-plan, задача 4).
name: "B2B-Center"
url: "https://www.b2b-center.ru"
list_path: "/market/"
list_config:
  container: "table.search-results tbody tr"
  detail_link: "a.search-results-title"
  next_page: ""
  variables:
    # Номер: «Запрос предложений № 4558864 …» из текста ссылки на тендер.
    - { name: "number",           selector: "a.search-results-title", handler: "regex", handler_arg: "№\\s*(\\d+)", default: "" }
    # purchase_type — тип процедуры до «№» в заголовке («Запрос предложений», «Аукцион»…).
    - { name: "purchase_type",    selector: "a.search-results-title", handler: "regex", handler_arg: "^(.+?)\\s*№", default: "" }
    # Предмет — блок описания под заголовком карточки (вложен внутрь <a> заголовка).
    - { name: "subject",          selector: ".search-results-title-desc", handler: "strip", default: "" }
    # Организатор — ссылка на карточку фирмы.
    - { name: "customer",         selector: "td a[href*='/firms/']", handler: "strip", default: "" }
    # Дата публикации / «Актуально до» — две колонки дат (МСК, с временем).
    - { name: "publication_date", selector: "td.nowrap", index: 0, handler: "datetime", default: null }
    - { name: "deadline",         selector: "td.nowrap", index: 1, handler: "datetime", default: null }
detail:
  variables:
    # НМЦК — «Общая стоимость закупки» (может быть «Без указания цены» -> None).
    - { name: "nmck",             selector: "tr#trade-info-lot-price td:last-child", handler: "money", default: null }
    - { name: "publication_date", selector: "tr#trade_info_date_begin td:last-child", handler: "datetime", default: null }
    - { name: "deadline",         selector: "tr#trade_info_date_end td:last-child", handler: "datetime", default: null }
    - { name: "customer",         selector: "tr#trade-info-organizer-name td:last-child", handler: "strip", default: "" }
  # Файлы/документы на B2B-Center доступны только зарегистрированным — TODO
  # при необходимости авторизации (см. plan).
  files: []
search:
  enabled: true
  # Статические параметры формы поиска: searching (обязательный маркер поиска),
  # trade=all (закупки+продажи), сортировка по дате. Параметр show (актуальные/
  # архив) управляется active_only: all — актуальные+архив, actual — только
  # актуальные (проверено на живом сайте 2026-08-17).
  query_params:
    searching: "1"
    trade: "all"
    order_by: "1"
    order_dir: "0"
  criteria_map:
    # Слова в f_keyword объединяются союзом «или» (OR в одном запросе) — проверено.
    # Многословные фразы — в кавычках (keywords_quote_phrases).
    keywords: { query_param: "f_keyword" }
    active_only: { query_param: "show" }
  state_ids:
    all: ["all"]
    active: ["actual"]
  # Слова по «ИЛИ» одним запросом (союз «или»), а не перебором по-одному.
  keywords_one_at_a_time: false
  keywords_separator: " или "
  keywords_quote_phrases: true

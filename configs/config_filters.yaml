# Конфигурация сортировки и фильтров на платформе (Реестр закупок).
# Сортировка и фильтры применяются до основного цикла парсинга.

# Установка порядка сортировки списка закупок.
sort:
  dropdown: "div.SortDropdownStyles__SortDropdownContainer-sc-1j5g9d7-0 .ui.dropdown"
  option_text: "По дате публикации"

# Поле сортировки по убыванию (по дате публикации закупки)
sort_descending_by: "publication_date"

# Кнопка применения фильтров (пусто — не применяется)
apply_button: null
wait_ms_after_apply: 1000

# Фильтры (DOM-шаги). Пока не заполнены — точные селекторы панели фильтров
# Реестра закупок требуют верификации (см. TODO).
filters: []

# Конфигурация фильтров и порядка их применения на платформе.
# Каждый фильтр — набор DOM-шагов, приводящих к выбору значения фильтра.
# Внимание: точные селекторы панели фильтров требуют верификации на живом сайте
# (см. TODO). Движок применения шагов реализован и покрыт тестами.

# Поле сортировки по убыванию (по дате обновления закупки)
sort_descending_by: "update_date"
# Селектор кнопки применения фильтров (уточнить на живом сайте)
apply_button: "button:has-text('Показать')"
wait_ms_after_apply: 1500

filters:
  # Пример фильтра по предмету (тематика ИТ-услуг). Шаги задают порядок
  # DOM-манипуляций: открыть поиск, ввести значение, подтвердить.
  - name: "subject_contains"
    steps:
      - { action: "click", selector: "input[name='subject']", wait_ms: 400 }
      - { action: "fill",  selector: "input[name='subject']", value: "ИИ" }
      - { action: "press", selector: "input[name='subject']", value: "Enter", wait_ms: 600 }

  # Пример фильтра по коду ОКПД2 (ИТ-услуги). Добавляется при уточнении DOM.
  - name: "okpd2_code"
    steps:
      - { action: "click", selector: "input[name='okpd2']", wait_ms: 400 }
      - { action: "fill",  selector: "input[name='okpd2']", value: "62.01" }
      - { action: "press", selector: "input[name='okpd2']", value: "Enter", wait_ms: 600 }

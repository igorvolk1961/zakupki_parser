# Сервисная конфигурация: таймер, список сайтов, пороги дат, флаги,
# подключение к БД, webhook и условия прекращения обработки заявки.

# Период запуска парсера по таймеру (в секундах)
timeout_seconds: 3600

# Список сайтов закупок (platform_id должен присутствовать в config_dom.yaml)
sites:
  - { platform_id: "zakupki_mos", enabled: false }
  - { platform_id: "zakupki_gov", enabled: true }

# Порог «дата последней обработанной записи» в днях (по умолчанию «сейчас − 7 дней»)
default_cutoff_days: 7

# Бизнес-критерии поиска (тематика фильтра)
search_criteria:
  # Коды ОКПД2 для фильтрации. Можно указывать ЛЮБОЙ известный код любой
  # вложенности (пользователю не нужно знать состав маппинга). Резолв:
  # 1) точный код -> его путь; 2) иначе объединение путей потомков;
  # 3) иначе путь ближайшего предка. Маппинг — config_dom.yaml -> search.okpd_tree_file.
  okpd_codes:
    - "62.01"   # разработка ПО,  ИТ-услуги и оригиналы ПО

# Файлы: ОСНОВНОЙ режим — не скачиваются; в БД сохраняются имя и URL скачивания
# с ЭТП (ТЗ — поля technical_spec_name/technical_spec_url, остальные — files_json).
# download_files: true включает скачивание в хранилище (MinIO/local).
download_files: false
# Скачивать только файлы, в имени которых есть одно из технических ключевых слов
# (например, только техническое задание). Работает при download_files: true.
download_technical_spec_only: true
technical_spec_keywords:
  - "техническое задание"
# Удалять файлы после дополнительной обработки (техническое задание сохраняется —
# на него ссылается БД)
delete_files_after_processing: true

documents_dir: "documents"
data_dir: "data"

# --- Хранилище скачанных файлов (ОПЦИОНАЛЬНО) ---
# Блок можно опустить — по умолчанию используется local (каталог documents_dir,
# в БД пишется путь). Для MinIO/совместимого хранилища переключите type: "s3"
# и укажите параметры ниже (обязательны при type=s3).
storage:
  type: "local"
  # type: "s3"
  # endpoint: "http://localhost:9000"
  # access_key: "minioadmin"
  # secret_key: "minioadmin"
  # bucket: "zakupki-documents"
  # secure: false
  # region: "us-east-1"

# --- База данных (PostgreSQL) ---
db:
  enabled: true
  dsn: "postgresql+asyncpg://postgres:postgres@localhost:5432/zakupki"
  connect_timeout_seconds: 5
  pool_min: 1
  pool_max: 5
  # Повторы записи при транзиентной ошибке БД (недоступность), до открытия circuit breaker
  retry_max_attempts: 3
  retry_backoff_seconds: 1.0

# --- Webhook-уведомления (сейчас заглушка/лог) ---
webhook:
  enabled: false
  url: null
  token: null
  timeout_seconds: 10

# --- Набор флагов-условий прекращения обработки очередной заявки ---
# Каждый флаг — условие, при котором заявка пропускается (не сохраняется,
# не уведомляется). Набор расширяется добавлением новых флагов.
stop_conditions:
  enabled: true
  # Не обрабатывать заявку, если срок приёма заявок (переменная 'deadline'
  # из config_dom.yaml) истёк к текущей дате.
  deadline_not_expired: true

# --- Circuit Breaker (вежливая деградация) ---
circuit_breaker_failure_threshold: 5
circuit_breaker_reset_timeout_seconds: 60

# Сервисная конфигурация: таймер, список сайтов, пороги дат, флаги,
# подключение к БД, уведомления и условия прекращения обработки заявки.

# Период запуска парсера по таймеру (в секундах)
timeout_seconds: 3600

# Список сайтов закупок (platform_id должен присутствовать в config_dom.yaml)
sites:
  - { platform_id: "zakupki_mos", enabled: false }
  - { platform_id: "zakupki_gov", enabled: true }

# Порог «дата последней обработанной записи» в днях (по умолчанию «сейчас − 7 дней»)
default_cutoff_days: 7

# Бизнес-критерии поиска (тематика фильтра). Платформонезависимые понятия;
# конкретная привязка к запросу каждой площадки — в config_dom.yaml (search.criteria_map).
search_criteria:
  # Коды ОКПД2 для фильтрации. Можно указывать ЛЮБОЙ известный код любой
  # вложенности (пользователю не нужно знать состав маппинга). Резолв:
  # 1) точный код -> его путь; 2) иначе объединение путей потомков;
  # 3) иначе путь ближайшего предка. Маппинг — config_dom.yaml -> search.okpd_tree_file.
  okpd_codes:
    - "58"    # программные продукты и услуги по разработке ПО
    - "62"    # разработка ПО, ИТ-услуги и оригиналы ПО
    - "63"    # услуги в области ИТ
    - "71.1"  # инженерно-техническое проектирование / ИТ-консалтинг
  # Ключевые слова для поиска в предмете/наименовании закупки (страховка там,
  # где ОКПД2 не заполнен или неточен). Пусто — поиск по словам не применяется.
  keywords:
    - "искусственный интеллект"
    - "автоматизация"
    - "разработка"
    - "обследование"
  # Диапазон НМЦК. Задайте минимальный порог, чтобы отсечь мелкие лоты,
  # не окупающие консалтинг. Подставляется через criteria_map (nmck_min/nmck_max).
  nmck_min: null
  nmck_max: null
  # Коды регионов для фильтрации. Резолвятся в needSpecificFilter.regionPaths через
  # search.region_tree_file (формат маппинга как у ОКПД2 — code_to_path).
  region_codes: []

# Файлы: ОСНОВНОЙ режим — не скачиваются; в БД сохраняются имя и URL скачивания
# с ЭТП (ТЗ — поля technical_spec_name/technical_spec_url, остальные — files_json).
# download_files: true включает скачивание в хранилище (MinIO/local).
download_files: false
# Скачивать только файлы, в имени которых есть одно из ключевых словосочетаний
# (например, "техническое задание"). Работает при download_files: true.
download_technical_spec_only: true
technical_spec_keywords:
  - "техническое задание"
# Удалять файлы после дополнительной обработки (техническое задание сохраняется —
# на него ссылается БД)
delete_files_after_processing: true

documents_dir: "documents"
data_dir: "data"

# --- Хранилище скачанных файлов (ОПЦИОНАЛЬНО) ---
# Блок можно опустить — по умолчанию используется local (каталог documents_dir,
# в БД пишется путь). Для MinIO/совместимого хранилища переключите type: "s3"
# и укажите параметры ниже (обязательны при type=s3).
storage:
  type: "local"
  # type: "s3"
  # endpoint: "http://localhost:9000"
  # access_key: "minioadmin"
  # secret_key: "minioadmin"
  # bucket: "zakupki-documents"
  # secure: false
  # region: "us-east-1"

# --- База данных (PostgreSQL) ---
db:
  enabled: true
  dsn: "postgresql+asyncpg://postgres:postgres@localhost:5432/zakupki"
  connect_timeout_seconds: 5
  pool_min: 1
  pool_max: 5
  # Повторы записи при транзиентной ошибке БД (недоступность), до открытия circuit breaker
  retry_max_attempts: 3
  retry_backoff_seconds: 1.0

# --- Уведомления подписчиков (telegram | webhook) ---
# Токен Telegram-бота НЕ хранится в конфиге — задаётся env ZAKUPKI_TELEGRAM_TOKEN.
notifications:
  backend: "webhook"        # telegram | webhook
  telegram:
    enabled: false
    chat_id: null           # '@my_zakupki_channel' или числовой id (для приватного)
    timeout_seconds: 10
  webhook:
    enabled: false
    url: null
    token: null
    timeout_seconds: 10

# --- Набор флагов-условий прекращения обработки очередной заявки ---
# Каждый флаг — условие, при котором заявка пропускается (не сохраняется,
# не уведомляется). Набор расширяется добавлением новых флагов.
stop_conditions:
  enabled: true
  # Не обрабатывать заявку, если срок приёма заявок (переменная 'deadline'
  # из config_dom.yaml) истёк к текущей дате.
  deadline_not_expired: true
  # Не обрабатывать заявку, если до срока подачи осталось меньше N календарных
  # дней (нужно время на подготовку заявки). null — условие отключено.
  min_deadline_days: 3

# --- Circuit Breaker (вежливая деградация) ---
circuit_breaker_failure_threshold: 5
circuit_breaker_reset_timeout_seconds: 60

timeout_seconds: 3600
sites:
- platform_id: zakupki_mos
  enabled: true
# ЕИС временно отключена — разбираемся с фильтрами на zakupki_mos
# (на ЕИС серверная фильтрация по ОКПД2/словам не подтверждена).
# Разделена на 44-ФЗ и 223-ФЗ (разные структуры детальных страниц).
- platform_id: zakupki_gov_44fz
  enabled: false
- platform_id: zakupki_gov_223fz
  enabled: false
# Коммерческие ЭТП (см. план .kilo/plans/*commercial-etps-addition-plan.md).
# Все включены с enabled: false — селекторы list_config/detail ещё плейсхолдеры,
# верификация по одной площадке (zp capture-fixture + run-once) перед включением.
- platform_id: roseltorg_44fz
  enabled: false
- platform_id: roseltorg_com
  enabled: false
- platform_id: fabrikant
  enabled: false
- platform_id: b2b_center
  enabled: false
- platform_id: etpgpb_223
  enabled: false
- platform_id: etpgpb_44
  enabled: false
- platform_id: lot_online_44
  enabled: false
- platform_id: lot_online_223
  enabled: false
default_cutoff_days: 1
search_criteria:
  okpd_codes:
  - '62.02'
  keywords:
  - ии
  - интеллект
  - автоматизация
  # Выбор закупок по состоянию: false — все, true — только активные
  # (применяется на площадках, где поддерживается, через stateIdIn).
  active_only: false
  fz44: true
  fz223: true
export_dir: data/export
db:
  dsn: postgresql+asyncpg://postgres:postgres@localhost:5432/zakupki
  enabled: true
  connect_timeout_seconds: 5.0
  pool_min: 1
  pool_max: 5
  retry_max_attempts: 3
  retry_backoff_seconds: 1.0
notifications:
  backend: max
  telegram:
    enabled: false
    chat_id: '-1004416405744'
    timeout_seconds: 10.0
  max:
    enabled: true
    chat_id: '-77593707840894'
    timeout_seconds: 10.0
    insecure_tls: true
  webhook:
    enabled: false
    timeout_seconds: 10.0
  notify_min_score: 0.0
stop_conditions:
  enabled: true
  # false — отключает ВСЕ отсечки по дедлайну (в т.ч. min_deadline_days ниже).
  deadline_not_expired: false
  # Применяется ТОЛЬКО если deadline_not_expired=true; null — условие отключено.
  min_deadline_days: 3
circuit_breaker_failure_threshold: 5
circuit_breaker_reset_timeout_seconds: 60.0

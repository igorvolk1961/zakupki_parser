default_cutoff_days: 14
sort_by_date_only: true
# Порядок обхода: снаружи площадки («platform_then_profile», кэширует одинаковые запросы
# различных профилей к одной площадке) либо снаружи профиль («profile_then_platform»).
profiles_loop_order: platform_then_profile
# Объединять идентичные поисковые обходы (площадка + одинаковые коды ОКПД2/НМЦК)
# разных профилей в один проход с веерной фильтрацией по каждому профилю.
deduplicate_requests: true
search_criteria:
  active_only: false
  deadline_not_expired: false
scoring:
  # Порог 0.0 = предварительная фильтрация по векторной близости выключена (как в
  # src/scoring_service/config.yaml). При включении — перекалибровать на исторической
  # выборке (доля score_method=sim) после изменения render_profile_embedding.
  embedding_filter_threshold: 0.0
  giga_embedding_alpha: 0.0
  giga_enabled: false
  num_refine_rounds: 1
  max_fit_score: 10.0
  min_fit_score: 0.0
  score_round_digits: 2
  normalize_fit_for_score: true
  tz_review_enabled: true
  tz_download_timeout: 30.0

# Конфигурация скоринга закупок.
# Скоринг карточки: Fit × P(win) × Margin.
#
# Дефолтный score вычисляется в парсере (fit-таблица ниже, P(win), Margin=НМЦК).
# Финальный внешний score приходит асинхронно через конвейер
# transport + scoring_service + Redis (ADR-7) и записывается через POST /score.

# Таблица fit(ОКПД2) — коэффициент соответствия закупки тематике (0..1).
# Ключ — код ОКПД2 (любой вложенности); значение распространяется и на дочерние
# (более длинные) коды, начинающиеся с него.
fit_table:
  "62.01": 0.9
  "62.02": 1.0
  "62.09": 0.7
  "63.11": 0.6

# fit для кода ОКПД2, отсутствующего в fit_table (и не пустого)
default_fit: 0.5

# fit для закупки без кода ОКПД2 (пустой код)
empty_code_fit: 1.0

# Вероятность победы P(win) (простейшая эвристика = 1.0)
p_win: 1.0

# Норма прибыли: Margin = НМЦК × margin_rate (норма прибыли контракта).
# 1.0 — margin = НМЦК; 1.2 — +20% к НМЦК.
margin_rate: 1.0

# Каскад скоринга Fit -> P(win) -> Margin (ADR-7). Парсер оркестрирует переходы:
# - после стадии Fit (score_method=fit), если fit_score >= pwin_fit_threshold,
#   закупка ставится в очередь pwin:jobs (сервис pwin_service);
# - после стадии P(win) (score_method=pwin), если накопленный score
#   (fit_score × p_win) >= margin_threshold, закупка ставится в очередь margin:jobs
#   (сервис margin_service). Уведомление подписчиков — на терминальной стадии.
#
# Три множителя хранятся отдельными полями: fit_score, p_win, margin;
# score — накопленное произведение (после margin = fit × p_win × margin).
pwin_fit_threshold: 0.5
margin_threshold: 0.6

# Стадии каскада включаются ТОЛЬКО после развёртывания соответствующих сервисов
# (pwin_service/margin_service): пока pwin_enabled=false, парсер не ставит задачи
# в pwin:jobs/margin:jobs и уведомляет подписчиков уже на стадии fit (безопасный
# ролл-аут — фит-результаты не теряются).
pwin_enabled: true
margin_enabled: true

# Адрес scoring_transport для авто-пуша задания на внешний скоринг (ADR-7).
# После сохранения закупки парсер отправляет POST /api/scoring/jobs с дефолтным скором.
# Если не задан — внешний скоринг не запускается, закупка остаётся с дефолтным score.
scoring_transport_url: "http://localhost:8200"

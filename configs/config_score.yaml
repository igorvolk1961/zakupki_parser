# Конфигурация внешнего скоринга закупок.
#
# Дефолтный (внутренний) скоринг УДАЛЁН: закупка сохраняется без оценки.
# Результат внешнего каскада (Fit/P(win)/Margin) приходит асинхронно через конвейер
# transport + scoring_service + Redis (ADR-7) и пишется в procurement_evaluations
# (per-profile) через POST /score. Приоритет очереди — время обновления/публикации.

# Каскад скоринга Fit -> P(win) -> Margin (ADR-7). Автокаскад ОТКЛЮЧЁН:
# P(win)/Margin вычисляются только по явному запросу тендеролога (on-demand,
# POST /api/procurements/pwin-margin — обе стадии ставятся сразу). Остаётся
# авто-Fit: после сохранения закупки парсер ставит задание fit:jobs.
#
# Уведомления — после каждой стадии, с порогами по возвращаемым значениям
# (notify_min_fit_score/notify_min_pwin/notify_min_margin в config_ops.yaml).
#
# Множители стадий хранятся в procurement_evaluations отдельными полями:
# fit_score, p_win, margin; score — накопленное произведение.

# Стадии P(win)/Margin включаются ТОЛЬКО после развёртывания соответствующих
# сервисов (pwin_service/margin_service): pwin_enabled/margin_enabled — флаги
# доступности сервисов для on-demand запросов тендеролога.
pwin_enabled: true
margin_enabled: true

# Адрес scoring_transport для авто-пуша задания на внешний скоринг (ADR-7).
# После сохранения закупки парсер отправляет POST /api/scoring/jobs.
# Если не задан — внешний скоринг не запускается, закупка остаётся без оценки.
scoring_transport_url: "http://localhost:8200"

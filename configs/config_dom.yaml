# DOM-конфигурация площадок закупок: URL, переменные, селекторы контейнеров
# и путей к значениям переменных. Изменяется без правки кода.
#
# Целевой раздел — Реестр закупок (/purchase/list). Классы styled-components
# хешированные (sc-…) и могут меняться при деплое — правки выполняются только здесь.

platforms:
  zakupki_mos:
    name: "Портал поставщиков Москвы"
    url: "https://zakupki.mos.ru"
    list_path: "/purchase/list"

    list_config:
      # Контейнер карточки закупки: прямой ребёнок списка, содержащий MainInfoContainer
      # (внутри него и MainInfo, и AdditionalInfo — регион/закон/даты).
      container: "div.PublicListStyles__PublicListContentContainer-sc-1epmhkd-1 > div:has(div.CardStyles__MainInfoContainer-sc-1rn3iq8-1)"
      # Ссылка на детальную страницу закупки
      detail_link: "a.CardStyles__MainInfoNumberHeader-sc-1rn3iq8-6"
      # Селектор перехода на следующую страницу (Semantic UI пагинация)
      next_page: "div.ui.pagination.menu a[type='nextItem']"
      # Имя переменной с датой публикации (используется для стоп-порога)
      publication_date: "publication_date"
      variables:
        - { name: "number",          selector: "a.CardStyles__MainInfoNumberHeader-sc-1rn3iq8-6", handler: "strip" }
        - { name: "purchase_type",   selector: "div.CardStyles__MainInfoTypeHeader-sc-1rn3iq8-3 span", handler: "strip", default: "" }
        - { name: "status",          selector: "span.EllipsedSpan__WordBreakSpan-sc-5i2ox1-0", index: 1, handler: "strip", default: "" }
        - { name: "subject",         selector: "span.EllipsedSpan__WordBreakSpan-sc-5i2ox1-0", index: 2, handler: "strip", default: "" }
        - { name: "customer",        selector: ".PurchaseCardStyles__MainInfoCustomerHeader-sc-xhk4mt-0", handler: "strip", default: "" }
        - { name: "nmck",            selector: "div.CardStyles__PriceInfoNumber-sc-1rn3iq8-11", handler: "money", default: null }
        - { name: "region",          selector: "div.CardStyles__AdditionalInfoHeader-sc-1rn3iq8-14", index: 0, handler: "strip", default: "" }
        # Закон, строка дат и производные извлекаются regex-обработчиками из всего
        # нижнего блока карточки — это не зависит от расклада полей внутри блока
        # (у карточек «B2B-закупка» позиции отличаются).
        - { name: "law",             selector: "div.CardStyles__AdditionalInfoContainer-sc-1rn3iq8-13", handler: "law", default: null }
        - { name: "publication_date", selector: "div.CardStyles__AdditionalInfoContainer-sc-1rn3iq8-13", handler: "pub_date", default: null }
        - { name: "deadline",        selector: "div.CardStyles__AdditionalInfoContainer-sc-1rn3iq8-13", handler: "deadline", default: null }

    detail:
      variables:
        - { name: "customer",    selector: "div.LabeledValue-sc-1ftjcqo-0:has(label:text-is('Заказчик')) > div", handler: "strip", default: "" }
        - { name: "nmck",        selector: "div.LabeledValue-sc-1ftjcqo-0:has(label:text-is('Начальная цена')) > div", handler: "money", default: null }
        - { name: "okpd2_name",  selector: "div.LabeledValue-sc-1ftjcqo-0:has(label:text-is('Наименование ОКПД2')) > div", handler: "strip", default: "" }
        - { name: "okpd2_code",  selector: "div.LabeledValue-sc-1ftjcqo-0:has(label:text-is('Код ОКПД2')) > div", handler: "strip", default: "" }
      files:
        # Ссылки на скачиваемые файлы: имя — текст ссылки, url скачивания с ЭТП — href
        - { selector: "a[href*='FileStorage/Download']", name_attribute: null, url_attribute: "href" }

    # Извлечение ИНН заказчика (ADR-4). На mos.ru ИНН — на странице организации
    # (/companyProfile/customer/{id}), куда ведёт ссылка на имя заказчика.
    organization:
      customer_link_selector: "div.LabeledValue-sc-1ftjcqo-0:has(label:text-is('Заказчик')) a"
      inn_from_link_regex: null
      inn_from_org_page: true
      inn_page_selector: null

    # --- Сортировка списка закупок ---
    # ВАЖНО: порядок фиксирован — «по дате публикации по убыванию»
    # (единственное значение order). Стоп-логика по дате последней записи основана на нём.
    sort:
      order: publication_date_desc
      dropdown: "div.SortDropdownStyles__SortDropdownContainer-sc-1j5g9d7-0 .ui.dropdown"
      option_text: "По дате публикации"

    # --- Фильтры (DOM-шаги). Пока не заполнены — точные селекторы панели
    #     фильтров Реестра закупок требуют верификации (см. TODO). ---
    filters: []

    # --- URL-фильтр списка закупок (механизм для этой площадки). ---
    # Маппинг полностью из конфига: имена параметров, структуры JSON, формат даты.
    # Плейсхолдеры: {filter_json}, {state_json}, {publish_date_great_equal}.
    search:
      enabled: true
      query_params:
        page: "1"
        perPage: "10"
        sortField: "relevance"
        sortDesc: "true"
        filter: "{filter_json}"
        state: "{state_json}"
      # Статичная часть параметра filter. Обобщённые критерии (config_service.yaml
      # -> search_criteria) подставляются через criteria_map ниже.
      filter_json:
        typeIn:
          values: [2]
        needSpecificFilter: {}
      state_json:
        currentTab: 2
      # Привязка обобщённых критериев к структуре запроса площадки. Коды ОКПД2
      # резолвятся в пути через okpd_tree_file.
      criteria_map:
        publish_date:  { json_path: "publishDateGreatEqual" }
        okpd2:         { json_path: "needSpecificFilter.okpdPaths" }
        nmck_min:      { json_path: "priceFrom" }
        nmck_max:      { json_path: "priceTo" }
      date_great_equal_format: "%d.%m.%Y 00:00:00"
      # Маппинг «код ОКПД2 -> путь» (дерево площадки, см. configs/codes/mos_okpd2_tree.json)
      okpd_tree_file: "configs/codes/mos_okpd2_tree.json"

  # ------------------------------------------------------------------------- #
  # ЕИС (zakupki.gov.ru) — 44-ФЗ/223-ФЗ
  # Серверный рендеринг; фильтрация через query-параметры расширенного поиска.
  # Внимание: ОКПД2-фильтр (okpd2Ids) через GET пока не подтверждён — см. TODO.
  # ------------------------------------------------------------------------- #
  zakupki_gov:
    name: "ЕИС (zakupki.gov.ru)"
    url: "https://zakupki.gov.ru"
    list_path: "/epz/order/extendedsearch/results.html"

    list_config:
      container: "div.search-registry-entry-block"
      detail_link: "a[href*='common-info.html']"
      next_page: "a.paginator-button-next"
      # Стоп-порог по дате «Обновлено» (task.md: дата обновления закупки)
      publication_date: "update_date"
      variables:
        - { name: "number",          selector: "a[href*='common-info.html']", handler: "regex", handler_arg: "№\\s*(\\d+)", default: "" }
        - { name: "law",             selector: "div.registry-entry__header-top__title", handler: "law", default: null }
        # Предмет закупки — «Объект закупки» в карточке списка (общий для 44-ФЗ и 223-ФЗ)
        - { name: "subject",         selector: "div.registry-entry__body-value", handler: "strip", default: "" }
        - { name: "status",          selector: "div.registry-entry__header-mid__title", handler: "strip", default: "" }
        # Заказчик: 44-ФЗ — organization/view/info.html, 223-ФЗ — organization/view223/info.html
        - { name: "customer",        selector: "a[href*='organization/view']", handler: "strip", default: "" }
        - { name: "nmck",            selector: "div.price-block__value", handler: "money", default: null }
        - { name: "publication_date", selector: "div.data-block__value", index: 0, handler: "date", default: null }
        - { name: "update_date",     selector: "div.data-block__value", index: 1, handler: "date", default: null }
        # «Окончание подачи заявок» — третий data-block (у 44-ФЗ и 223-ФЗ)
        - { name: "deadline",        selector: "div.data-block__value", index: 2, handler: "date", default: null }

    detail:
      # ОКПД2: 44-ФЗ — таблица позиций на common-info (заголовок «Код позиции»,
      # первая позиция); 223-ФЗ — доп. страница лотов (notice223/lot-list.html),
      # где значение отсутствует, значение основной страницы сохраняется.
      # Обеспечение/срок исполнения — секции «blockInfo__section» (44-ФЗ).
      variables:
        - { name: "okpd2_code", selector: "xpath=//table[.//th[contains(.,'Код позиции')]]//tbody/tr/td[2]", handler: "regex", handler_arg: "(?<![,\\d])(\\d{2}(?:\\.\\d{1,4})*)", default: null }
        - { name: "security_amount", selector: "xpath=//section[contains(@class,'blockInfo__section')][.//span[contains(@class,'section__title') and normalize-space(.)='Размер обеспечения исполнения контракта']]//span[contains(@class,'section__info')]", handler: "security", default: null }
        - { name: "security_amount_unit", selector: "xpath=//section[contains(@class,'blockInfo__section')][.//span[contains(@class,'section__title') and normalize-space(.)='Размер обеспечения исполнения контракта']]//span[contains(@class,'section__info')]", handler: "security_unit", default: null }
        - { name: "execution_term", selector: "xpath=//section[contains(@class,'blockInfo__section')][.//span[contains(@class,'section__title') and normalize-space(.)='Срок исполнения контракта']]//span[contains(@class,'section__info')]", handler: "strip", default: null }
        - { name: "region", selector: "xpath=//section[contains(@class,'blockInfo__section')][.//span[contains(@class,'section__title') and normalize-space(.)='Регион']]//span[contains(@class,'section__info')]", handler: "strip", default: null }
      additional_pages:
        - link_selector: "a[href*='lot-list.html']"
          variables:
            - { name: "okpd2_code", selector: "table.table.mb-0 td:nth-child(4)", handler: "regex", handler_arg: "(?<![,\\d])(\\d{2}(?:\\.\\d{1,4})*)", default: null }
      # Файлы закупки — на отдельной странице documents.html (файлы по
      # 44fz/filestore/public/...), имя файла — текст ссылки.
      files:
        - { selector: "a[href*='filestore/public/']", name_attribute: null, url_attribute: "href" }
      files_page: "documents.html"

    # Сортировка: фиксированный порядок — по дате обновления по убыванию
    sort:
      order: publication_date_desc
      dropdown: null
      option_text: null

    # Извлечение ИНН заказчика (ADR-4). На ЕИС 223-ФЗ ИНН есть в org-ссылке
    # (view223/info.html?inn=...); на 44-ФЗ — только organizationCode, ИНН
    # извлекается со страницы организации (inn_from_org_page).
    organization:
      customer_link_selector: "a[href*='organization/view']"
      inn_from_link_regex: "inn=(\\d{10,12})"
      inn_from_org_page: true
      inn_page_selector: null

    # URL-фильтр расширенного поиска ЕИС. Обобщённые критерии мапятся на плоские
    # query-параметры. ОКПД2: сервер игнорирует корневой id — нужен полный список
    # id/кодов поддерева (okpd2Ids + okpd2IdsCodes), см. configs/codes/gov_okpd2_tree.json.
    search:
      enabled: true
      query_params:
        morphology: "on"
        search-filter: "Дате размещения"
        pageNumber: "1"
        sortDirection: "false"
        recordsPerPage: "_50"
        showLotsInfoHidden: "false"
        sortBy: "UPDATE_DATE"
        currencyIdGeneral: "-1"
        okpd2IdsWithNested: "on"
      filter_json: {}
      state_json: {}
      criteria_map:
        publish_date:  { query_param: "publishDateFrom" }
        # Дата «Обновлено» (ЕИС updateDateFrom) — как в реальном URL; соответствует
        # стоп-логике по дате обновления закупки.
        update_date:   { query_param: "updateDateFrom" }
        # Срок подачи заявок (applSubmissionCloseDateFrom) = сегодня — отсекает
        # просроченные заявки (дедлайн обязателен).
        deadline_from: { query_param: "applSubmissionCloseDateFrom" }
        # Законы: fz44/fz223 включаются параметром fz44=on/fz223=on (критерии
        # из config_service.yaml -> search_criteria).
        fz44:          { query_param: "fz44" }
        fz223:         { query_param: "fz223" }
        # okpd2IdsWithNested=on (в query_params) включает дочерние узлы — перечислять
        # всё поддерево не нужно, достаточно собственных id выбранных кодов.
        okpd2:
          query_params:
            okpd2Ids: "{okpd2_ids}"
        # Текстовый поиск (searchString) не применяется: тематику задаёт ОКПД2,
        # а поиск по словам сужает выдачу (AND-семантика).
        nmck_min:      { query_param: "priceFromGeneral" }
        nmck_max:      { query_param: "priceToGeneral" }
      date_great_equal_format: "%d.%m.%Y"
      # Маппинг «код ОКПД2 -> id ЕИС» (полное поддерево 62/63, см. gov.html)
      okpd_tree_file: "configs/codes/gov_okpd2_tree.json"

# Эксплуатационная конфигурация (config_ops.yaml) — управляется devops.
# Здесь: таймер цикла, подключение к БД, уведомления, каталог выгрузки,
# параметры circuit breaker. Аналитические настройки — в config_service.yaml.
timeout_seconds: 3600
# Внеочередной обход профиля после создания/изменения (fast-start): короткая пауза
# перед запуском, чтобы серия правок копилась в один обход.
profile_refresh_debounce_seconds: 3.0
# Авторизация API всегда включена. Секрет подписи токенов задаётся через env
# ZAKUPKI_AUTH_SECRET, внутренний токен конвейера — через ZAKUPKI_INTERNAL_TOKEN
# (в YAML не хранятся). Пока — вход по логину/паролю, позже — OAuth2 через Сбер ID.
auth:
  token_ttl_seconds: 43200
db:
  dsn: postgresql+asyncpg://postgres:postgres@localhost:5432/zakupki
  enabled: true
  connect_timeout_seconds: 5.0
  pool_min: 1
  pool_max: 5
  retry_max_attempts: 3
  retry_backoff_seconds: 1.0
notifications:
  backend: max
  telegram:
    enabled: false
    chat_id: '-1004416405744'
    timeout_seconds: 10.0
  max:
    enabled: true
    chat_id: '-77593707840894'
    timeout_seconds: 10.0
    insecure_tls: true
  webhook:
    enabled: false
    timeout_seconds: 10.0
  # Уведомления — после каждой стадии каскада (fit/pwin/margin), порог по
  # возвращаемому значению стадии; 0 — порог отключён (уведомлять без ограничений).
  # notify_fit_enabled/notify_pwin_enabled/notify_margin_enabled=false — стадия
  # нотификации выключена целиком (уведомление после стадии не отправляется вовсе).
  notify_fit_enabled: true
  notify_min_fit_score: 0.7
  notify_pwin_enabled: false
  notify_min_pwin: 0.0
  notify_margin_enabled: false
  notify_min_margin: 0.0
export_dir: data/export
# Каталог промптов scoring_service (вкладка «Промпты» web-интерфейса).
# Относительный путь — от корня проекта; в Docker переопределяется
# через ZAKUPKI_PROMPTS_DIR (общий том с scoring_service).
prompts_dir: src/scoring_service/scoring_service/pipeline/prompts
# Каталог промптов analysis_service (вкладка «Промпты» web-интерфейса).
# Относительный путь — от корня проекта; в Docker переопределяется
# через ZAKUPKI_ANALYSIS_PROMPTS_DIR (общий том с analysis_service).
analysis_prompts_dir: src/analysis_service/analysis_service/pipeline/prompts
circuit_breaker_failure_threshold: 5
circuit_breaker_reset_timeout_seconds: 60.0

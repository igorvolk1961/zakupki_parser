version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zakupki
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: liquibase/liquibase:4.30
    depends_on:
      db:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://db:5432/zakupki
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: postgres
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.yaml
    volumes:
      - ./liquibase/changelog:/liquibase/changelog
    command: >
      --search-path=/liquibase/changelog
      --changelog-file=db.changelog-master.yaml
      update

  parser:
    build: .
    depends_on:
      liquibase:
        condition: service_completed_successfully
    environment:
      ZAKUPKI_CONFIGS: /app/configs
      ZAKUPKI_DB_DSN: postgresql+asyncpg://postgres:postgres@db:5432/zakupki
    volumes:
      - ./configs:/app/configs
      - parser-data:/app/data
      - parser-documents:/app/documents
    restart: unless-stopped

volumes:
  pgdata:
  parser-data:
  parser-documents:

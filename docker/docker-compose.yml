services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zakupki_dev
    ports:
      - "${ZAKUPKI_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: liquibase/liquibase:4.30
    depends_on:
      db:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://db:5432/zakupki_dev
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: postgres
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.yaml
    volumes:
      - ./liquibase/changelog:/liquibase/changelog
    command: >
      --search-path=/liquibase/changelog
      --changelog-file=db.changelog-master.yaml
      update

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Self-hosted LangFuse (v3) для трассировки LLM-вызовов scoring_service ---
  # UI: http://localhost:3000 (логин/пароль админа — из LANG_ADMIN_PASSWORD в docker/.env)
  #
  # ПРИМЕЧАНИЕ про warning «Redis ... a password was supplied» в логах langfuse-web /
  # langfuse-worker: это известная косметическая особенность образов langfuse:4 —
  # клиент всё равно отправляет AUTH с внутренним дефолтным паролем, который env
  # REDIS_PASSWORD не переопределяет. Warning безвреден (инжест трейсов работает),
  # redis запущен без requirepass, поэтому НЕ надо добавлять --requirepass: это
  # сломало бы подключение langfuse (WRONGPASS). Игнорировать.

  langfuse-db:
    image: postgres:16-alpine
    profiles: ["langfuse"]
    environment:
      POSTGRES_USER: ${LANG_PG_USER:-}
      POSTGRES_PASSWORD: ${LANG_PG_PASSWORD:-}
      POSTGRES_DB: ${LANG_PG_DB:-langfuse}
    ports:
      # Host-порт langfuse-db настраивается (LANGFUSE_DB_PORT), чтобы несколько
      # стеков (например, dev и демо) не дрались за один и тот же порт 5433.
      - "${LANGFUSE_DB_PORT:-5433}:5432"
    volumes:
      - langfuse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANG_PG_USER:-langfuse} -d ${LANG_PG_DB:-langfuse}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    profiles: ["langfuse"]
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${LANG_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANG_CLICKHOUSE_PASSWORD:-clickhouse}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  minio:
    image: minio/minio:latest
    profiles: ["langfuse"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - "${LANGFUSE_S3_PORT:-9000}:9000"
      - "${LANGFUSE_S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    profiles: ["langfuse"]
    depends_on:
      minio:
        condition: service_started
    entrypoint: /bin/sh
    command: >
      -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-} ${MINIO_ROOT_PASSWORD:-}; do sleep 2; done;
      mc mb --ignore-existing local/${LANG_S3_BUCKET:-langfuse};
      "

  langfuse-web:
    image: langfuse/langfuse:4
    profiles: ["langfuse"]
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${LANG_DB_URL:-}
      SALT: ${LANG_SALT:-}
      ENCRYPTION_KEY: ${LANG_ENCRYPTION_KEY:-}
      NEXTAUTH_URL: ${LANG_NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${LANG_NEXTAUTH_SECRET:-}
      CLICKHOUSE_MIGRATION_URL: clickhouse://${LANG_CLICKHOUSE_USER:-clickhouse}:${LANG_CLICKHOUSE_PASSWORD:-clickhouse}@clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${LANG_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANG_CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      S3_ENDPOINT: ${LANG_S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET_NAME: ${LANG_S3_BUCKET:-langfuse}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
      S3_REGION: ${LANG_S3_REGION:-us-east-1}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANG_S3_BUCKET:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANG_S3_REGION:-us-east-1}
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${LANG_S3_ENDPOINT:-http://minio:9000}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANG_S3_BUCKET:-langfuse}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: ${LANG_S3_REGION:-us-east-1}
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANG_S3_ENDPOINT:-http://minio:9000}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_BUCKET: ${LANG_S3_BUCKET:-langfuse}
      LANGFUSE_S3_BATCH_EXPORT_REGION: ${LANG_S3_REGION:-us-east-1}
      LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: ${LANG_S3_ENDPOINT:-http://minio:9000}
      LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_BATCH_EXPORT_PREFIX: exports/
      LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-}
      LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
      REDIS_HOST: ${LANG_REDIS_HOST:-redis}
      REDIS_PORT: ${LANG_REDIS_PORT:-6379}
      LANGFUSE_INIT_ORG_ID: ${LANG_INIT_ORG_ID:-88051fb1-2a0d-4597-be27-5bc72fb35b4b}
      LANGFUSE_INIT_ORG_NAME: ${LANG_INIT_ORG:-zakupki}
      LANGFUSE_INIT_PROJECT_ID: ${LANG_INIT_PROJECT_ID:-6fe17ddf-46f9-49db-930c-c49e72626802}
      LANGFUSE_INIT_PROJECT_NAME: ${LANG_INIT_PROJECT:-zakupki}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANG_INIT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANG_INIT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANG_INIT_USER_EMAIL:-admin@example.com}
      LANGFUSE_INIT_USER_NAME: ${LANG_INIT_USER_NAME:-admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANG_ADMIN_PASSWORD:-}
    ports:
      - "${LANGFUSE_UI_PORT:-3000}:3000"
    restart: unless-stopped

  langfuse-worker:
    image: langfuse/langfuse-worker:4
    profiles: ["langfuse"]
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${LANG_DB_URL:-}
      SALT: ${LANG_SALT:-}
      ENCRYPTION_KEY: ${LANG_ENCRYPTION_KEY:-}
      NEXTAUTH_URL: ${LANG_NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${LANG_NEXTAUTH_SECRET:-}
      CLICKHOUSE_MIGRATION_URL: clickhouse://${LANG_CLICKHOUSE_USER:-clickhouse}:${LANG_CLICKHOUSE_PASSWORD:-clickhouse}@clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${LANG_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANG_CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      S3_ENDPOINT: ${LANG_S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET_NAME: ${LANG_S3_BUCKET:-langfuse}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
      S3_REGION: ${LANG_S3_REGION:-us-east-1}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANG_S3_BUCKET:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANG_S3_REGION:-us-east-1}
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${LANG_S3_ENDPOINT:-http://minio:9000}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANG_S3_BUCKET:-langfuse}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: ${LANG_S3_REGION:-us-east-1}
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANG_S3_ENDPOINT:-http://minio:9000}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_BUCKET: ${LANG_S3_BUCKET:-langfuse}
      LANGFUSE_S3_BATCH_EXPORT_REGION: ${LANG_S3_REGION:-us-east-1}
      LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: ${LANG_S3_ENDPOINT:-http://minio:9000}
      LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_BATCH_EXPORT_PREFIX: exports/
      LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-}
      LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
      REDIS_HOST: ${LANG_REDIS_HOST:-redis}
      REDIS_PORT: ${LANG_REDIS_PORT:-6379}
    restart: unless-stopped

  scoring-service:
    build:
      context: ../src
      dockerfile: scoring_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SCORE_REDIS_URL: redis://redis:6379/0
      SCORE_PARSER_API_URL: http://api:8000
      SCORE_PARSER_INTERNAL_TOKEN: ${ZAKUPKI_INTERNAL_TOKEN:-}
      SCORE_USE_STUB: "false"
      # LLM (OpenAI-совместимый) — см. SCORE_LLM_* в docker/.env
      SCORE_LLM_BASE_URL: ${SCORE_LLM_BASE_URL:-}
      SCORE_LLM_API_KEY: ${SCORE_LLM_API_KEY:-}
      SCORE_LLM_MODEL: ${SCORE_LLM_MODEL:-}
      # LangFuse-трассировка (self-hosted в этом compose). Ключи совпадают с
      # LANG_INIT_PUBLIC_KEY/SECRET_KEY из docker/.env (см. сервис langfuse-web).
      LANGFUSE_PUBLIC_KEY: ${LANG_INIT_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANG_INIT_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANG_HOST:-http://langfuse-web:3000}
      # Общий том промптов: правки из вкладки «Промпты» (api) видны при следующем старте.
      SCORE_PROMPTS_DIR: /app/prompts
    volumes:
      - ../src/scoring_service/scoring_service/pipeline/prompts:/app/prompts
    restart: unless-stopped

  scoring-transport:
    build:
      context: ../src
      dockerfile: scoring_transport/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      TRANSPORT_REDIS_URL: redis://redis:6379/0
      TRANSPORT_PARSER_API_URL: http://api:8000
      TRANSPORT_PARSER_INTERNAL_TOKEN: ${ZAKUPKI_INTERNAL_TOKEN:-}
      # Bearer-токен для inbound-запросов (авто-пуш от парсера): тот же внутренний
      # service-to-service секрет, что и у парсера. serve без него не стартует.
      TRANSPORT_AUTH_TOKEN: ${ZAKUPKI_INTERNAL_TOKEN:-}
    ports:
      - "${TRANSPORT_PORT:-8200}:8200"
    restart: unless-stopped

  pwin-service:
    build:
      context: ../src
      dockerfile: pwin_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PWIN_REDIS_URL: redis://redis:6379/0
      PWIN_PARSER_API_URL: http://api:8000
      PWIN_PARSER_INTERNAL_TOKEN: ${ZAKUPKI_INTERNAL_TOKEN:-}
    restart: unless-stopped

  margin-service:
    build:
      context: ../src
      dockerfile: margin_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      MARGIN_REDIS_URL: redis://redis:6379/0
      MARGIN_PARSER_API_URL: http://api:8000
      MARGIN_PARSER_INTERNAL_TOKEN: ${ZAKUPKI_INTERNAL_TOKEN:-}
    restart: unless-stopped

  analysis-service:
    build:
      context: ../src
      dockerfile: analysis_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    env_file:
      - ../.env
    environment:
      ANALYSIS_REDIS_URL: redis://redis:6379/0
      ANALYSIS_PARSER_API_URL: http://api:8000
      ANALYSIS_PARSER_INTERNAL_TOKEN: ${ZAKUPKI_INTERNAL_TOKEN:-}
      # Эмбеддинги: прямой Giga Embedder (те же модель и ключи, что и у scoring_service).
      ANALYSIS_GIGA_ENABLED: ${ANALYSIS_GIGA_ENABLED:-true}
      ANALYSIS_GIGA_BASE_URL: ${ANALYSIS_GIGA_BASE_URL:-https://gigachat.devices.sberbank.ru/api/v1}
      ANALYSIS_GIGA_EMBEDDINGS_MODEL: ${ANALYSIS_GIGA_EMBEDDINGS_MODEL:-EmbeddingsGigaR}
      ANALYSIS_GIGA_AUTH_URL: ${ANALYSIS_GIGA_AUTH_URL:-https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
      ANALYSIS_GIGA_CLIENT_ID: ${ANALYSIS_GIGA_CLIENT_ID:-}
      ANALYSIS_GIGA_CLIENT_SECRET: ${ANALYSIS_GIGA_CLIENT_SECRET:-}
      ANALYSIS_GIGA_VERIFY_SSL: ${ANALYSIS_GIGA_VERIFY_SSL:-false}
      ANALYSIS_EMBEDDING_BASE_URL: ${ANALYSIS_EMBEDDING_BASE_URL:-http://gpt2giga:8080/v1}
      ANALYSIS_EMBEDDING_MODEL: ${ANALYSIS_EMBEDDING_MODEL:-EmbeddingsGigaR}
      ANALYSIS_LLM_BASE_URL: ${ANALYSIS_LLM_BASE_URL:-}
      ANALYSIS_LLM_MODEL: ${ANALYSIS_LLM_MODEL:-deepseek-chat}
      ANALYSIS_LLM_API_KEY: ${ANALYSIS_LLM_API_KEY:-}
      # LangFuse-трассировка LLM-вердиктов и эмбеддингов (self-hosted в этом compose).
      LANGFUSE_PUBLIC_KEY: ${LANG_INIT_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANG_INIT_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANG_HOST:-http://langfuse-web:3000}
      # Общий том промптов: правки из вкладки «Промпты» (api) видны при следующем старте.
      ANALYSIS_PROMPTS_DIR: /app/analysis-prompts
    volumes:
      - ../src/analysis_service/analysis_service/pipeline/prompts:/app/analysis-prompts
    restart: unless-stopped

  # api — единый процесс парсера: веб-интерфейс (панель devops) и, по умолчанию,
  # цикл мониторинга в том же процессе (флаг auto_start_monitoring в config_ops.yaml).
  # Отдельный контейнер-воркер run-service не нужен: выключенный флаг оставляет
  # запуск цикла только за кнопкой на панели devops.
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      liquibase:
        condition: service_completed_successfully
    env_file:
      - ../.env
    environment:
      ZAKUPKI_CONFIGS: /app/configs
      ZAKUPKI_DB_DSN: postgresql+asyncpg://postgres:postgres@db:5432/zakupki_dev
      ZAKUPKI_NOTIFY_BACKEND: none
      ZAKUPKI_SCORING_TRANSPORT_URL: http://scoring-transport:8200
      # Обнуляем host-путь к Chromium из корневого .env (env_file ../.env): он нужен
      # локальному run_all.sh, но в контейнере указывает на несуществующий файл.
      # Пустая строка = браузер берётся из PLAYWRIGHT_BROWSERS_PATH=/ms-playwright.
      ZAKUPKI_CHROMIUM_EXECUTABLE: ""
      # Общий том промптов: вкладка «Промпты» пишет сюда, scoring_service читает.
      ZAKUPKI_PROMPTS_DIR: /app/prompts
      # Общий том промптов анализатора: вкладка «Промпты» пишет сюда,
      # analysis_service читает при следующем старте.
      ZAKUPKI_ANALYSIS_PROMPTS_DIR: /app/analysis-prompts
    ports:
      - "${API_PORT:-8000}:8000"
    command: >
      uv run zp --configs /app/configs serve --host 0.0.0.0 --port 8000
    volumes:
      - ../configs:/app/configs
      - ../src/scoring_service/scoring_service/pipeline/prompts:/app/prompts
      - ../src/analysis_service/analysis_service/pipeline/prompts:/app/analysis-prompts
    restart: unless-stopped

volumes:
  pgdata:
  langfuse_pgdata:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  minio_data:

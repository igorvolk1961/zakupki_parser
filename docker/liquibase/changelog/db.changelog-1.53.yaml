databaseChangeLog:
- changeSet:
    id: 54
    author: zakupki-parser
    comment: 'Регион закупки и целевые регионы профиля: procurements.region (TEXT, nullable — извлекается по площадкам на уровне списка/деталей), profiles.target_regions (JSONB NOT NULL, клиентская пост-фильтрация профиля, как ключевые слова R9) и profiles.max_region_distance_km (NUMERIC nullable — макс. расстояние от центра региона в км, проверяется только на этапе анализа)'
    changes:
    - sql:
        splitStatements: false
        sql: ALTER TABLE procurements ADD COLUMN IF NOT EXISTS region TEXT;
    - sql:
        splitStatements: false
        sql: ALTER TABLE profiles ADD COLUMN IF NOT EXISTS target_regions JSONB NOT NULL DEFAULT '[]'::jsonb;
    - sql:
        splitStatements: false
        sql: ALTER TABLE profiles ADD COLUMN IF NOT EXISTS max_region_distance_km NUMERIC;

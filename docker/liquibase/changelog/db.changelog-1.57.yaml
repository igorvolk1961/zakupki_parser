databaseChangeLog:
- changeSet:
    id: 59
    author: zakupki-parser
    comment: 'Поисковый индекс закупок (procurement_search_index) для фоновой индексации описаний+документов по ОКПД2 (indexing_service, IndexingConfig): один-к-одному с procurements, search_tsv — GENERATED ALWAYS AS STORED tsvector из subject_snapshot+document_text (обе колонки этой же таблицы — денормализация subject нужна, т.к. generated-колонка не может ссылаться на другую таблицу), с GIN-индексом для мгновенного tsquery-поиска при «горячем» пересборе профиля. Конфигурация to_tsvector — simple (НЕ russian): DSL ключевых слов (parser/filtering.py) не делает лингвистический стемминг, только символьное усечение/точное слово — simple даёт транслятору (parser/filtering_tsquery.py) точное соответствие без морфологии Postgres.'
    changes:
    - sql:
        splitStatements: false
        sql: |
          CREATE TABLE IF NOT EXISTS procurement_search_index (
              id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
              procurement_id bigint NOT NULL REFERENCES procurements(id) ON DELETE CASCADE,
              okpd2_normalized text,
              subject_snapshot text,
              document_text text,
              search_tsv tsvector GENERATED ALWAYS AS (
                  to_tsvector('simple', coalesce(subject_snapshot, '') || ' ' || coalesce(document_text, ''))
              ) STORED,
              content_hash text,
              status text NOT NULL DEFAULT 'pending',
              indexed_at timestamptz,
              error_message text,
              created_at timestamptz NOT NULL DEFAULT now(),
              updated_at timestamptz NOT NULL DEFAULT now()
          );
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint WHERE conname = 'uq_procurement_search_index_procurement'
            ) THEN
              ALTER TABLE procurement_search_index
                ADD CONSTRAINT uq_procurement_search_index_procurement UNIQUE (procurement_id);
            END IF;
          END
          $$;
          CREATE INDEX IF NOT EXISTS ix_procurement_search_index_procurement
              ON procurement_search_index (procurement_id);
          CREATE INDEX IF NOT EXISTS ix_procurement_search_index_okpd2
              ON procurement_search_index (okpd2_normalized);
          CREATE INDEX IF NOT EXISTS ix_procurement_search_index_search_tsv
              ON procurement_search_index USING GIN (search_tsv);
          COMMENT ON TABLE procurement_search_index IS 'Поисковый индекс закупки (описание+документы) для фоновой индексации по ОКПД2 — заполняется indexing_service, читается для мгновенного «горячего» пересбора профиля (роутинг в scheduler.py)';
          COMMENT ON COLUMN procurement_search_index.search_tsv IS 'GENERATED ALWAYS AS STORED — приложение эту колонку не пишет, только читает/матчит через GIN-индекс';

databaseChangeLog:
  - changeSet:
      id: 28
      author: zakupki-parser
      comment: "Пользователи сервиса (users): администратор и тендеролог; вход по логину/паролю (позже — OAuth2 Сбер ID)"
      changes:
        - sql:
            sql: |
              CREATE TABLE users (
                  id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  username varchar(128) NOT NULL,
                  password_hash text NOT NULL,
                  role varchar(32) NOT NULL,
                  created_at timestamptz NOT NULL DEFAULT now(),
                  updated_at timestamptz NOT NULL DEFAULT now(),
                  CONSTRAINT uq_users_username UNIQUE (username)
              );

              CREATE INDEX ix_users_username ON users (username);

              COMMENT ON TABLE users IS 'Пользователи сервиса: admin (управление) / tenderologist (работа с закупками)';
              COMMENT ON COLUMN users.password_hash IS 'PBKDF2-хэш пароля: pbkdf2_sha256$<iterations>$<salt_hex>$<hash_hex>';
              COMMENT ON COLUMN users.role IS 'Роль: admin | tenderologist';

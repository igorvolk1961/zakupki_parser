databaseChangeLog:
  - changeSet:
      id: 22
      author: zakupki-parser
      comment: "Справочник типов процедур procedure_types + маппинги procedure_type_mappings + procurements.procedure_type_id"
      changes:
        - sql:
            sql: |
              -- 1) справочник типов процедур (канонические + «сырые» от площадок)
              CREATE TABLE procedure_types (
                  id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  name text NOT NULL,
                  normalized_name text NOT NULL,
                  is_canonical boolean NOT NULL DEFAULT false,
                  created_at timestamptz NOT NULL DEFAULT now(),
                  updated_at timestamptz NOT NULL DEFAULT now(),
                  CONSTRAINT uq_procedure_types_normalized_name UNIQUE (normalized_name)
              );

              -- 2) соответствие «площадка -> канонический тип» (предзагруженный справочник)
              CREATE TABLE procedure_type_mappings (
                  id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  platform_id varchar(128) NOT NULL,
                  native_name text NOT NULL,
                  normalized_name text NOT NULL,
                  procedure_type_id bigint NOT NULL REFERENCES procedure_types(id) ON DELETE CASCADE,
                  created_at timestamptz NOT NULL DEFAULT now(),
                  updated_at timestamptz NOT NULL DEFAULT now(),
                  CONSTRAINT uq_procedure_type_mapping UNIQUE (platform_id, normalized_name)
              );

              -- 3) связь procurements -> procedure_types
              ALTER TABLE procurements ADD COLUMN procedure_type_id bigint;
              ALTER TABLE procurements ADD CONSTRAINT fk_procurements_procedure_type
                  FOREIGN KEY (procedure_type_id) REFERENCES procedure_types(id) ON DELETE SET NULL;

              -- 4) канонический справочник: способы 44-ФЗ + общие способы 223-ФЗ/коммерческих
              --    (засеян из дропдауна «Тип процедуры» fabrikant и способов ЕИС, 2026-08-17)
              INSERT INTO procedure_types (name, normalized_name, is_canonical) VALUES
                  ('Электронный аукцион',               'электронный аукцион',               true),
                  ('Электронный конкурс',               'электронный конкурс',               true),
                  ('Открытый конкурс',                  'открытый конкурс',                  true),
                  ('Конкурс с ограниченным участием',   'конкурс с ограниченным участием',   true),
                  ('Двухэтапный конкурс',               'двухэтапный конкурс',               true),
                  ('Закрытый конкурс',                  'закрытый конкурс',                  true),
                  ('Закрытый аукцион',                  'закрытый аукцион',                  true),
                  ('Запрос котировок',                  'запрос котировок',                  true),
                  ('Запрос предложений',                'запрос предложений',                true),
                  ('Закупка у единственного поставщика','закупка у единственного поставщика',true),

                  ('Ценовой запрос',                    'ценовой запрос',                    true),
                  ('Конкурентный отбор',                'конкурентный отбор',                true),
                  ('Анализ предложений',                'анализ предложений',                true),
                  ('Запрос оферт',                      'запрос оферт',                      true),
                  ('Предварительный отбор',             'предварительный отбор',             true),
                  ('Публичное предложение',             'публичное предложение',             true),
                  ('Аукцион продавца',                  'аукцион продавца',                  true),
                  ('Конкурс продавца',                  'конкурс продавца',                  true),
                  ('Публичное предложение продавца',    'публичное предложение продавца',    true),
                  ('Исследование рынка',                'исследование рынка',                true),
                  ('Запрос ТКП',                        'запрос ткп',                        true),
                  ('Иной способ',                       'иной способ',                       true),
                  ('Закупка по потребностям',           'закупка по потребностям',           true),
                  ('Котировочная сессия',               'котировочная сессия',               true),
                  ('Конкурентная процедура',            'конкурентная процедура',            true),
                  ('B2B-закупка',                       'b2b-закупка',                       true),
                  ('МСП в электронном магазине без приёма предложений',
                    'мсп в электронном магазине без приёма предложений',                      true)
              ON CONFLICT (normalized_name) DO NOTHING;

              -- 5) маппинги «родное значение площадки -> канонический тип».
              --    (platform_id, native_name, canonical_name)
              INSERT INTO procedure_type_mappings (platform_id, native_name, normalized_name, procedure_type_id)
              SELECT m.platform_id, m.native_name,
                     lower(trim(regexp_replace(m.native_name, '[[:space:]]+', ' ', 'g'))),
                     t.id
              FROM (VALUES
                  -- ЕИС 44-ФЗ / 223-ФЗ (способы из шапки карточки)
                  ('zakupki_gov_44fz', 'Электронный аукцион',                'Электронный аукцион'),
                  ('zakupki_gov_44fz', 'Электронный конкурс',                'Электронный конкурс'),
                  ('zakupki_gov_44fz', 'Открытый конкурс',                   'Открытый конкурс'),
                  ('zakupki_gov_44fz', 'Конкурс с ограниченным участием',    'Конкурс с ограниченным участием'),
                  ('zakupki_gov_44fz', 'Двухэтапный конкурс',                'Двухэтапный конкурс'),
                  ('zakupki_gov_44fz', 'Запрос котировок',                   'Запрос котировок'),
                  ('zakupki_gov_44fz', 'Запрос предложений',                 'Запрос предложений'),
                  ('zakupki_gov_44fz', 'Закупка у единственного поставщика', 'Закупка у единственного поставщика'),
                  ('zakupki_gov_223fz', 'Иной способ',                       'Иной способ'),
                  ('zakupki_gov_223fz', 'Открытый конкурс',                  'Открытый конкурс'),
                  ('zakupki_gov_223fz', 'Аукцион',                           'Аукцион'),
                  ('zakupki_gov_223fz', 'Запрос котировок',                  'Запрос котировок'),
                  ('zakupki_gov_223fz', 'Запрос предложений',                'Запрос предложений'),
                  ('zakupki_gov_223fz', 'Закупка у единственного поставщика','Закупка у единственного поставщика'),
                  -- roseltorg (тип из div.search-results__type)
                  ('roseltorg_44fz', 'Электронный аукцион',                  'Электронный аукцион'),
                  ('roseltorg_44fz', 'Электронный запрос котировок',         'Запрос котировок'),
                  ('roseltorg_44fz', 'Открытый конкурс',                     'Открытый конкурс'),
                  ('roseltorg_44fz', 'Запрос котировок',                     'Запрос котировок'),
                  ('roseltorg_44fz', 'Запрос предложений',                   'Запрос предложений'),
                  ('roseltorg_223fz', 'Электронный аукцион',                 'Электронный аукцион'),
                  ('roseltorg_223fz', 'Электронный запрос котировок',        'Запрос котировок'),
                  ('roseltorg_223fz', 'Открытый конкурс',                    'Открытый конкурс'),
                  ('roseltorg_223fz', 'Аукцион',                             'Аукцион'),
                  ('roseltorg_223fz', 'Запрос котировок',                    'Запрос котировок'),
                  -- fabrikant (дропдаун «Тип процедуры» + значения карточек)
                  ('fabrikant', 'Электронный аукцион',                       'Электронный аукцион'),
                  ('fabrikant', 'Электронный аукцион 44-ФЗ',                 'Электронный аукцион'),
                  ('fabrikant', 'Электронный конкурс 44-ФЗ',                 'Электронный конкурс'),
                  ('fabrikant', 'Электронный запрос котировок 44-ФЗ',        'Запрос котировок'),
                  ('fabrikant', 'Электронный конкурс в соответствии с ч.19 ст.48 44-ФЗ', 'Электронный конкурс'),
                  ('fabrikant', 'Аукцион',                                   'Аукцион'),
                  ('fabrikant', 'Аукцион продавца',                          'Аукцион продавца'),
                  ('fabrikant', 'Конкурс',                                   'Конкурс'),
                  ('fabrikant', 'Конкурс продавца',                          'Конкурс продавца'),
                  ('fabrikant', 'Запрос котировок',                          'Запрос котировок'),
                  ('fabrikant', 'Запрос предложений',                        'Запрос предложений'),
                  ('fabrikant', 'Запрос цен',                                'Запрос цен'),
                  ('fabrikant', 'Ценовой запрос',                            'Ценовой запрос'),
                  ('fabrikant', 'Запрос оферт',                              'Запрос оферт'),
                  ('fabrikant', 'Анализ предложений',                        'Анализ предложений'),
                  ('fabrikant', 'Предварительный отбор',                     'Предварительный отбор'),
                  ('fabrikant', 'Публичное предложение (по типу голландского аукциона)', 'Публичное предложение'),
                  ('fabrikant', 'Публичное предложение продавца',            'Публичное предложение продавца'),
                  ('fabrikant', 'Закупка у единственного поставщика',        'Закупка у единственного поставщика'),
                  ('fabrikant', 'МСП в электронном магазине без приёма предложений', 'МСП в электронном магазине без приёма предложений'),
                  -- b2b-center (тип до «№» в заголовке)
                  ('b2b_center', 'Запрос предложений',                       'Запрос предложений'),
                  ('b2b_center', 'Запрос котировок',                         'Запрос котировок'),
                  ('b2b_center', 'Аукцион',                                  'Аукцион'),
                  ('b2b_center', 'Исследование рынка',                       'Исследование рынка'),
                  ('b2b_center', 'Запрос цен',                               'Запрос цен'),
                  ('b2b_center', 'Запрос ТКП',                               'Запрос ТКП'),
                  -- lot-online 44-ФЗ / 223-ФЗ
                  ('lot_online_44', 'Электронный аукцион',                   'Электронный аукцион'),
                  ('lot_online_44', 'Открытый конкурс',                      'Открытый конкурс'),
                  ('lot_online_44', 'Запрос котировок',                      'Запрос котировок'),
                  ('lot_online_44', 'Запрос предложений',                    'Запрос предложений'),
                  ('lot_online_223', 'Аукцион',                              'Аукцион'),
                  ('lot_online_223', 'Конкурс',                              'Конкурс'),
                  ('lot_online_223', 'Открытый конкурс',                     'Открытый конкурс'),
                  ('lot_online_223', 'Запрос котировок',                     'Запрос котировок'),
                  ('lot_online_223', 'Запрос предложений',                   'Запрос предложений'),
                  -- ЭТП ГПБ
                  ('etpgpb', 'Аукцион',                                      'Аукцион'),
                  ('etpgpb', 'Конкурс',                                      'Конкурс'),
                  ('etpgpb', 'Запрос котировок',                             'Запрос котировок'),
                  ('etpgpb', 'Запрос предложений',                           'Запрос предложений'),
                  -- Портал поставщиков Москвы (категории реестра)
                  ('zakupki_mos', 'Закупка по потребностям',                 'Закупка по потребностям'),
                  ('zakupki_mos', 'Котировочная сессия',                     'Котировочная сессия'),
                  ('zakupki_mos', 'Конкурентная процедура',                  'Конкурентная процедура'),
                  ('zakupki_mos', 'B2B-закупка',                             'B2B-закупка')
              ) AS m(platform_id, native_name, canonical)
              JOIN procedure_types t
                ON t.normalized_name = lower(trim(regexp_replace(m.canonical, '[[:space:]]+', ' ', 'g')))
              ON CONFLICT (platform_id, normalized_name) DO NOTHING;

              -- 6) backfill существующих данных: сначала «сырые» типы из detail_json,
              --    которых нет в справочнике (fallback), затем проставление procedure_type_id
              --    через маппинг, иначе по совпадению нормализованного имени
              INSERT INTO procedure_types (name, normalized_name, is_canonical)
              SELECT DISTINCT ON (norm) native, norm, false
              FROM (
                  SELECT detail_json ->> 'purchase_type' AS native,
                         lower(trim(regexp_replace(detail_json ->> 'purchase_type', '[[:space:]]+', ' ', 'g'))) AS norm
                  FROM procurements
                  WHERE detail_json ->> 'purchase_type' IS NOT NULL
                    AND trim(detail_json ->> 'purchase_type') <> ''
              ) x
              ORDER BY norm
              ON CONFLICT (normalized_name) DO NOTHING;

              UPDATE procurements p
              SET procedure_type_id = COALESCE(
                  (SELECT m.procedure_type_id FROM procedure_type_mappings m
                   WHERE m.platform_id = p.source_platform
                     AND m.normalized_name = lower(trim(regexp_replace(p.detail_json ->> 'purchase_type', '[[:space:]]+', ' ', 'g')))),
                  (SELECT t.id FROM procedure_types t
                   WHERE t.normalized_name = lower(trim(regexp_replace(p.detail_json ->> 'purchase_type', '[[:space:]]+', ' ', 'g')))),
                  p.procedure_type_id
              )
              WHERE p.detail_json ->> 'purchase_type' IS NOT NULL;

              CREATE INDEX ix_procurements_procedure_type_id ON procurements (procedure_type_id);
              CREATE INDEX ix_procedure_type_mappings_platform ON procedure_type_mappings (platform_id);

              COMMENT ON TABLE procedure_types IS 'Справочник типов процедур: канонические (is_canonical=true) и «сырые» от площадок';
              COMMENT ON COLUMN procedure_types.is_canonical IS 'true — канонический тип из предзагруженного справочника; false — «сырое» значение площадки без маппинга';
              COMMENT ON TABLE procedure_type_mappings IS 'Соответствие «площадка + родное значение» -> канонический тип процедуры';
              COMMENT ON COLUMN procurements.procedure_type_id IS 'Ссылка на тип процедуры (procedure_types.id)';

databaseChangeLog:
- changeSet:
    id: 75
    author: zakupki-parser
    comment: "site_sources: сайты-источники значений условий отчётных полей — статус и ход сбора текста сайта по всем страницам пагинации (сам текст — в S3, бакет site-sources); один нормализованный URL — одна строка."
    changes:
    - sql:
        splitStatements: false
        sql: |
          CREATE TABLE IF NOT EXISTS site_sources (
            id BIGSERIAL PRIMARY KEY,
            url_norm TEXT NOT NULL UNIQUE,
            url TEXT NOT NULL,
            status TEXT NOT NULL DEFAULT 'pending',
            stop_reason TEXT,
            pages INTEGER NOT NULL DEFAULT 0,
            text_chars INTEGER NOT NULL DEFAULT 0,
            progress JSONB NOT NULL DEFAULT '{}'::jsonb,
            cancel_requested BOOLEAN NOT NULL DEFAULT false,
            error TEXT,
            started_at TIMESTAMPTZ,
            finished_at TIMESTAMPTZ,
            fetched_at TIMESTAMPTZ,
            text_complete BOOLEAN NOT NULL DEFAULT false,
            created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
            updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
          );
          COMMENT ON TABLE site_sources IS
            'Сайты-источники значений условий отчётных полей: статус/ход сбора текста сайта; текст — в S3 (бакет site-sources).';
          COMMENT ON COLUMN site_sources.status IS
            'pending | running | complete (пагинация закончилась сама) | incomplete (лимит/отмена/не удалось перейти) | failed';

databaseChangeLog:
- changeSet:
    id: 80
    author: zakupki-parser
    comment: 'Справочник ОКПД2 (ОК 034-2014 (КПЕС 2008), ~20328 кодов): код+наименование,
      без иерархии (родитель/уровень кода не хранятся — см. TODO.md). Источник —
      сторонний открытый датасет github.com/prog815/okpd2, не официальный API
      Росстандарта.'
    changes:
    - sql:
        splitStatements: false
        sql: |
          CREATE TABLE IF NOT EXISTS okpd2_codes (
              id          bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
              code        varchar(20) NOT NULL,
              name        text        NOT NULL,
              created_at  timestamptz NOT NULL DEFAULT now(),
              updated_at  timestamptz NOT NULL DEFAULT now()
          );
          CREATE UNIQUE INDEX IF NOT EXISTS uq_okpd2_codes_code ON okpd2_codes (code);

          COMMENT ON TABLE okpd2_codes IS 'Справочник ОКПД2 (ОК 034-2014, код+наименование) — сторонний открытый датасет github.com/prog815/okpd2, не официальный API Росстандарта; сверить критичные коды при необходимости юридической точности.';
    - loadData:
        tableName: okpd2_codes
        file: okpd2_codes.csv
        relativeToChangelogFile: true
        separator: ','
        quotchar: '"'
        columns:
        - column:
            name: code
            type: STRING
        - column:
            name: name
            type: STRING

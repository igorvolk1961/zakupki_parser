databaseChangeLog:
- changeSet:
    id: 30
    author: zakupki-parser
    comment: 'Мультитенантность (BR-07): client_profiles->profiles (+user_id, is_active, target_*), procurement_scores->procurement_evaluations (+user_id, status, rejection_reason), users.email, таблицы keywords/procedure_categories, procurements.category_id'
    changes:
    - sql:
        splitStatements: false
        sql: |
          -- 1) users: email (подтверждение/жизненный цикл — пост-MVP, колонка зарезервирована)
          ALTER TABLE users ADD COLUMN email varchar(255);

          -- 2) client_profiles -> profiles (+user_id, is_active, target_etp/target_laws, min_fit_threshold)
          ALTER TABLE client_profiles RENAME TO profiles;
          ALTER TABLE profiles ADD COLUMN user_id bigint REFERENCES users(id) ON DELETE CASCADE;
          ALTER TABLE profiles ADD COLUMN is_active boolean NOT NULL DEFAULT false;
          ALTER TABLE profiles ADD COLUMN min_fit_threshold float;
          ALTER TABLE profiles ADD COLUMN target_etp jsonb NOT NULL DEFAULT '[]'::jsonb;
          ALTER TABLE profiles ADD COLUMN target_laws jsonb NOT NULL DEFAULT '[]'::jsonb;
          ALTER TABLE profiles DROP CONSTRAINT uq_client_profiles_name;
          ALTER TABLE profiles ADD CONSTRAINT uq_profiles_user_name UNIQUE (user_id, name);

          -- 3) procurement_scores -> procurement_evaluations (+user_id, status, rejection_reason)
          ALTER TABLE procurement_scores RENAME TO procurement_evaluations;
          ALTER TABLE procurement_evaluations DROP CONSTRAINT uq_procurement_scores_proc_client;
          DROP INDEX IF EXISTS ix_procurement_scores_client;
          ALTER TABLE procurement_evaluations ADD COLUMN user_id bigint REFERENCES users(id) ON DELETE CASCADE;
          ALTER TABLE procurement_evaluations ADD COLUMN status varchar(32) NOT NULL DEFAULT 'new';
          ALTER TABLE procurement_evaluations ADD COLUMN rejection_reason text;

          -- 4) backfill: существующие профили/оценки -> первому пользователю (сервис-аккаунт).
          --    Если пользователей ещё нет — user_id остаётся NULL, приложение присваивает
          --    осиротевшие строки сервис-аккаунту на старте (ensure_service_account, идемпотентно).
          UPDATE profiles SET user_id = (SELECT id FROM users ORDER BY id LIMIT 1) WHERE user_id IS NULL;
          UPDATE procurement_evaluations pe SET user_id = (SELECT pr.user_id FROM profiles pr WHERE pr.id = pe.client_id)
            WHERE pe.user_id IS NULL;

          ALTER TABLE procurement_evaluations DROP COLUMN client_id;
          ALTER TABLE procurement_evaluations ADD CONSTRAINT uq_evaluations_proc_user UNIQUE (procurement_id, user_id);
          CREATE INDEX ix_procurement_evaluations_user ON procurement_evaluations (user_id);
          CREATE INDEX ix_procurement_evaluations_procurement ON procurement_evaluations (procurement_id);

          -- 5) таблица keywords (нормализованные слова профиля; сид — data/key_words.md, этап 2)
          CREATE TABLE keywords (
              id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
              profile_id bigint NOT NULL REFERENCES profiles(id) ON DELETE CASCADE,
              word text NOT NULL,
              type varchar(16) NOT NULL DEFAULT 'keyword',
              created_at timestamptz NOT NULL DEFAULT now(),
              updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE INDEX ix_keywords_profile ON keywords (profile_id);

          -- 6) категории закупок (заглушка; pwin_coefficient пока не используется)
          CREATE TABLE procedure_categories (
              id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
              name text NOT NULL,
              pwin_coefficient float,
              created_at timestamptz NOT NULL DEFAULT now(),
              updated_at timestamptz NOT NULL DEFAULT now()
          );
          ALTER TABLE procurements ADD COLUMN category_id bigint REFERENCES procedure_categories(id) ON DELETE SET NULL;

          COMMENT ON TABLE profiles IS 'Профили фильтрации пользователей (user_id — tenant, BR-07)';
          COMMENT ON TABLE procurement_evaluations IS 'Per-user результаты скоринга (fit_score, p_win, margin, rag_report, status)';
          COMMENT ON TABLE keywords IS 'Нормализованные ключевые слова профиля (type: keyword|exclusion)';
          COMMENT ON TABLE procedure_categories IS 'Категории закупок по ОКПД2 (заглушка)';

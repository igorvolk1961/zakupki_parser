databaseChangeLog:
  - changeSet:
      id: 13
      author: zakupki-parser
      comment: "Колонка update_date (дата обновления закупки, стоп-порог) + пересоздание таблицы в логичном порядке колонок"
      changes:
        - sql:
            sql: |
              -- 1) таблица с нужным порядком колонок (update_date — после publication_date)
              CREATE TABLE procurements_new (
                  id bigint GENERATED BY DEFAULT AS IDENTITY,
                  number varchar(64) NOT NULL,
                  source_platform varchar(128) NOT NULL,
                  url varchar(1024),
                  customer text,
                  law varchar(16),
                  subject text,
                  nmck double precision,
                  publication_date timestamptz,
                  update_date timestamptz,
                  deadline timestamptz,
                  execution_term text,
                  security_amount double precision,
                  security_amount_unit varchar(16),
                  advance double precision,
                  okpd2_codes text,
                  kpgz_codes text,
                  technical_spec_url text,
                  technical_spec_name text,
                  files_json jsonb,
                  score double precision,
                  score_method varchar(64),
                  detail_json jsonb,
                  created_at timestamptz NOT NULL DEFAULT now(),
                  updated_at timestamptz NOT NULL DEFAULT now(),
                  CONSTRAINT procurements_new_pkey PRIMARY KEY (id),
                  CONSTRAINT procurements_new_number_platform_key UNIQUE (number, source_platform)
              );

              -- 2) перенос данных (update_date — из detail_json)
              INSERT INTO procurements_new (id, number, source_platform, url, customer, law, subject,
                  nmck, publication_date, update_date, deadline, execution_term, security_amount,
                  security_amount_unit, advance, okpd2_codes, kpgz_codes, technical_spec_url,
                  technical_spec_name, files_json, score, score_method, detail_json, created_at, updated_at)
              SELECT id, number, source_platform, url, customer, law, subject,
                  nmck, publication_date, (detail_json ->> 'update_date')::timestamptz, deadline,
                  execution_term, security_amount, security_amount_unit, advance, okpd2_codes,
                  kpgz_codes, technical_spec_url, technical_spec_name, files_json, score, score_method,
                  detail_json, created_at, updated_at
              FROM procurements;

              -- 3) синхронизация identity-последовательности
              SELECT setval(pg_get_serial_sequence('procurements_new', 'id'),
                            (SELECT COALESCE(max(id), 1) FROM procurements_new));

              -- 4) замена таблицы
              DROP TABLE procurements;
              ALTER TABLE procurements_new RENAME TO procurements;
              ALTER SEQUENCE procurements_new_id_seq RENAME TO procurements_id_seq;
              ALTER TABLE procurements RENAME CONSTRAINT procurements_new_pkey TO procurements_pkey;
              ALTER TABLE procurements RENAME CONSTRAINT procurements_new_number_platform_key TO uq_procurement_number_platform;

              CREATE INDEX ix_procurements_created_at ON procurements (created_at);

              -- 5) комментарии колонок
              COMMENT ON COLUMN procurements.id IS 'Внутренний идентификатор';
              COMMENT ON COLUMN procurements.number IS 'Реестровый номер закупки';
              COMMENT ON COLUMN procurements.source_platform IS 'Площадка (platform_id из config_dom.yaml)';
              COMMENT ON COLUMN procurements.url IS 'Ссылка на карточку закупки';
              COMMENT ON COLUMN procurements.customer IS 'Заказчик';
              COMMENT ON COLUMN procurements.law IS 'Закон/правовое основание (44-ФЗ/223-ФЗ/статья)';
              COMMENT ON COLUMN procurements.subject IS 'Предмет закупки';
              COMMENT ON COLUMN procurements.nmck IS 'Начальная (максимальная) цена контракта, ₽';
              COMMENT ON COLUMN procurements.publication_date IS 'Дата публикации закупки';
              COMMENT ON COLUMN procurements.update_date IS 'Дата обновления закупки (стоп-порог прохода)';
              COMMENT ON COLUMN procurements.deadline IS 'Срок окончания приёма заявок';
              COMMENT ON COLUMN procurements.execution_term IS 'Срок исполнения контракта';
              COMMENT ON COLUMN procurements.security_amount IS 'Обеспечение заявки/контракта, ₽';
              COMMENT ON COLUMN procurements.security_amount_unit IS 'Единица измерения обеспечения исполнения контракта: % (процент) или руб.';
              COMMENT ON COLUMN procurements.advance IS 'Аванс, ₽';
              COMMENT ON COLUMN procurements.okpd2_codes IS 'Коды ОКПД2 (один или несколько, через запятую)';
              COMMENT ON COLUMN procurements.kpgz_codes IS 'Коды КПГЗ (один или несколько, через запятую)';
              COMMENT ON COLUMN procurements.technical_spec_url IS 'URL файла ТЗ: в метаданном режиме — адрес скачивания с ЭТП; при download_files — URL сохранённой копии в хранилище (S3/MinIO)';
              COMMENT ON COLUMN procurements.technical_spec_name IS 'Имя файла технического задания';
              COMMENT ON COLUMN procurements.files_json IS 'Остальные файлы: [{name, url скачивания с ЭТП}]';
              COMMENT ON COLUMN procurements.score IS 'Скоринг закупки (Fit × P(win) × Margin)';
              COMMENT ON COLUMN procurements.score_method IS 'Способ скоринга: default | external | calculating | deadline_expired';
              COMMENT ON COLUMN procurements.detail_json IS 'Полный снимок переменных карточки (JSONB)';
              COMMENT ON COLUMN procurements.created_at IS 'Дата создания записи';
              COMMENT ON COLUMN procurements.updated_at IS 'Дата последнего обновления записи';

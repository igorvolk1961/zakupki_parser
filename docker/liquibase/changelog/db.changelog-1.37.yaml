databaseChangeLog:
- changeSet:
    id: 38
    author: zakupki-parser
    comment: 'Лицензии и подтверждённый опыт профиля (BR-03): справочники license_types и experience_confirmation_types, таблицы profile_licenses, profile_experience. Сид справочников применяет приложение (ensure_reference_data) на старте — единый источник истины'
    changes:
    - sql:
        splitStatements: false
        sql: |
          -- 1) справочник типов подтверждения опыта (сид BR-03 применяет ensure_reference_data)
          CREATE TABLE experience_confirmation_types (
              id          bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
              code        varchar(32) NOT NULL,
              name        text        NOT NULL,
              sort_order  integer     NOT NULL DEFAULT 0,
              created_at  timestamptz NOT NULL DEFAULT now(),
              updated_at  timestamptz NOT NULL DEFAULT now()
          );
          CREATE UNIQUE INDEX uq_experience_confirmation_types_code
              ON experience_confirmation_types (code);

          -- 2) справочник типов лицензий (сид применяет ensure_reference_data)
          CREATE TABLE license_types (
              id          bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
              code        varchar(32) NOT NULL,
              name        text        NOT NULL,
              sort_order  integer     NOT NULL DEFAULT 0,
              created_at  timestamptz NOT NULL DEFAULT now(),
              updated_at  timestamptz NOT NULL DEFAULT now()
          );
          CREATE UNIQUE INDEX uq_license_types_code ON license_types (code);

          -- 3) лицензии компании-заказчика работы тендеролога (профиль)
          CREATE TABLE profile_licenses (
              id              bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
              profile_id      bigint      NOT NULL REFERENCES profiles(id) ON DELETE CASCADE,
              license_type_id bigint      NOT NULL REFERENCES license_types(id) ON DELETE RESTRICT,
              name            text        NOT NULL,
              number          text,
              authority       text,
              issue_date      date,
              expiry_date     date,
              notes           text,
              created_at      timestamptz NOT NULL DEFAULT now(),
              updated_at      timestamptz NOT NULL DEFAULT now()
          );
          CREATE INDEX ix_profile_licenses_profile ON profile_licenses (profile_id);
          CREATE INDEX ix_profile_licenses_license_type_id ON profile_licenses (license_type_id);

          -- 4) подтверждённый опыт (профиль; тип подтверждения — справочник BR-03)
          CREATE TABLE profile_experience (
              id                   bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
              profile_id           bigint      NOT NULL REFERENCES profiles(id) ON DELETE CASCADE,
              title                text        NOT NULL,
              customer_name        text,
              contract_number      text,
              start_date           date,
              end_date             date,
              amount               float,
              confirmation_type_id bigint      NOT NULL REFERENCES experience_confirmation_types(id) ON DELETE RESTRICT,
              import_independent   boolean,
              notes                text,
              created_at           timestamptz NOT NULL DEFAULT now(),
              updated_at           timestamptz NOT NULL DEFAULT now()
          );
          CREATE INDEX ix_profile_experience_profile ON profile_experience (profile_id);
          CREATE INDEX ix_profile_experience_confirmation_type_id
              ON profile_experience (confirmation_type_id);

          COMMENT ON TABLE experience_confirmation_types IS 'Справочник типов подтверждения опыта (сид BR-03: platform/documents/registry, применяется ensure_reference_data)';
          COMMENT ON TABLE license_types IS 'Справочник типов лицензий (сид: набор для ИТ-компании, применяется ensure_reference_data)';
          COMMENT ON TABLE profile_licenses IS 'Лицензии компании-заказчика работы тендеролога (профиль, BR-07; тип — license_types)';
          COMMENT ON TABLE profile_experience IS 'Подтверждённый опыт компании (профиль, BR-07): тип подтверждения из experience_confirmation_types, флаг импортонезависимости';

databaseChangeLog:
- changeSet:
    id: 51
    author: zakupki-parser
    comment: 'license_types: удалён code (вид лицензии идентифицируется name); уникальность по name; состав заменён на 80 видов из docs/references/licenze_kind.md (перед применением лицензии профилей удалены — FK RESTRICT не конфликтует)'
    changes:
    - sql:
        splitStatements: false

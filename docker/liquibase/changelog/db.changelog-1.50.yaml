          --      (зависимый unique-constraint/index на код удаляется каскадом вместе с колонкой)
          ALTER TABLE license_types DROP COLUMN IF EXISTS code;
          CREATE UNIQUE INDEX IF NOT EXISTS uq_license_types_name ON license_types (name);

          -- 2) замена состава: 80 видов лицензий/допусков из docs/references/licenze_kind.md

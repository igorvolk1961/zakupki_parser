databaseChangeLog:
  - changeSet:
      id: 15
      author: zakupki-parser
      comment: "ADR-4: справочник заказчиков customers + customer_id; удаление колонки procurements.customer"
      changes:
        - sql:
            sql: |
              -- 1) справочник заказчиков
              CREATE TABLE customers (
                  id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  name text NOT NULL,
                  normalized_name text NOT NULL,
                  inn varchar(12),
                  rating double precision,
                  created_at timestamptz NOT NULL DEFAULT now(),
                  updated_at timestamptz NOT NULL DEFAULT now(),
                  CONSTRAINT uq_customers_normalized_name UNIQUE (normalized_name)
              );

              -- 2) связь procurements -> customers
              ALTER TABLE procurements ADD COLUMN customer_id bigint;
              ALTER TABLE procurements ADD CONSTRAINT fk_procurements_customer
                  FOREIGN KEY (customer_id) REFERENCES customers(id) ON DELETE SET NULL;

              -- 3) backfill из существующих данных (SQL-нормализация совпадает с Python normalize_name)
              INSERT INTO customers (name, normalized_name)
              SELECT DISTINCT ON (lower(trim(regexp_replace(customer, '[[:space:]]+', ' ', 'g'))))
                     customer,
                     lower(trim(regexp_replace(customer, '[[:space:]]+', ' ', 'g')))
              FROM procurements
              WHERE customer IS NOT NULL AND trim(customer) <> ''
              ORDER BY lower(trim(regexp_replace(customer, '[[:space:]]+', ' ', 'g')));

              UPDATE procurements p
              SET customer_id = c.id
              FROM customers c
              WHERE lower(trim(regexp_replace(p.customer, '[[:space:]]+', ' ', 'g'))) = c.normalized_name;

              -- 4) удаление денормализованной колонки
              ALTER TABLE procurements DROP COLUMN customer;

              CREATE INDEX ix_procurements_customer_id ON procurements (customer_id);

              COMMENT ON TABLE customers IS 'Справочник заказчиков (ADR-4)';
              COMMENT ON COLUMN customers.name IS 'Наименование заказчика (как на площадке)';
              COMMENT ON COLUMN customers.normalized_name IS 'Нормализованное наименование (ключ дедупликации)';
              COMMENT ON COLUMN customers.inn IS 'ИНН (nullable; заполняется универсальным механизмом)';
              COMMENT ON COLUMN customers.rating IS 'Рейтинг заказчика (заполняется через API внешним сервисом)';
              COMMENT ON COLUMN procurements.customer_id IS 'Ссылка на заказчика (customers.id)';

databaseChangeLog:
- changeSet:
    id: 29
    author: zakupki-parser
    comment: 'Многоклиентский скоринг: client_profiles + procurement_scores, сид default-профиля, backfill существующих скорингов'
    changes:
    - sql:
        splitStatements: false
        sql: |
          -- 1) клиентские профили тендеролога
          CREATE TABLE client_profiles (
              id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
              name text NOT NULL,
              enabled boolean NOT NULL DEFAULT true,
              competencies text NOT NULL,
              keywords jsonb NOT NULL DEFAULT '[]'::jsonb,
              exclusion_words jsonb NOT NULL DEFAULT '[]'::jsonb,
              keyword_context_regexes jsonb NOT NULL DEFAULT '{}'::jsonb,
              questions jsonb NOT NULL DEFAULT '[]'::jsonb,
              created_at timestamptz NOT NULL DEFAULT now(),
              updated_at timestamptz NOT NULL DEFAULT now(),
              CONSTRAINT uq_client_profiles_name UNIQUE (name)
          );

          -- 2) per-client результаты скоринга
          CREATE TABLE procurement_scores (
              id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
              procurement_id bigint NOT NULL REFERENCES procurements(id) ON DELETE CASCADE,
              client_id bigint NOT NULL REFERENCES client_profiles(id) ON DELETE CASCADE,
              fit_score float,
              score float,
              p_win float,
              margin float,
              score_method text NOT NULL DEFAULT 'default',
              rag_report jsonb,
              created_at timestamptz NOT NULL DEFAULT now(),
              updated_at timestamptz NOT NULL DEFAULT now(),
              CONSTRAINT uq_procurement_scores_proc_client UNIQUE (procurement_id, client_id)
          );

          CREATE INDEX ix_client_profiles_enabled ON client_profiles (enabled);
          CREATE INDEX ix_procurement_scores_procurement ON procurement_scores (procurement_id);
          CREATE INDEX ix_procurement_scores_client ON procurement_scores (client_id);

          -- 3) сид профиля default (компетенции из scoring_service/data/competencies.md,
          --    ключевые слова и regex-паттерны из config_service.yaml)
          INSERT INTO client_profiles (name, enabled, competencies, keywords, exclusion_words, keyword_context_regexes, questions)
          VALUES (
              'default', true,
              $COMP$# Компетенции поставщика

          Поставщик — **BBK IT** (ООО «Юнити»), «внедрение AI в бизнес». Профиль составлен по
          официальному сайту bbk-it.pro и материалам проекта (docs/references/task.md,
          docs/references/bbk-it-site.md).

          BBK IT — архитекторы бизнес-процессов: сначала проектирует, как должен работать бизнес
          клиента, потом внедряет ИИ, который это реализует. Пилот за 2 недели, поддержка 24/7,
          сопровождение и развитие внедрённых решений.

          ## Основные компетенции

          1. **Аудит и обследование ИТ-ландшафта и бизнес-процессов** — изучение текущего состояния,
             оценка уровня автоматизации, аудит применимости ИИ, AS-IS/TO-BE, проектирование целевой
             архитектуры, дорожные карты внедрения, финансовые модели и расчёт эффекта автоматизации.
          2. **Автоматизация и проектирование бизнес-процессов** — поиск узких мест, проектирование
             целевых процессов, автоматизация операционных задач, интеграция CRM, ERP, бухгалтерских
             и складских систем в единый поток, настройка автоматических триггеров, уведомлений и отчётов.
          3. **Внедрение ИИ-решений** — разработка и внедрение ИИ-ассистентов (свод данных из
             CRM/ERP/Excel, дашборды в реальном времени, ответы на основе базы знаний/RAG),
             ИИ-юристов (анализ договоров, поиск рисков), ИИ-менеджеров (ведение сделок в CRM,
             коммерческие предложения), ИИ-аналитики (тренды, прогнозы, выявление аномалий),
             ИИ-колл-центра (распознавание и тональность речи, оценка звонков через LLM).
          4. **Разработка и сопровождение программного обеспечения** — проектирование и разработка
             веб-платформ, мобильных приложений и внутренних сервисов от MVP до масштабирования;
             дообучение моделей, техническая поддержка и развитие решений.
          5. **Создание AI-контента** — генерация видео и изображений с помощью ИИ для рекламы,
             визуалов и соцсетей.

          ## НЕ входят в компетенции

          - Продажа, поставка и лицензирование прав на чужое готовое программное обеспечение.
          - Сопровождение, техническая поддержка и обслуживание готовых legacy-систем сторонних
            вендоров — если это просто поддержка/обновление существующего чужого продукта без
            внедрения ИИ и автоматизации.
          - Поставка, монтаж и настройка аппаратуры и оборудования.
          - Аудио- и видеоаппаратура, системы видеонаблюдения, звукозаписи и связи.
          - Физические, строительные, монтажные и иные не-ИТ работы.
          $COMP$,
              '["искусственный интеллект", "ИИ", "автоматизация"]'::jsonb,
              '[]'::jsonb,
              '{"ИИ": "(?<!\\w)ИИ(?!\\w)", "автоматизация": "автоматизаци\\w*"}'::jsonb,
              '[]'::jsonb
          ) ON CONFLICT (name) DO NOTHING;

          -- 4) backfill: существующие скоринги переносим под профиль default
          INSERT INTO procurement_scores (procurement_id, client_id, fit_score, score, p_win, margin, score_method)
          SELECT p.id, c.id, p.fit_score, p.score, p.p_win, p.margin, COALESCE(p.score_method, 'default')
          FROM procurements p
          JOIN client_profiles c ON c.name = 'default'
          ON CONFLICT (procurement_id, client_id) DO NOTHING;

          COMMENT ON TABLE client_profiles IS 'Клиентские профили тендеролога (компетенции, слова, вопросы к ТЗ)';
          COMMENT ON TABLE procurement_scores IS 'Per-client результаты скоринга (fit_score, p_win, margin, rag_report)';
          COMMENT ON COLUMN procurement_scores.score_method IS 'default | fit | pwin | margin | sim | manual | reject';

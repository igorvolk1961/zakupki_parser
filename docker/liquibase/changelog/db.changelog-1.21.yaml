databaseChangeLog:
  - changeSet:
      id: 23
      author: zakupki-parser
      comment: "Справочник платформ platforms (platform_id/name/url); procurements.source_platform -> platform_id"
      changes:
        - sql:
            sql: |
              -- 1) справочник платформ: ключ (совпадает с конфигами dom/<platform_id>.yaml),
              --    официальное наименование и главная страница
              CREATE TABLE platforms (
                  id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  platform_id varchar(128) NOT NULL,
                  name text NOT NULL,
                  url text NOT NULL,
                  created_at timestamptz NOT NULL DEFAULT now(),
                  updated_at timestamptz NOT NULL DEFAULT now(),
                  CONSTRAINT uq_platforms_platform_id UNIQUE (platform_id)
              );

              -- 2) единое именование ключа платформы: procurements.source_platform -> platform_id
              ALTER TABLE procurements RENAME COLUMN source_platform TO platform_id;

              -- 3) сид из конфигов configs/dom/*.yaml (10 площадок)
              INSERT INTO platforms (platform_id, name, url) VALUES
                  ('zakupki_mos',       'Портал поставщиков Москвы',   'https://zakupki.mos.ru'),
                  ('zakupki_gov_44fz',  'ЕИС (44-ФЗ)',                 'https://zakupki.gov.ru'),
                  ('zakupki_gov_223fz', 'ЕИС (223-ФЗ)',                'https://zakupki.gov.ru'),
                  ('roseltorg_44fz',    'Росэлторг (44-ФЗ)',           'https://www.roseltorg.ru'),
                  ('roseltorg_223fz',   'Росэлторг (223-ФЗ)',          'https://www.roseltorg.ru'),
                  ('fabrikant',         'Фабрикант',                   'https://fabrikant.ru'),
                  ('b2b_center',        'B2B-Center',                  'https://www.b2b-center.ru'),
                  ('etpgpb',            'ЭТП ГПБ',                     'https://etpgpb.ru'),
                  ('lot_online_44',     'lot-online РАД (44-ФЗ)',      'https://gz.lot-online.ru'),
                  ('lot_online_223',    'lot-online РАД (223-ФЗ)',     'https://tender.lot-online.ru')
              ON CONFLICT (platform_id) DO NOTHING;

              -- 4) backfill: ключи из существующих данных, которых нет в сиде
              --    (исторические/внешние платформы) — с ключом в качестве имени
              INSERT INTO platforms (platform_id, name, url)
              SELECT DISTINCT platform_id, platform_id, ''
              FROM procurements
              ON CONFLICT (platform_id) DO NOTHING;

              CREATE INDEX ix_platforms_platform_id ON platforms (platform_id);

              COMMENT ON TABLE platforms IS 'Справочник платформ (ключ, официальное имя, главная страница)';
              COMMENT ON COLUMN platforms.platform_id IS 'Ключ платформы (совпадает с configs/dom/<platform_id>.yaml)';
              COMMENT ON COLUMN procurements.platform_id IS 'Ключ платформы-источника (platforms.platform_id)';

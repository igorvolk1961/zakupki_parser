databaseChangeLog:
- changeSet:
    id: 55
    author: zakupki-parser
    comment: 'Аккаунты пользователей (user_accounts) и триал-режим: DDL. Таблица именованных наборов платных опций (options jsonb, активен один), колонка users.trial_end_at. DDL отделён от бэкфилла (changeSet 56): ALTER TABLE users не держит ACCESS EXCLUSIVE на время заполнения данными.'
    changes:
    - sql:
        splitStatements: false
        sql: |
          CREATE TABLE IF NOT EXISTS user_accounts (
              id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
              user_id bigint NOT NULL REFERENCES users(id) ON DELETE CASCADE,
              name text NOT NULL,
              options jsonb NOT NULL DEFAULT '{}'::jsonb,
              is_active boolean NOT NULL DEFAULT false,
              created_at timestamptz NOT NULL DEFAULT now(),
              updated_at timestamptz NOT NULL DEFAULT now()
          );
          -- Идемпотентное добавление уникальности (user_id, name): у созданной выше
          -- таблицы констрейнт уже есть; гарантия на случай частичного применения.
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint WHERE conname = 'uq_user_accounts_user_name'
            ) THEN
              ALTER TABLE user_accounts
                ADD CONSTRAINT uq_user_accounts_user_name UNIQUE (user_id, name);
            END IF;
          END
          $$;
          CREATE INDEX IF NOT EXISTS ix_user_accounts_user ON user_accounts (user_id);
          ALTER TABLE users ADD COLUMN IF NOT EXISTS trial_end_at timestamptz;
          COMMENT ON TABLE user_accounts IS 'Аккаунты пользователей: именованные наборы платных опций (options jsonb), активен один (is_active)';
          COMMENT ON COLUMN users.trial_end_at IS 'Окончание триал-режима (NULL — нет триала); в триале все опции поиска и скоринга бесплатны';
- changeSet:
    id: 56
    author: zakupki-parser
    comment: 'Аккаунты пользователей: бэкфилл. Существующим пользователям (без аккаунтов) — активный аккаунт «По умолчанию» со всеми платными опциями: до введения аккаунтов пользователь имел полный доступ, менять его поведение миграцией не должны. Новые пользователи получают аккаунт с бесплатными опциями через ensure_default_account/регистрацию (код). Идемпотентно.'
    changes:
    - sql:
        splitStatements: false
        sql: |
          INSERT INTO user_accounts (user_id, name, options, is_active)
          SELECT u.id, 'По умолчанию',
                 '{"scoring": true, "analysis_embeddings": true, "analysis": true, "pwin": true, "margin": true}'::jsonb,
                 true
          FROM users u
          WHERE NOT EXISTS (
              SELECT 1 FROM user_accounts a WHERE a.user_id = u.id
          )
          ON CONFLICT (user_id, name) DO NOTHING;
